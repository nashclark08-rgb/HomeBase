<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;background:#F2F2F7;display:flex;flex-direction:column}
#app{display:flex;flex-direction:column;width:100%;height:100%;overflow:hidden}
.topbar{background:#1C3A6B;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;padding-top:max(10px,env(safe-area-inset-top))}
.screen{flex:1;display:flex;flex-direction:column;overflow:hidden;background:#F2F2F7;position:relative}
.tabbar{background:rgba(249,249,249,0.97);backdrop-filter:blur(20px);border-top:0.5px solid rgba(0,0,0,0.15);display:flex;flex-shrink:0;padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 0 6px;border:none;background:transparent;cursor:pointer;gap:2px;font-family:inherit;font-size:9px;font-weight:600;color:#8E8E93;min-width:0}
.tab.active{color:#1C3A6B}
.scroll-view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;-ms-overflow-style:none;scrollbar-width:none}
.scroll-view::-webkit-scrollbar{display:none}
.card{background:#fff;border-radius:16px;margin:0 16px;box-shadow:0 1px 6px rgba(0,0,0,0.08);overflow:hidden}
.sh{padding:8px 16px 4px;font-size:12px;font-weight:700;color:#8E8E93;text-transform:uppercase;letter-spacing:0.6px}
.row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid #F2F2F7}
.row:last-child{border-bottom:none}
.btn{border:none;cursor:pointer;font-family:inherit;background:none;padding:0}
.back-btn{display:flex;align-items:center;gap:4px;color:#1C3A6B;font-size:15px;font-weight:500;border:none;background:none;cursor:pointer;font-family:inherit}
.primary-btn{width:100%;padding:16px;border:none;border-radius:14px;background:#1C3A6B;color:#fff;font-size:17px;font-weight:600;cursor:pointer;font-family:inherit}
.primary-btn:active{opacity:0.8}
.secondary-btn{width:100%;padding:16px;border:none;border-radius:14px;background:#F2F2F7;color:#1C1C1E;font-size:17px;font-weight:600;cursor:pointer;font-family:inherit}
.green-btn{width:100%;padding:16px;border:none;border-radius:14px;background:#34C759;color:#fff;font-size:17px;font-weight:600;cursor:pointer;font-family:inherit}
.input{width:100%;padding:14px 16px;border:1.5px solid #E5E5EA;border-radius:12px;font-size:16px;font-family:inherit;outline:none;background:#fff;color:#1C1C1E;-webkit-appearance:none}
.input:focus{border-color:#1C3A6B}
.err{color:#FF3B30;font-size:13px;text-align:center;min-height:16px;margin-top:4px}
.toggle{width:51px;height:31px;border-radius:16px;position:relative;cursor:pointer;transition:background 0.2s;flex-shrink:0;border:none;padding:0}
.thumb{position:absolute;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,0.22);transition:left 0.2s}
.cb{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;border:2px solid #C7C7CC;transition:all 0.15s}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;background-size:cover;background-position:center}
.pill{display:flex;align-items:center;gap:7px;padding:7px 14px 7px 7px;border-radius:24px;border:2px solid #E5E5EA;cursor:pointer;background:none;font-family:inherit;white-space:nowrap}
.day-btn{min-width:42px;padding:8px 6px;border-radius:10px;border:2px solid #E5E5EA;background:#fff;font-size:13px;font-weight:600;color:#8E8E93;cursor:pointer;font-family:inherit;transition:all 0.15s}
.day-btn.on{background:#1C3A6B;border-color:#1C3A6B;color:#fff}
.fab{position:absolute;bottom:16px;right:16px;z-index:10}
.fab-btn{width:56px;height:56px;border-radius:28px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:28px;color:#fff;transition:all 0.2s;font-family:inherit;box-shadow:0 4px 20px rgba(28,58,107,0.4)}
.fab-menu{position:absolute;bottom:66px;right:0;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.fab-item{display:flex;align-items:center;gap:10px;padding:11px 18px;background:#1C1C1E;border-radius:24px;border:none;cursor:pointer;font-family:inherit;color:#fff;font-size:15px;font-weight:600;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,0.25)}
.notif{position:absolute;top:10px;left:12px;right:12px;z-index:999;background:rgba(28,28,30,0.94);border-radius:16px;padding:12px 14px;cursor:pointer;animation:sdown 0.3s ease}
.chev::after{content:'';display:inline-block;width:7px;height:7px;border-right:2px solid #C7C7CC;border-top:2px solid #C7C7CC;transform:rotate(45deg);margin-left:4px}
.photo-wrap{width:88px;height:88px;border-radius:44px;border:3px dashed #C7C7CC;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;margin:0 auto;background:#F8F8F8;overflow:hidden}
.freq-btn{flex:1;padding:10px 6px;border-radius:10px;border:2px solid #E5E5EA;background:#fff;color:#8E8E93;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:all 0.15s}
.freq-btn.on{background:#EBF0FF;border-color:#1C3A6B;color:#1C3A6B}
.sub-tab{padding:12px 16px;font-size:15px;font-weight:600;border:none;background:transparent;cursor:pointer;font-family:inherit;border-bottom:3px solid transparent}
.sub-tab.on{color:#1C3A6B;border-bottom-color:#1C3A6B}
.sub-tab.off{color:#8E8E93}
.spinner{width:32px;height:32px;border:3px solid #E5E5EA;border-top-color:#1C3A6B;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes sdown{from{transform:translateY(-100%);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes packed{from{transform:scale(0.95);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>

// ── HELPERS ──────────────────────────────────────
const $=id=>document.getElementById(id);
function av(name,color,size,url){
  size=size||36;
  if(url)return '<div class="av" style="width:'+size+'px;height:'+size+'px;border:2px solid '+color+';background-image:url(\''+url+'\');flex-shrink:0"></div>';
  const ini=(name||'?').split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
  return '<div class="av" style="width:'+size+'px;height:'+size+'px;background:'+color+'22;border:2px solid '+color+';color:'+color+';font-size:'+Math.round(size*0.38)+'px;flex-shrink:0">'+ini+'</div>';
}
function bk(col){col=col||NAVY;return '<svg width="10" height="17" viewBox="0 0 10 17"><polyline points="9,1 1,8.5 9,16" stroke="'+col+'" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';}

function notify(msg,icon){
  icon=icon||'🏠';
  if(S.nTimer)clearTimeout(S.nTimer);
  S.notif={msg,icon};
  document.querySelectorAll('.notif').forEach(e=>e.remove());
  const el=document.createElement('div');el.className='notif';
  el.onclick=()=>{S.notif=null;el.remove();};
  el.innerHTML='<div style="display:flex;gap:10px;align-items:flex-start"><div style="width:34px;height:34px;border-radius:10px;background:'+NAVY+';display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0">'+icon+'</div><div style="flex:1"><div style="font-size:13px;font-weight:700;color:#fff;margin-bottom:2px">HomeBase</div><div style="font-size:13px;color:rgba(255,255,255,0.88);line-height:1.4">'+msg+'</div></div></div>';
  $('screen').appendChild(el);
  S.nTimer=setTimeout(()=>{S.notif=null;el.remove();},4000);
}

function go(sc,params){S.screen=sc;S.screenParams=params||{};S.fabOpen=false;render();}
function back(){S.screen=null;S.screenParams={};render();}
function setTab(t){S.tab=t;S.screen=null;S.screenParams={};S.morningMode=false;S.fabOpen=false;render();}
function gc(){return S.children.find(c=>c.id===S.activeChild)||S.children[0];}
function members(){return Object.entries(S.family&&S.family.members||{}).map(([uid,m])=>({uid,name:m.name,role:m.role,color:m.color||NAVY}));}

async function fw(){
  if(!navigator.geolocation||S.weather)return;
  navigator.geolocation.getCurrentPosition(async pos=>{
    try{
      const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude='+pos.coords.latitude+'&longitude='+pos.coords.longitude+'&current_weather=true&timezone=auto');
      const d=await r.json();
      const wc=d.current_weather?.weathercode||0;
      const icons={0:'☀️',1:'🌤',2:'⛅',3:'☁️',45:'🌫',51:'🌦',61:'🌧',71:'❄️',80:'🌧',95:'⛈'};
      const descs={0:'Sunny',1:'Mostly sunny',2:'Partly cloudy',3:'Cloudy',45:'Foggy',51:'Drizzle',61:'Rainy',71:'Snowy',80:'Showers',95:'Thunderstorm'};
      S.weather={temp:Math.round(d.current_weather?.temperature||20),icon:icons[wc]||'🌤',desc:descs[wc]||'Clear'};
      render();
    }catch(e){}
  },()=>{});
}

// ── FIREBASE ─────────────────────────────────────
async function createFamily(name){
  const code='HB-'+Math.random().toString(36).substr(2,6).toUpperCase();
  const r=await addDoc(collection(db,'families'),{name,inviteCode:code,createdBy:S.user.uid,createdAt:new Date(),members:{[S.user.uid]:{name:S.user.displayName,role:'Admin',color:NAVY}}});
  await setDoc(doc(db,'users',S.user.uid),{familyId:r.id,name:S.user.displayName});
  return r.id;
}
async function joinFamily(code){
  const q=query(collection(db,'families'),where('inviteCode','==',code.trim().toUpperCase()));
  const s=await getDocs(q);
  if(s.empty)throw new Error('Family not found');
  const fid=s.docs[0].id;
  await updateDoc(doc(db,'families',fid),{['members.'+S.user.uid]:{name:S.user.displayName,role:'Member',color:COLORS[Math.floor(Math.random()*COLORS.length)]}});
  await setDoc(doc(db,'users',S.user.uid),{familyId:fid,name:S.user.displayName});
  return fid;
}
const fid=()=>S.familyId;
const fcol=(p)=>collection(db,'families',fid(),...p);
const fdoc=(p)=>doc(db,'families',fid(),...p);
const fadd=(p,d)=>addDoc(fcol(p),{...d,createdAt:new Date()});
const fupd=(p,d)=>updateDoc(fdoc(p),d);
const fdel=(p)=>deleteDoc(fdoc(p));

function subscribe(){
  S.unsubs.forEach(u=>u());S.unsubs=[];
  S.unsubs.push(onSnapshot(doc(db,'families',fid()),s=>{S.family=s.data();render();}));
  S.unsubs.push(onSnapshot(fcol(['children']),s=>{
    S.children=s.docs.map(d=>({id:d.id,...d.data()}));
    if(!S.activeChild&&S.children.length)S.activeChild=S.children[0].id;
    S.children.forEach(c=>{
      const u=onSnapshot(fcol(['children',c.id,'packing']),ps=>{S.packing[c.id]=ps.docs.map(d=>({id:d.id,...d.data()}));render();});
      S.unsubs.push(u);
    });
    render();
  }));
  S.unsubs.push(onSnapshot(fcol(['events']),s=>{S.events=s.docs.map(d=>({id:d.id,...d.data()}));render();}));
  S.unsubs.push(onSnapshot(fcol(['assessments']),s=>{S.assessments=s.docs.map(d=>({id:d.id,...d.data()}));render();}));
  S.unsubs.push(onSnapshot(fcol(['groceries']),s=>{S.groceries=s.docs.map(d=>({id:d.id,...d.data()}));render();}));
  S.unsubs.push(onSnapshot(fcol(['gifts']),s=>{S.gifts=s.docs.map(d=>({id:d.id,...d.data()}));render();}));
}

function todayEventsForChild(child){
  return S.events.filter(ev=>{
    if(!ev.childId||ev.childId===child.id){
      if(!ev.freq||ev.freq==='once')return ev.date===todayStr;
      const start=new Date((ev.startDate||ev.date||todayStr)+'T12:00');
      const end=ev.endDate?new Date(ev.endDate+'T12:00'):null;
      const now=new Date(todayStr+'T12:00');
      if(now<start||(end&&now>end))return false;
      const dn=DAYSH[now.getDay()];
      if(!ev.days||!ev.days[dn])return false;
      if(ev.freq==='fortnightly'){
        const wks=Math.floor((now-start)/(7*86400000));
        return wks%2===0;
      }
      return true;
    }
    return false;
  }).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
}

  const child=gc();
  if(!child)return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;text-align:center">

// ── CALENDAR ──────────────────────────────────────
function sCalendar(){
  const wStart=new Date(today);
  wStart.setDate(today.getDate()-today.getDay()+1+S.calWeekOffset*7);
  const wDates=Array.from({length:7},(_,i)=>{const d=new Date(wStart);d.setDate(wStart.getDate()+i);return d;});
  const sel=S.calDate||todayStr;
  const dayEvs=S.events.filter(ev=>{
    if(!ev.freq||ev.freq==='once')return ev.date===sel;
    const start=new Date((ev.startDate||ev.date||sel)+'T12:00');
    const end=ev.endDate?new Date(ev.endDate+'T12:00'):null;
    const now=new Date(sel+'T12:00');
    if(now<start||(end&&now>end))return false;
    const dn=DAYSH[now.getDay()];
    return ev.days&&ev.days[dn];
  }).sort((a,b)=>(a.time||'').localeCompare(b.time||''));

  return `
    <div style="background:#fff;padding:14px 16px 0;border-bottom:1px solid #F2F2F7;flex-shrink:0">
      <div style="font-size:26px;font-weight:800;color:#1C1C1E;margin-bottom:12px">Calendar</div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
        <button class="btn" onclick="S.calWeekOffset--;render()" style="color:#1C3A6B;font-size:28px;padding:0 12px">‹</button>
        <div style="font-size:15px;font-weight:700">${MONTHS[wStart.getMonth()]} ${wStart.getFullYear()}</div>
        <button class="btn" onclick="S.calWeekOffset++;render()" style="color:#1C3A6B;font-size:28px;padding:0 12px">›</button>
      </div>
      <div style="display:flex;margin:0 -16px">
        ${wDates.map(d=>{
          const ds=fd(d),isSel=ds===sel,isTod=ds===todayStr;
          const evs=S.events.filter(e=>e.date===ds||(e.freq&&e.freq!=='once'&&(e.startDate||'')<=ds));
          return `<button class="btn" onclick="S.calDate='${ds}';render()" style="flex:1;display:flex;flex-direction:column;align-items:center;padding:6px 2px 12px;border-bottom:${isSel?'3px solid #1C3A6B':'3px solid transparent'}">
            <div style="font-size:10px;color:${isSel?'#1C3A6B':isTod?'#FF3B30':'#8E8E93'};font-weight:500;margin-bottom:4px">${DAYSH[d.getDay()]}</div>
            <div style="width:32px;height:32px;border-radius:16px;background:${isSel?'#1C3A6B':'transparent'};display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;color:${isSel?'#fff':isTod?'#FF3B30':'#1C1C1E'}">${d.getDate()}</div>
            <div style="display:flex;gap:2px;margin-top:4px">${evs.slice(0,3).map(e=>{const ec=S.children.find(c=>c.id===e.childId);return `<div style="width:5px;height:5px;border-radius:3px;background:${ec?.color||NAVY}"></div>`;}).join('')}</div>
          </button>`;
        }).join('')}
      </div>
    </div>
    <div class="scroll-view" style="padding:14px 0 80px">
      ${dayEvs.length===0?`<div style="text-align:center;padding:60px 20px"><div style="font-size:56px;margin-bottom:14px">🎉</div><div style="font-size:18px;font-weight:700;margin-bottom:6px">Nothing on!</div><div style="font-size:15px;color:#8E8E93">Tap + to add an event</div></div>`:
      `<div class="sh" style="margin-bottom:10px">${new Date(sel+'T12:00').toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'long'})}</div>
      ${dayEvs.map(ev=>{const ec=S.children.find(c=>c.id===ev.childId);const col=ec?.color||NAVY;return `<div style="width:calc(100% - 32px);margin:0 16px 10px;background:#fff;border-radius:16px;padding:14px 16px;box-shadow:0 1px 6px rgba(0,0,0,0.08)">
        <div style="display:flex;gap:12px">
          <div style="font-size:30px;flex-shrink:0">${ev.emoji||'📅'}</div>
          <div style="flex:1">
            <div style="font-size:16px;font-weight:700">${ev.title}</div>
            ${ev.freq&&ev.freq!=='once'?`<div style="font-size:12px;color:#1C3A6B;font-weight:600;text-transform:capitalize">🔄 ${ev.freq}</div>`:''}
            ${ev.time?`<div style="font-size:13px;color:#8E8E93">⏰ ${ev.time}</div>`:''}
            ${ev.location?`<div style="font-size:13px;color:#8E8E93">📍 ${ev.location}</div>`:''}
            ${ev.dropoff?`<div style="font-size:13px;color:#8E8E93">🚗 Drop-off: ${ev.dropoff}</div>`:''}

// ── MAIN RENDER ───────────────────────────────────
function render(){
  const sc=$('screen'),tb=$('tabbar');
  if(!sc)return;
  let html='',showTabs=false;

  if(!S.user){
    tb.style.display='none';
    html=S.screen==='signup'?sSignup():sLogin();
  } else if(!S.familyId){
    tb.style.display='none';
    html=sFamilySetup();
  } else if(S.screen){
    tb.style.display='none';
    const map={
      signup:sSignup,addChild:sAddChild,addEvent:sAddEvent,
      addPackItem:sAddPackItem,addNote:sAddNote,addAssessment:sAddAssessment,
      addGrocery:sAddGrocery,addGift:sAddGift,childProfile:sFamily
    };
    html=(map[S.screen]||sToday)();
  } else {
    showTabs=true;tb.style.display='flex';
    const map={today:sToday,calendar:sCalendar,events:sEvents,lists:sLists,family:sFamily,settings:sSettings};
    html=(map[S.tab]||sToday)();
  }

  sc.innerHTML=html;

  const tr=$('tb-right');
  if(tr)tr.textContent=S.user?(S.user.displayName||'').split(' ')[0]:'';

  if(showTabs){
    tb.innerHTML=[
      {id:'today',icon:'🏠',label:'Today'},
      {id:'calendar',icon:'📅',label:'Calendar'},
      {id:'events',icon:'📋',label:'Events'},
      {id:'lists',icon:'🛒',label:'Lists'},
      {id:'family',icon:'👨‍👩‍👧',label:'Family'},
      {id:'settings',icon:'⚙️',label:'Settings'}
    ].map(t=>`<button class="tab ${S.tab===t.id?'active':''}" onclick="setTab('${t.id}')"><span style="font-size:20px">${t.icon}</span>${t.label}</button>`).join('');
  }

  if(S.tab==='today'&&S.toggles.loc&&!S.weather)fw();
}

// ── ALL HANDLERS ──────────────────────────────────
window.hLogin=async()=>{
  const e=$('le')?.value?.trim(),p=$('lp')?.value,err=$('lerr');
  if(!e||!p){if(err)err.textContent='Please fill in all fields';return;}
  try{await signInWithEmailAndPassword(auth,e,p);}
  catch(ex){if(err)err.textContent=ex.code==='auth/invalid-credential'?'Incorrect email or password':ex.message.replace('Firebase:','').replace(/\(.*\)/,'').trim();}
};
window.hGoogle=async()=>{try{await signInWithPopup(auth,gp);}catch(ex){}};
window.hSignup=async()=>{
  const n=$('sn')?.value?.trim(),e=$('se')?.value?.trim(),p=$('sp')?.value,err=$('serr');
  if(!n||!e||!p){if(err)err.textContent='Please fill in all fields';return;}
  try{const c=await createUserWithEmailAndPassword(auth,e,p);await updateProfile(c.user,{displayName:n});S.user={...c.user,displayName:n};back();}
  catch(ex){if(err)err.textContent=ex.message.replace('Firebase:','').replace(/\(.*\)/,'').trim();}
};
window.hCreateFamily=async()=>{
  const n=$('fn')?.value?.trim(),err=$('ferr');
  if(!n){if(err)err.textContent='Enter a family name';return;}
  try{S.familyId=await createFamily(n);subscribe();render();}catch(ex){if(err)err.textContent=ex.message;}
};
window.hJoinFamily=async()=>{
  const c=$('fc')?.value?.trim(),err=$('jerr');
  if(!c){if(err)err.textContent='Enter a family code';return;}
  try{S.familyId=await joinFamily(c);subscribe();render();}catch(ex){if(err)err.textContent='Family not found. Check code and try again.';}
};
window.onPhoto=(input)=>{
  if(!input.files?.[0])return;
  const r=new FileReader();
  r.onload=e=>{
    $('photo-data').value=e.target.result;
    const p=$('photo-preview');
    if(p)p.innerHTML=`<img src="${e.target.result}" style="width:100%;height:100%;object-fit:cover"/>`;
  };
  r.readAsDataURL(input.files[0]);
};
window.hAddChild=async()=>{
  const name=$('cname')?.value?.trim(),dob=$('cdob')?.value,year=$('cyear')?.value?.trim(),school=$('cschool')?.value?.trim(),color=$('ccolor')?.value||NAVY,photoData=$('photo-data')?.value,err=$('cerr');
  if(!name){if(err)err.textContent='Please enter a name';return;}
  try{
    let photoURL='';
    if(photoData?.startsWith('data:')){
      try{const sr=sref(storage,'families/'+fid()+'/children/'+Date.now()+'.jpg');await uploadString(sr,photoData,'data_url');photoURL=await getDownloadURL(sr);}catch(se){console.log('Photo upload:',se.message);}
    }
    await fadd(['children'],{name,dob,year,school,color,photoURL});
    S.activeChild=null;back();notify(name+' added! 🎉');
  }catch(ex){if(err)err.textContent=ex.message;}
};
window.pickColor=c=>{$('ccolor').value=c;COLORS.forEach((col,i)=>{const el=$('col'+i);if(el)el.style.border=(col===c?'4px solid #1C1C1E':'4px solid transparent');});};

// Event form handlers
window.setFreq=freq=>{
  S.ef.freq=freq;
  // Update frequency buttons visually
  ['once','weekly','fortnightly'].forEach(f=>{
    const btn=$('freq-'+f);
    if(btn){
      btn.classList.toggle('on',f===freq);
    }
  });
  // Show/hide days section and date sections
  const daysSection=$('days-section');
  const dateOnce=$('date-once');
  const dateRecurring=$('date-recurring');
  if(daysSection)daysSection.style.display=freq==='once'?'none':'block';
  if(dateOnce)dateOnce.style.display=freq==='once'?'block':'none';
  if(dateRecurring)dateRecurring.style.display=freq==='once'?'none':'flex';
  // If elements not found, do full render (first load)
  if(!daysSection)render();
};
window.toggleDay=day=>{
  S.ef.days[day]=!S.ef.days[day];
  // Update button visually without full re-render
  const btn=$('day-'+day);
  if(btn){btn.classList.toggle('on',S.ef.days[day]);}
  else{render();}
};
window.pickEmoji=(e,i)=>{S.ef.emoji=e;EMOJIS.forEach((_,j)=>{const b=$('ep'+j);if(b)b.style.border=j===i?'3px solid #1C3A6B':'3px solid transparent';});};
window.addPackItemToEvent=()=>{
  const inp=$('ev-pack-inp');if(!inp?.value?.trim())return;
  S.ef.packItems.push(inp.value.trim());inp.value='';
  const list=$('ev-pack-list');
  if(list)list.innerHTML=S.ef.packItems.map((item,i)=>`<div style="display:flex;align-items:center;gap:8px;padding:8px 12px;background:#fff;border-radius:10px;border:1px solid #E5E5EA"><span style="flex:1;font-size:15px">${item}</span><button onclick="rmPackItem(${i})" style="color:#FF3B30;font-size:18px;border:none;background:none;cursor:pointer">×</button></div>`).join('');
};
window.rmPackItem=i=>{S.ef.packItems.splice(i,1);render();};
window.hSaveEvent=async()=>{
  const title=$('et')?.value?.trim(),err=$('everr');
  if(!title){if(err)err.textContent='Please enter a title';return;}
  const ef=S.ef;
  if(ef.freq==='once'&&!$('edate')?.value){if(err)err.textContent='Please select a date';return;}
  if(ef.freq!=='once'&&!Object.values(ef.days).some(v=>v)){if(err)err.textContent='Please select at least one day';return;}
  const dropRaw=$('edrop')?.value||'';
  const pickRaw=$('epick')?.value||'';
  const dropoff=dropRaw==='__other'?prompt('Enter drop-off person name:')||'':dropRaw;
  const pickup=pickRaw==='__other'?prompt('Enter pick-up person name:')||'':pickRaw;
  try{
    const childId=$('echild')?.value||'';
    await fadd(['events'],{
      title,emoji:ef.emoji||'📅',childId,
      freq:ef.freq,
      date:ef.freq==='once'?$('edate')?.value:'',
      startDate:ef.freq!=='once'?$('estartdate')?.value||fd(today):'',
      endDate:ef.freq!=='once'?$('eenddate')?.value||'':'',
      days:ef.freq!=='once'?{...ef.days}:{},
      time:$('etime')?.value?.trim()||'',
      location:$('eloc')?.value?.trim()||'',
      dropoff,pickup,
      packItems:[...ef.packItems],
      notes:$('enotes')?.value?.trim()||''
    });
    if(childId&&ef.packItems.length){
      for(const item of ef.packItems){try{await fadd(['children',childId,'packing'],{label:item,checked:false,pinned:false,section:'afterschool'});}catch(e){}}
    }
    S.ef={freq:'once',days:{Mon:false,Tue:false,Wed:false,Thu:false,Fri:false,Sat:false,Sun:false},packItems:[],emoji:'📅'};
    back();notify('Event saved! 📅');
  }catch(ex){if(err)err.textContent=ex.message;}
};
window.dEvent=async id=>{try{await fdel(['events',id]);notify('Event deleted','🗑️');}catch(ex){}};
window.tPack=async(cid,iid,val)=>{try{await fupd(['children',cid,'packing',iid],{checked:val===true||val==='true'});}catch(ex){}};
window.dPack=async(cid,iid)=>{try{await fdel(['children',cid,'packing',iid]);}catch(ex){}};
window.hAddPackItem=async()=>{
  const label=$('pil')?.value?.trim(),section=$('pis')?.value||'school',err=$('pierr');
  if(!label){if(err)err.textContent='Enter an item name';return;}
  try{await fadd(['children',S.screenParams.childId,'packing'],{label,checked:false,pinned:false,section});back();notify('Item added ✅');}
  catch(ex){if(err)err.textContent=ex.message;}
};
window.hAddNote=async()=>{
  const text=$('ntext')?.value?.trim(),childId=$('nchild')?.value,err=$('nerr');
  if(!text){if(err)err.textContent='Write a note first';return;}
  try{await fadd(['notes'],{text,childId});back();notify('Note saved 📝');}catch(ex){if(err)err.textContent=ex.message;}
};
window.hAddAssessment=async()=>{
  const childId=$('achild')?.value,subj=$('asubj')?.value?.trim(),title=$('atitle')?.value?.trim(),due=$('adue')?.value,err=$('aerr');
  if(!title||!due){if(err)err.textContent='Enter title and due date';return;}
  const daysLeft=Math.ceil((new Date(due+'T12:00')-today)/86400000);
  const dueDisplay=new Date(due+'T12:00').toLocaleDateString('en-AU',{day:'numeric',month:'short'});
  try{await fadd(['assessments'],{childId,subject:subj,title,due:dueDisplay,daysLeft});back();notify('Assessment added 📚');}
  catch(ex){if(err)err.textContent=ex.message;}
};
window.dAssessment=async id=>{try{await fdel(['assessments',id]);notify('Deleted','🗑️');}catch(ex){}};
window.tGroc=async(id,val)=>{try{await fupd(['groceries',id],{checked:val});}catch(ex){}};
window.dGroc=async id=>{try{await fdel(['groceries',id]);}catch(ex){}};
window.clearDone=async()=>{const done=S.groceries.filter(g=>g.addedToList&&g.checked);for(const g of done)try{await fdel(['groceries',g.id]);}catch(e){}notify('List cleared ✅');};
window.addFreq=async id=>{try{await fupd(['groceries',id],{addedToList:true});notify('Added to list ✅');}catch(ex){}};
let gIsFreq=false,gIsPriv=false;
window.toggleFreq=()=>{gIsFreq=!gIsFreq;const el=$('gfcb');if(el){el.style.background=gIsFreq?'#1C3A6B':'transparent';el.innerHTML=gIsFreq?ck():'';el.style.borderColor=gIsFreq?'#1C3A6B':'#C7C7CC';}};
window.togglePriv=()=>{gIsPriv=!gIsPriv;const el=$('gfpriv');if(el){el.style.background=gIsPriv?'#1C3A6B':'transparent';el.innerHTML=gIsPriv?ck():'';el.style.borderColor=gIsPriv?'#1C3A6B':'#C7C7CC';}};
window.hAddGrocery=async()=>{
  const label=$('gl')?.value?.trim(),qty=parseInt($('gq')?.value)||1,err=$('gerr');
  if(!label){if(err)err.textContent='Enter an item';return;}
  try{await fadd(['groceries'],{label,quantity:qty,isFrequent:gIsFreq,addedToList:true,checked:false});gIsFreq=false;back();notify('Added to list 🛒');}
  catch(ex){if(err)err.textContent=ex.message;}
};
window.hAddGift=async()=>{
  const label=$('gfl')?.value?.trim(),price=$('gfp')?.value,occasion=$('gfocc')?.value,err=$('gferr');
  if(!label){if(err)err.textContent='Enter a gift idea';return;}
  try{await fadd(['gifts'],{recipientId:S.screenParams.id,label,price:price?parseFloat(price):null,occasion,isPrivate:gIsPriv,createdBy:S.user.uid});gIsPriv=false;back();notify('Gift idea saved 🎁');}
  catch(ex){if(err)err.textContent=ex.message;}
};
window.dGift=async id=>{try{await fdel(['gifts',id]);}catch(ex){}};
window.hSignOut=async()=>{
  S.unsubs.forEach(u=>u());S.unsubs=[];
  Object.assign(S,{family:null,familyId:null,children:[],packing:{},events:[],assessments:[],groceries:[],gifts:[],screen:null,screenParams:{},tab:'today',morningMode:false,activeChild:null,fabOpen:false,notif:null,weather:null,evTab:'events',listTab:'menu',listFilter:'all',ef:{freq:'once',days:{Mon:false,Tue:false,Wed:false,Thu:false,Fri:false,Sat:false,Sun:false},packItems:[],emoji:'📅'}});
  await signOut(auth);
};
window.copyCode=()=>{const c=S.family?.inviteCode;if(c&&navigator.clipboard)navigator.clipboard.writeText(c).then(()=>notify('Family code copied! 🔗'));else alert('Code: '+(c||''));};
window.shareCode=()=>{
  const c=S.family?.inviteCode;if(!c)return;
  const text=`Join our family on HomeBase!\n\nVisit ourhomebase.com.au\nFamily code: ${c}`;
  if(navigator.share)navigator.share({title:'HomeBase Invite',text}).catch(()=>{});
  else if(navigator.clipboard)navigator.clipboard.writeText(text).then(()=>notify('Invite copied! 📤'));
};
window.go=go;window.back=back;window.setTab=setTab;

onAuthStateChanged(auth,async user=>{
  S.user=user;
  if(user){
    try{const ud=await getDoc(doc(db,'users',user.uid));if(ud.exists()&&ud.data().familyId){S.familyId=ud.data().familyId;subscribe();}}
    catch(ex){}
  }
  render();
});
