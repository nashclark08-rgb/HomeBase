<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>HomeBase</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;background:#1a1a1a;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px}
#phone{width:390px;height:844px;border-radius:48px;overflow:hidden;position:relative;background:#F2F2F7;box-shadow:0 40px 80px rgba(0,0,0,0.6);display:flex;flex-direction:column}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:126px;height:37px;border-radius:24px;background:#000;z-index:50;pointer-events:none}
.sb{position:absolute;top:0;left:0;right:0;height:59px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 8px;z-index:20;pointer-events:none}
.sb-time{font-size:17px;font-weight:600;color:#1C1C1E}
.main{display:flex;flex-direction:column;flex:1;padding-top:59px;overflow:hidden;position:relative}
.screen{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;background:#F2F2F7}
.scroll{overflow-y:auto;-ms-overflow-style:none;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{display:none}
.tabbar{background:rgba(249,249,249,0.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:0.5px solid rgba(0,0,0,0.12);display:flex;flex-shrink:0}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 0 6px;border:none;background:transparent;cursor:pointer;gap:2px;font-family:inherit;font-size:10px;font-weight:500;color:#8E8E93;transition:color 0.15s}
.tab.active{color:#007AFF}
.hb{height:8px;display:flex;justify-content:center;align-items:center;background:rgba(249,249,249,0.95);flex-shrink:0}
.hb-p{width:139px;height:5px;border-radius:100px;background:rgba(0,0,0,0.2)}

/* Cards & Layout */
.card{background:#fff;border-radius:16px;margin:0 16px;box-shadow:0 1px 4px rgba(0,0,0,0.08);overflow:hidden}
.sh{padding:8px 16px 4px;font-size:13px;font-weight:600;color:#8E8E93;text-transform:uppercase;letter-spacing:0.5px}
.row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid #F2F2F7}
.row:last-child{border-bottom:none}

/* Buttons */
.btn{border:none;cursor:pointer;font-family:inherit;background:none;-webkit-appearance:none}
.back-btn{border:none;cursor:pointer;color:#007AFF;font-size:17px;font-family:inherit;display:flex;align-items:center;gap:2px;padding:0;background:none}
.primary-btn{width:100%;padding:16px;border:none;border-radius:14px;background:#007AFF;color:#fff;font-size:17px;font-weight:600;cursor:pointer;font-family:inherit}
.primary-btn:active{opacity:0.85}
.secondary-btn{width:100%;padding:16px;border:none;border-radius:14px;background:#F2F2F7;color:#1C1C1E;font-size:17px;font-weight:600;cursor:pointer;font-family:inherit}
.danger-btn{width:100%;padding:16px;border:none;border-radius:14px;background:#FFF0F0;color:#FF3B30;font-size:17px;font-weight:600;cursor:pointer;font-family:inherit}

/* Inputs */
.input{width:100%;padding:14px 16px;border:1.5px solid #E5E5EA;border-radius:12px;font-size:16px;font-family:inherit;outline:none;background:#fff;-webkit-appearance:none}
.input:focus{border-color:#007AFF}
.err{color:#FF3B30;font-size:13px;text-align:center;min-height:18px;margin-top:4px}

/* Toggle */
.toggle{width:51px;height:31px;border-radius:16px;position:relative;cursor:pointer;transition:background 0.2s;flex-shrink:0;border:none;padding:0}
.toggle-t{position:absolute;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,0.22);transition:left 0.2s}

/* Checkbox */
.cb{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:all 0.15s;border:2px solid #C7C7CC}
.cb.on{border:none}

/* Avatar */
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;font-size:16px}

/* FAB */
.fab{position:absolute;bottom:16px;right:20px;z-index:10}
.fab-btn{width:56px;height:56px;border-radius:28px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:28px;color:#fff;transition:all 0.2s;font-family:inherit;box-shadow:0 4px 16px rgba(0,122,255,0.45)}
.fab-menu{position:absolute;bottom:66px;right:0;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.fab-item{display:flex;align-items:center;gap:10px;padding:11px 18px;background:#1C1C1E;border-radius:24px;border:none;cursor:pointer;box-shadow:0 4px 20px rgba(0,0,0,0.35);font-family:inherit;color:#fff;font-size:15px;font-weight:600;white-space:nowrap}

/* Notif */
.notif{position:absolute;top:12px;left:12px;right:12px;z-index:999;background:rgba(28,28,30,0.92);border-radius:16px;padding:12px 14px;box-shadow:0 8px 32px rgba(0,0,0,0.4);cursor:pointer;animation:sdown 0.35s cubic-bezier(.2,.8,.4,1)}

/* Child pill */
.cpill{display:flex;align-items:center;gap:8px;padding:8px 14px 8px 8px;border-radius:24px;border:2px solid transparent;cursor:pointer;background:none;font-family:inherit;transition:all 0.15s;white-space:nowrap}

/* Status badge */
.status{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px}

/* Animations */
@keyframes sdown{from{transform:translateY(-110%);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes packed{0%{transform:scale(0.95);opacity:0}60%{transform:scale(1.02)}100%{transform:scale(1);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:28px;height:28px;border:3px solid #E5E5EA;border-top-color:#007AFF;border-radius:50%;animation:spin 0.75s linear infinite}

/* Chev */
.chev::after{content:'';display:inline-block;width:7px;height:7px;border-right:2px solid #C7C7CC;border-top:2px solid #C7C7CC;transform:rotate(45deg);margin-left:4px;vertical-align:middle}
</style>
</head>
<body>
<div id="phone">
  <div class="island"></div>
  <div class="sb">
    <span class="sb-time" id="clock">9:41</span>
    <svg width="17" height="12" viewBox="0 0 17 12" fill="none"><rect x="0" y="7" width="3" height="5" rx="1" fill="#1C1C1E"/><rect x="4.5" y="5" width="3" height="7" rx="1" fill="#1C1C1E"/><rect x="9" y="2.5" width="3" height="9.5" rx="1" fill="#1C1C1E"/><rect x="13.5" y="0" width="3" height="12" rx="1" fill="#1C1C1E"/></svg>
  </div>
  <div class="main">
    <div class="screen" id="screen"><div style="flex:1;display:flex;align-items:center;justify-content:center"><div class="spinner"></div></div></div>
    <div class="tabbar" id="tabbar" style="display:none"></div>
    <div class="hb" id="hb" style="display:none"><div class="hb-p"></div></div>
  </div>
</div>

<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import{getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,onAuthStateChanged,updateProfile}from'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
import{getFirestore,doc,setDoc,getDoc,collection,addDoc,onSnapshot,updateDoc,deleteDoc,query,orderBy}from'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

const app=initializeApp({apiKey:"AIzaSyA2lrJJ0T_y_CBk8kOqRmwejCqHx6RVPXA",authDomain:"homebase-56151.firebaseapp.com",projectId:"homebase-56151",storageBucket:"homebase-56151.firebasestorage.app",messagingSenderId:"647157335008",appId:"1:647157335008:web:a15452fabd943bf5a8a185"});
const auth=getAuth(app);
const db=getFirestore(app);

// ── Live clock ──────────────────────────────────────────────
function updateClock(){const n=new Date();document.getElementById('clock').textContent=n.toLocaleTimeString('en-AU',{hour:'numeric',minute:'2-digit',hour12:false});}
updateClock();setInterval(updateClock,10000);

// ── State ───────────────────────────────────────────────────
const S={
  user:null,familyId:null,family:null,
  children:[],packing:{},events:[],notes:[],assessments:[],
  tab:'today',stack:[],
  activeChild:null,morningMode:false,
  calWeekOffset:0,selectedDate:null,
  listSection:null,listFilter:'all',
  fabOpen:false,notif:null,notifTimer:null,
  toggles:{faceID:true,notifs:true,loc:false,email:false},
  unsubs:[],
};

// ── Helpers ─────────────────────────────────────────────────
const $=id=>document.getElementById(id);
const CHILD_COLORS=['#007AFF','#34C759','#FF9500','#FF6B9D','#AF52DE','#FF3B30','#5856D6'];
const DAY_NAMES=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const DAY_SHORT=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTH_SHORT=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const today=new Date();
const todayStr=fmtDate(today);

function fmtDate(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function fmtDisplay(d){return`${DAY_NAMES[d.getDay()]} ${d.getDate()} ${MONTH_SHORT[d.getMonth()]}`;}

function av(name,color,size=36){
  const bg=color+'22';
  const fs=size*0.38;
  const ini=(name||'?').split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
  return`<div class="av" style="width:${size}px;height:${size}px;background:${bg};border:2px solid ${color};color:${color};font-size:${fs}px;flex-shrink:0">${ini}</div>`;
}
function chev(){return`<span class="chev"></span>`;}
function back(){return`<svg width="10" height="17" viewBox="0 0 10 17"><polyline points="9,1 1,8.5 9,16" stroke="#007AFF" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;}
function checkSvg(color='white'){return`<svg width="14" height="10" viewBox="0 0 14 10"><polyline points="1,5 5,9 13,1" stroke="${color}" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;}
function tog(val,fn){return`<button class="toggle" style="background:${val?'#34C759':'#E5E5EA'}" onclick="${fn}"><div class="toggle-t" style="left:${val?22:2}px"></div></button>`;}

function showNotif(msg){
  if(S.notifTimer)clearTimeout(S.notifTimer);
  S.notif=msg;_notif();
  S.notifTimer=setTimeout(()=>{S.notif=null;_notif();},4000);
}
function _notif(){
  document.querySelectorAll('.notif').forEach(e=>e.remove());
  if(!S.notif)return;
  const el=document.createElement('div');
  el.className='notif';
  el.onclick=()=>{S.notif=null;el.remove();};
  el.innerHTML=`<div style="display:flex;gap:10px;align-items:flex-start"><div style="width:36px;height:36px;border-radius:10px;background:#007AFF;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0">🏠</div><div style="flex:1"><div style="display:flex;justify-content:space-between"><span style="font-size:13px;font-weight:700;color:#fff">HomeBase</span><span style="font-size:12px;color:rgba(255,255,255,0.45)">now</span></div><div style="font-size:13px;color:rgba(255,255,255,0.9);margin-top:2px;line-height:1.4">${S.notif}</div></div></div>`;
  $('screen').appendChild(el);
}

function nav(sc,params={}){S.stack.push({screen:sc,params});S.fabOpen=false;render();}
function goBack(){S.stack.pop();render();}
function setTab(t){S.tab=t;S.stack=[];S.morningMode=false;S.fabOpen=false;render();}
function activeChild(){return S.children.find(c=>c.id===S.activeChild)||S.children[0];}

// ── Firebase ops ────────────────────────────────────────────
async function createFamily(name){
  const ref=await addDoc(collection(db,'families'),{name,createdBy:S.user.uid,createdAt:new Date(),members:{[S.user.uid]:{name:S.user.displayName,role:'Admin',color:'#007AFF'}}});
  await setDoc(doc(db,'users',S.user.uid),{familyId:ref.id,name:S.user.displayName});
  return ref.id;
}
async function joinFamily(fid){
  const snap=await getDoc(doc(db,'families',fid));
  if(!snap.exists())throw new Error('Family not found');
  await updateDoc(doc(db,'families',fid),{[`members.${S.user.uid}`]:{name:S.user.displayName,role:'Member',color:CHILD_COLORS[Math.floor(Math.random()*CHILD_COLORS.length)]}});
  await setDoc(doc(db,'users',S.user.uid),{familyId:fid,name:S.user.displayName});
  return fid;
}
async function addChild(data){await addDoc(collection(db,'families',S.familyId,'children'),{...data,createdAt:new Date()});}
async function addPackItem(childId,label){await addDoc(collection(db,'families',S.familyId,'children',childId,'packing'),{label,checked:false,pinned:false,section:'school',createdAt:new Date()});}
async function togglePack(childId,itemId,val){await updateDoc(doc(db,'families',S.familyId,'children',childId,'packing',itemId),{checked:val});}
async function deletePack(childId,itemId){await deleteDoc(doc(db,'families',S.familyId,'children',childId,'packing',itemId));}
async function addEvent(data){await addDoc(collection(db,'families',S.familyId,'events'),{...data,createdAt:new Date()});}
async function deleteEvent(id){await deleteDoc(doc(db,'families',S.familyId,'events',id));}
async function addNote(data){await addDoc(collection(db,'families',S.familyId,'notes'),{...data,date:todayStr,createdAt:new Date()});}
async function deleteNote(id){await deleteDoc(doc(db,'families',S.familyId,'notes',id));}
async function addAssessment(data){await addDoc(collection(db,'families',S.familyId,'assessments'),{...data,createdAt:new Date()});}
async function deleteAssessment(id){await deleteDoc(doc(db,'families',S.familyId,'assessments',id));}

function subscribe(){
  S.unsubs.forEach(u=>u());S.unsubs=[];
  // Family
  S.unsubs.push(onSnapshot(doc(db,'families',S.familyId),snap=>{S.family=snap.data();render();}));
  // Children
  S.unsubs.push(onSnapshot(collection(db,'families',S.familyId,'children'),snap=>{
    S.children=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(!S.activeChild&&S.children.length)S.activeChild=S.children[0].id;
    // sub packing per child
    S.children.forEach(c=>{
      const u=onSnapshot(collection(db,'families',S.familyId,'children',c.id,'packing'),ps=>{
        S.packing[c.id]=ps.docs.map(d=>({id:d.id,...d.data()}));render();
      });
      S.unsubs.push(u);
    });
    render();
  }));
  S.unsubs.push(onSnapshot(collection(db,'families',S.familyId,'events'),snap=>{S.events=snap.docs.map(d=>({id:d.id,...d.data()}));render();}));
  S.unsubs.push(onSnapshot(collection(db,'families',S.familyId,'notes'),snap=>{S.notes=snap.docs.map(d=>({id:d.id,...d.data()}));render();}));
  S.unsubs.push(onSnapshot(collection(db,'families',S.familyId,'assessments'),snap=>{S.assessments=snap.docs.map(d=>({id:d.id,...d.data()}));render();}));
}

// ── SCREENS ─────────────────────────────────────────────────

// Login
function renderLogin(){
  return`<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;padding:40px 28px">
    <div style="width:84px;height:84px;border-radius:22px;background:linear-gradient(145deg,#007AFF,#5856D6);display:flex;align-items:center;justify-content:center;font-size:40px;box-shadow:0 8px 32px rgba(0,122,255,0.3);margin-bottom:24px">🏠</div>
    <div style="font-size:26px;font-weight:800;color:#1C1C1E;letter-spacing:-0.5px;text-align:center;margin-bottom:6px">Welcome to HomeBase</div>
    <div style="font-size:14px;color:#8E8E93;text-align:center;line-height:1.5;margin-bottom:32px">Family logistics, made simple.<br>School mornings sorted in 30 seconds.</div>
    <div style="width:100%;display:flex;flex-direction:column;gap:12px">
      <input class="input" id="le" type="email" placeholder="Email address"/>
      <input class="input" id="lp" type="password" placeholder="Password"/>
      <div id="lerr" class="err"></div>
      <button class="primary-btn" onclick="hLogin()">Sign In</button>
      <button class="secondary-btn" onclick="nav('signup')">Create Account</button>
    </div>
  </div>`;
}

// Signup
function renderSignup(){
  return`<div style="flex:1;display:flex;flex-direction:column;background:#F2F2F7">
    <div style="background:#fff;padding:12px 16px 14px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #F2F2F7;flex-shrink:0">
      <button class="back-btn" onclick="goBack()">${back()}</button>
      <div style="flex:1;text-align:center;font-size:17px;font-weight:600">Create Account</div>
      <div style="width:44px"></div>
    </div>
    <div class="scroll" style="flex:1;overflow-y:auto;padding:24px 16px">
      <div style="display:flex;flex-direction:column;gap:12px">
        <input class="input" id="sn" type="text" placeholder="Your full name"/>
        <input class="input" id="se" type="email" placeholder="Email address"/>
        <input class="input" id="sp" type="password" placeholder="Password (min 6 characters)"/>
        <div id="serr" class="err"></div>
        <button class="primary-btn" onclick="hSignup()">Create Account</button>
      </div>
    </div>
  </div>`;
}

// Family setup
function renderFamilySetup(){
  return`<div style="flex:1;display:flex;flex-direction:column;background:#F2F2F7">
    <div style="background:#fff;padding:16px;border-bottom:1px solid #F2F2F7;text-align:center;flex-shrink:0">
      <div style="font-size:22px;font-weight:800;color:#1C1C1E">Set up your family</div>
      <div style="font-size:14px;color:#8E8E93;margin-top:4px">Hi ${S.user?.displayName||'there'}! 👋</div>
    </div>
    <div class="scroll" style="flex:1;overflow-y:auto;padding:20px 16px;display:flex;flex-direction:column;gap:16px">
      <div style="background:#fff;border-radius:16px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,0.08)">
        <div style="font-size:17px;font-weight:700;color:#1C1C1E;margin-bottom:4px">Create a new family</div>
        <div style="font-size:14px;color:#8E8E93;margin-bottom:14px">Start fresh and invite others to join</div>
        <input class="input" id="fn" type="text" placeholder="Family name (e.g. The Clarks)" style="margin-bottom:10px"/>
        <div id="ferr" class="err" style="margin-bottom:8px"></div>
        <button class="primary-btn" onclick="hCreateFamily()">Create Family</button>
      </div>
      <div style="text-align:center;color:#8E8E93;font-size:14px">— or —</div>
      <div style="background:#fff;border-radius:16px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,0.08)">
        <div style="font-size:17px;font-weight:700;color:#1C1C1E;margin-bottom:4px">Join existing family</div>
        <div style="font-size:14px;color:#8E8E93;margin-bottom:14px">Enter the family code shared by your partner</div>
        <input class="input" id="fc" type="text" placeholder="Family code" style="margin-bottom:10px;font-family:monospace"/>
        <div id="jerr" class="err" style="margin-bottom:8px"></div>
        <button class="primary-btn" style="background:#34C759" onclick="hJoinFamily()">Join Family</button>
      </div>
    </div>
  </div>`;
}

// Add child
function renderAddChild(){
  return`<div style="flex:1;display:flex;flex-direction:column;background:#F2F2F7">
    <div style="background:#fff;padding:12px 16px 14px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #F2F2F7;flex-shrink:0">
      <button class="back-btn" onclick="goBack()">${back()}</button>
      <div style="flex:1;text-align:center;font-size:17px;font-weight:600">Add Child</div>
      <div style="width:44px"></div>
    </div>
    <div class="scroll" style="flex:1;overflow-y:auto;padding:24px 16px">
      <div style="display:flex;flex-direction:column;gap:12px">
        <input class="input" id="cname" type="text" placeholder="Child's name"/>
        <input class="input" id="cyear" type="text" placeholder="Year / Grade (e.g. Year 4)"/>
        <input class="input" id="cschool" type="text" placeholder="School name"/>
        <div>
          <div style="font-size:15px;font-weight:600;color:#1C1C1E;margin-bottom:10px">Choose colour</div>
          <div style="display:flex;gap:10px;flex-wrap:wrap" id="cpicker">
            ${CHILD_COLORS.map((c,i)=>`<button onclick="selColor('${c}')" id="cp${i}" style="width:44px;height:44px;border-radius:22px;background:${c};border:${i===0?'4px solid #1C1C1E':'4px solid transparent'};cursor:pointer;transition:border 0.15s"></button>`).join('')}
          </div>
          <input type="hidden" id="ccolor" value="${CHILD_COLORS[0]}"/>
        </div>
        <div id="cerr" class="err"></div>
        <button class="primary-btn" onclick="hAddChild()">Add Child</button>
        <button class="secondary-btn" onclick="setTab('today')">Skip for now</button>
      </div>
    </div>
  </div>`;
}

// ── TODAY ───────────────────────────────────────────────────
function renderToday(){
  const child=activeChild();
  if(!child){
    return`<div style="background:#fff;padding:12px 16px 0;border-bottom:1px solid #F0F0F0;flex-shrink:0">
      <div style="font-size:26px;font-weight:800;color:#1C1C1E">${DAY_NAMES[today.getDay()]}</div>
      <div style="font-size:14px;color:#8E8E93;margin-top:1px">${fmtDisplay(today)}</div>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px">
      <div style="font-size:56px;margin-bottom:16px">🏠</div>
      <div style="font-size:20px;font-weight:700;color:#1C1C1E;margin-bottom:8px;text-align:center">Welcome to HomeBase!</div>
      <div style="font-size:15px;color:#8E8E93;text-align:center;line-height:1.5;margin-bottom:28px">Add your first child to get started with packing lists, school day tracking and pick-up coordination.</div>
      <button class="primary-btn" style="max-width:280px" onclick="nav('addChild')">Add Your First Child</button>
    </div>`;
  }

  const pk=S.packing[child.id]||[];
  const packed=pk.filter(p=>p.checked).length;

      <!-- Packing Checklist -->

      </div>
      <div class="card" style="margin-bottom:12px">
        ${pk.length===0?`<div style="padding:20px 16px;text-align:center">
          <div style="font-size:14px;color:#8E8E93;margin-bottom:12px">No items yet — add what ${child.name} needs for school</div>
          <button class="btn" onclick="nav('addPackItem',{childId:'${child.id}'})" style="color:#007AFF;font-size:15px;font-weight:600">+ Add Items</button>
        </div>`:''}
        ${pk.map((item,i)=>`<div style="display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:${i<pk.length-1?'1px solid #F2F2F7':'none'}">
          <div class="cb ${item.checked?'on':''}" style="${item.checked?'background:'+child.color+';':''}border-color:${item.checked?child.color:'#C7C7CC'}" onclick="togglePackItem('${child.id}','${item.id}',${!item.checked})">
            ${item.checked?checkSvg():''}
          </div>
          <span style="flex:1;font-size:16px;color:${item.checked?'#8E8E93':'#1C1C1E'};text-decoration:${item.checked?'line-through':'none'}">${item.label}</span>

        </div>`).join('')}
        ${pct===1&&pk.length>0?`<div style="padding:12px 16px;background:#EAFAF0;text-align:center;font-size:14px;font-weight:700;color:#34C759;animation:packed 0.4s ease">✅ All packed for ${child.name}!</div>`:''}

      <button class="btn" onclick="nav('addPackItem',{childId:'${child.id}'})" style="width:calc(100% - 32px);margin:0 16px 16px;padding:13px;border-radius:14px;border:2px dashed #C7C7CC;color:#007AFF;font-size:15px;font-weight:600">+ Add Packing Item</button>

        ${allEvs.map((ev,i,arr)=>{
          const ec=S.children.find(c=>c.id===ev.childId);
          const col=ec?.color||'#007AFF';
          return`<div style="display:flex;gap:12px;padding:10px 16px;position:relative;border-bottom:${i<arr.length-1?'1px solid #F2F2F7':'none'}">

            <div style="flex:1">
              <div style="font-size:15px;font-weight:600;color:#1C1C1E">${ev.title}</div>

        <button class="fab-item" onclick="nav('addNote')"><span style="font-size:18px">📝</span>Quick Note</button>
        <button class="fab-item" onclick="nav('addAssessment')"><span style="font-size:18px">📚</span>Add Assessment</button>
      </div>`:''}
      <button class="fab-btn" style="background:${S.fabOpen?'#636366':'#007AFF'};transform:${S.fabOpen?'rotate(45deg)':'none'}" onclick="S.fabOpen=!S.fabOpen;render()">+</button>
    </div>`;
}

// Morning Mode
function renderMorning(){
  const child=activeChild();
  if(!child){S.morningMode=false;return renderToday();}
  const color=child.color||'#007AFF';
  const pk=S.packing[child.id]||[];
  const packed=pk.filter(p=>p.checked).length;
  const pct=pk.length?packed/pk.length:0;
  const nxt=S.events.filter(e=>e.date===todayStr&&e.childId===child.id).sort((a,b)=>(a.time||'').localeCompare(b.time||''))[0];
  return`
    <div style="background:${color};padding:16px 20px 14px;flex-shrink:0">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div>
          <div style="font-size:12px;font-weight:700;color:rgba(255,255,255,0.7);letter-spacing:1px;margin-bottom:2px">MORNING MODE</div>
          <div style="font-size:24px;font-weight:800;color:#fff;letter-spacing:-0.5px">${DAY_NAMES[today.getDay()]} ${today.getDate()} ${MONTH_SHORT[today.getMonth()]}</div>
        </div>
        <button class="btn" onclick="S.morningMode=false;render()" style="background:rgba(255,255,255,0.22);border-radius:20px;padding:7px 16px;color:#fff;font-size:14px;font-weight:600">Done</button>
      </div>
      <div style="display:flex;gap:8px;margin-top:14px;overflow-x:auto;padding-bottom:2px">
        ${S.children.map(c=>`<button class="btn" onclick="S.activeChild='${c.id}';render()" style="display:flex;align-items:center;gap:7px;padding:7px 14px 7px 7px;border-radius:24px;border:2px solid ${S.activeChild===c.id?'#fff':'rgba(255,255,255,0.35)'};background:${S.activeChild===c.id?'rgba(255,255,255,0.22)':'transparent'};white-space:nowrap">
          ${av(c.name,S.activeChild===c.id?'#fff':c.color,28)}
          <span style="font-size:15px;font-weight:700;color:#fff">${c.name}</span>

    <div style="flex:1;background:#F2F2F7;border-radius:24px 24px 0 0;margin-top:-8px;padding:20px 0 0;overflow:hidden;display:flex;flex-direction:column">
      ${nxt?`<div style="margin:0 16px 14px;background:#fff;border-radius:16px;padding:12px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 1px 4px rgba(0,0,0,0.08)">
        <div style="font-size:26px">🚗</div>
        <div><div style="font-size:12px;color:#8E8E93;font-weight:600">NEXT EVENT</div><div style="font-size:16px;font-weight:700;color:#1C1C1E">${nxt.time||''} · ${nxt.title}</div></div>
      </div>`:''}
      <div style="display:flex;align-items:center;justify-content:space-between;padding:0 16px 8px">
        <div style="font-size:13px;font-weight:600;color:#8E8E93;text-transform:uppercase;letter-spacing:0.5px">Packing · ${packed}/${pk.length}</div>
        ${pct===1&&pk.length>0?`<span style="font-size:13px;font-weight:700;color:#34C759">All packed! ✅</span>`:`<div style="height:4px;background:#E5E5EA;border-radius:2px;width:80px;overflow:hidden"><div style="height:100%;width:${pct*100}%;background:${color};border-radius:2px;transition:width 0.3s"></div></div>`}
      </div>
      <div class="scroll" style="flex:1;overflow-y:auto">
        <div class="card">
          ${pk.length===0?`<div style="padding:24px;text-align:center;color:#8E8E93;font-size:15px">No packing items<br><button class="btn" onclick="nav('addPackItem',{childId:'${child.id}'})" style="color:#007AFF;margin-top:8px;font-size:15px;font-weight:600">+ Add items</button></div>`:''}
          ${pk.map((item,i)=>`<div style="display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:${i<pk.length-1?'1px solid #F2F2F7':'none'}">
            <div class="cb ${item.checked?'on':''}" style="${item.checked?'background:'+color+';':''}border-color:${item.checked?color:'#C7C7CC'}" onclick="togglePackItem('${child.id}','${item.id}',${!item.checked})">
              ${item.checked?checkSvg():''}
            </div>
            <span style="flex:1;font-size:16px;color:${item.checked?'#8E8E93':'#1C1C1E'};text-decoration:${item.checked?'line-through':'none'}">${item.label}</span>

    </div>`;
}

// Calendar
function renderCalendar(){
  const wStart=new Date(today);
  wStart.setDate(today.getDate()-today.getDay()+1+S.calWeekOffset*7);
  const weekDates=Array.from({length:7},(_,i)=>{const d=new Date(wStart);d.setDate(wStart.getDate()+i);return d;});
  const selDate=S.selectedDate||todayStr;
  const dayEvs=S.events.filter(e=>e.date===selDate).sort((a,b)=>(a.time||'').localeCompare(b.time||''));

  return`
    <div style="background:#fff;padding:12px 16px 0;border-bottom:1px solid #F2F2F7;flex-shrink:0">
      <div style="font-size:28px;font-weight:700;letter-spacing:-0.5px;color:#1C1C1E;margin-bottom:12px">Calendar</div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
        <button class="btn" onclick="S.calWeekOffset--;render()" style="color:#007AFF;font-size:22px;font-weight:300;padding:0 8px">‹</button>
        <div style="font-size:14px;font-weight:600;color:#1C1C1E">${MONTH_SHORT[wStart.getMonth()]} ${wStart.getFullYear()}</div>
        <button class="btn" onclick="S.calWeekOffset++;render()" style="color:#007AFF;font-size:22px;font-weight:300;padding:0 8px">›</button>
      </div>
      <div style="display:flex;margin:0 -16px">
        ${weekDates.map(d=>{
          const ds=fmtDate(d);
          const isSel=ds===selDate;
          const isTod=ds===todayStr;
          const hasEvs=S.events.filter(e=>e.date===ds).length>0;
          return`<button class="btn" onclick="S.selectedDate='${ds}';render()" style="flex:1;display:flex;flex-direction:column;align-items:center;padding:6px 2px 12px;border-bottom:${isSel?'3px solid #007AFF':'3px solid transparent'}">
            <div style="font-size:11px;color:${isSel?'#007AFF':isTod?'#FF3B30':'#8E8E93'};font-weight:500;margin-bottom:4px">${DAY_SHORT[d.getDay()]}</div>
            <div style="width:32px;height:32px;border-radius:16px;background:${isSel?'#007AFF':'transparent'};display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;color:${isSel?'#fff':isTod?'#FF3B30':'#1C1C1E'}">${d.getDate()}</div>
            <div style="width:6px;height:6px;border-radius:3px;margin-top:4px;background:${hasEvs?(isSel?'#fff':'#007AFF'):'transparent'}"></div>
          </button>`;
        }).join('')}
      </div>
    </div>
    <div class="scroll" style="flex:1;overflow-y:auto;padding:12px 0 80px">
      ${dayEvs.length===0?`<div style="text-align:center;padding:60px 20px">
        <div style="font-size:48px;margin-bottom:12px">🎉</div>
        <div style="font-size:18px;font-weight:700;color:#1C1C1E;margin-bottom:6px">Nothing on!</div>
        <div style="font-size:15px;color:#8E8E93">Tap + to add an event</div>
      </div>`:
      `<div class="sh">${fmtDisplay(new Date(selDate+'T12:00'))}</div>
      ${dayEvs.map(ev=>{
        const ec=S.children.find(c=>c.id===ev.childId);
        const col=ec?.color||'#007AFF';
        return`<div style="width:calc(100% - 32px);margin:0 16px 10px;background:#fff;border-radius:16px;padding:14px 16px;box-shadow:0 1px 4px rgba(0,0,0,0.08)">
          <div style="display:flex;align-items:flex-start;gap:12px">
            <div style="width:4px;min-height:48px;border-radius:2px;background:${col};flex-shrink:0;margin-top:2px"></div>
            ${ec?av(ec.name,col,36):''}
            <div style="flex:1">
              <div style="font-size:16px;font-weight:600;color:#1C1C1E">${ev.title}</div>
              ${ev.time?`<div style="font-size:13px;color:#8E8E93;margin-top:2px">⏰ ${ev.time}</div>`:''}
              ${ev.location?`<div style="font-size:13px;color:#8E8E93">📍 ${ev.location}</div>`:''}
              ${ev.dropoff?`<div style="font-size:13px;color:#8E8E93">Drop-off: ${ev.dropoff}</div>`:''}
              ${ev.pickup?`<div style="font-size:13px;color:#007AFF;font-weight:500">🚗 Pickup: ${ev.pickup}</div>`:''}
              ${ev.notes?`<div style="font-size:13px;color:#8E8E93;font-style:italic;margin-top:4px">${ev.notes}</div>`:''}
            </div>
            <button onclick="delEvent('${ev.id}')" style="background:none;border:none;cursor:pointer;color:#FF3B30;font-size:20px;padding:0;opacity:0.7">×</button>
          </div>
        </div>`;
      }).join('')}`}
    </div>
    <div class="fab"><button class="fab-btn" style="background:#007AFF" onclick="nav('addEvent')">+</button></div>`;
}

      <div style="padding:16px;flex-shrink:0">
        <button class="primary-btn" onclick="nav('addAssessment')">+ Add Assessment</button>

        <button class="back-btn" onclick="S.listSection=null;render()">${back()}</button>
        <div style="flex:1;text-align:center;font-size:17px;font-weight:600">Notes</div>

// ── MAIN RENDER ─────────────────────────────────────────────
function render(){
  const screen=$('screen');
  const tabbar=$('tabbar');
  const hb=$('hb');
  if(!screen)return;

  const cur=S.stack[S.stack.length-1];
  let html='';
  let showTabs=false;

  if(!S.user){
    // Auth screens
    tabbar.style.display='none';hb.style.display='none';
    if(cur?.screen==='signup')html=renderSignup();
    else html=renderLogin();
  } else if(!S.familyId){
    tabbar.style.display='none';hb.style.display='none';
    html=renderFamilySetup();
  } else if(S.morningMode){
    tabbar.style.display='none';hb.style.display='flex';
    html=renderMorning();
  } else if(cur){
    tabbar.style.display='none';hb.style.display='flex';
    if(cur.screen==='addPackItem')html=renderAddPackItem(cur.params);
    else if(cur.screen==='addEvent')html=renderAddEvent();
    else if(cur.screen==='addNote')html=renderAddNote();
    else if(cur.screen==='addAssessment')html=renderAddAssessment();
    else if(cur.screen==='addChild')html=renderAddChild();
    else if(cur.screen==='signup')html=renderSignup();
    else if(cur.screen==='childProfile')html=renderFamily();
  } else {
    showTabs=true;
    tabbar.style.display='flex';hb.style.display='flex';
    if(S.tab==='today')html=renderToday();
    else if(S.tab==='calendar')html=renderCalendar();
    else if(S.tab==='lists')html=renderLists();
    else if(S.tab==='family')html=renderFamily();
    else if(S.tab==='settings')html=renderSettings();
  }

  screen.innerHTML=html;
  _notif();

  if(showTabs){
    const tabs=[
      {id:'today',icon:'🏠',label:'Today'},
      {id:'calendar',icon:'📅',label:'Calendar'},
      {id:'lists',icon:'📋',label:'Lists'},
      {id:'family',icon:'👨‍👩‍👧',label:'Family'},
      {id:'settings',icon:'⚙️',label:'Settings'},
    ];
    tabbar.innerHTML=tabs.map(t=>`<button class="tab ${S.tab===t.id?'active':''}" onclick="setTab('${t.id}')">
      <span style="font-size:22px">${t.icon}</span>${t.label}
    </button>`).join('');
  }
}

// ── HANDLERS ────────────────────────────────────────────────
window.hLogin=async()=>{
  const e=$('le')?.value?.trim(),p=$('lp')?.value;
  const err=$('lerr');
  if(!e||!p){if(err)err.textContent='Please fill in all fields';return;}
  try{await signInWithEmailAndPassword(auth,e,p);}
  catch(ex){if(err)err.textContent=ex.code==='auth/invalid-credential'?'Incorrect email or password':ex.message.replace('Firebase:','').replace(/\(.*\)/,'').trim();}
};
window.hSignup=async()=>{
  const n=$('sn')?.value?.trim(),e=$('se')?.value?.trim(),p=$('sp')?.value;
  const err=$('serr');
  if(!n||!e||!p){if(err)err.textContent='Please fill in all fields';return;}
  try{
    const c=await createUserWithEmailAndPassword(auth,e,p);
    await updateProfile(c.user,{displayName:n});
    S.user={...c.user,displayName:n};
    goBack();
  }catch(ex){if(err)err.textContent=ex.message.replace('Firebase:','').replace(/\(.*\)/,'').trim();}
};
window.hCreateFamily=async()=>{
  const n=$('fn')?.value?.trim(),err=$('ferr');
  if(!n){if(err)err.textContent='Please enter a family name';return;}
  try{const fid=await createFamily(n);S.familyId=fid;subscribe();render();}
  catch(ex){if(err)err.textContent=ex.message;}
};
window.hJoinFamily=async()=>{
  const c=$('fc')?.value?.trim(),err=$('jerr');
  if(!c){if(err)err.textContent='Please enter the family code';return;}
  try{const fid=await joinFamily(c);S.familyId=fid;subscribe();render();}
  catch(ex){if(err)err.textContent='Family not found. Check the code and try again.';}
};
window.hAddChild=async()=>{
  const name=$('cname')?.value?.trim(),year=$('cyear')?.value?.trim(),school=$('cschool')?.value?.trim(),color=$('ccolor')?.value||'#007AFF';
  const err=$('cerr');
  if(!name){if(err)err.textContent='Please enter a name';return;}
  try{await addChild({name,year,school,color,initials:name[0].toUpperCase()});S.activeChild=null;goBack();showNotif(`${name} added! 🎉`);}
  catch(ex){if(err)err.textContent=ex.message;}
};
window.selColor=c=>{
  $('ccolor').value=c;
  document.querySelectorAll('[id^="cp"]').forEach(el=>el.style.border='4px solid transparent');
  CHILD_COLORS.forEach((col,i)=>{if(col===c)document.getElementById('cp'+i).style.border='4px solid #1C1C1E';});

window.state_morningMode=()=>{S.morningMode=true;render();};
window.hAddPackItem=async childId=>{

window.hAddEvent=async()=>{
  const t=$('et')?.value?.trim(),d=$('ed')?.value,err=$('everr');
  if(!t||!d){if(err)err.textContent='Please enter a title and date';return;}
  const icon=$('et')?.value?.toLowerCase().includes('soccer')||$('et')?.value?.toLowerCase().includes('sport')?'⚽':$('et')?.value?.toLowerCase().includes('swim')?'🏊':$('et')?.value?.toLowerCase().includes('piano')||$('et')?.value?.toLowerCase().includes('music')?'🎹':'📅';
  try{
    await addEvent({title:t,date:d,time:$('etime')?.value?.trim()||'',location:$('eloc')?.value?.trim()||'',dropoff:$('edrop')?.value?.trim()||'',pickup:$('epick')?.value?.trim()||'',childId:$('echild')?.value||'',notes:$('enotes')?.value?.trim()||'',icon});
    goBack();showNotif('Event added 📅');
  }catch(ex){if(err)err.textContent=ex.message;}
};

  const text=$('ntext')?.value?.trim(),childId=$('nchild')?.value,err=$('nerr');
  if(!text){if(err)err.textContent='Please write a note';return;}
  try{await addNote({text,childId});goBack();showNotif('Note saved 📝');}
  catch(ex){if(err)err.textContent=ex.message;}
};
window.delNote=async id=>{try{await deleteNote(id);showNotif('Note deleted');}catch(ex){}};
window.hAddAssessment=async()=>{
  const childId=$('achild')?.value,subj=$('asubj')?.value?.trim(),title=$('atitle')?.value?.trim(),due=$('adue')?.value,err=$('aerr');
  if(!title||!due){if(err)err.textContent='Please fill in title and due date';return;}
  const daysLeft=Math.ceil((new Date(due+' 12:00')-today)/(86400000));
  const dueDisplay=new Date(due+' 12:00').toLocaleDateString('en-AU',{day:'numeric',month:'short'});
  try{await addAssessment({childId,subject:subj,title,due:dueDisplay,daysLeft});goBack();showNotif('Assessment added 📚');}
  catch(ex){if(err)err.textContent=ex.message;}
};
window.delAssessment=async id=>{try{await deleteAssessment(id);showNotif('Assessment deleted');}catch(ex){}};
window.hSignOut=async()=>{
  S.unsubs.forEach(u=>u());S.unsubs=[];
  Object.assign(S,{family:null,familyId:null,children:[],packing:{},events:[],notes:[],assessments:[],stack:[],tab:'today',morningMode:false,activeChild:null,fabOpen:false,notif:null});
  await signOut(auth);
};
window.showFamilyCode=()=>{
  if(navigator.clipboard)navigator.clipboard.writeText(S.familyId).then(()=>showNotif('Family code copied! Share it with family members 🔗'));
  else alert('Your family code:\n\n'+S.familyId);
};
window.nav=nav;window.goBack=goBack;window.setTab=setTab;

// ── Auth listener ────────────────────────────────────────────
onAuthStateChanged(auth,async user=>{
  S.user=user;
  if(user){
    try{
      const ud=await getDoc(doc(db,'users',user.uid));
      if(ud.exists()&&ud.data().familyId){S.familyId=ud.data().familyId;subscribe();}
    }catch(ex){}
  }
  render();
});
</script>
