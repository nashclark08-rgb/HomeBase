<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>HomeBase</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;background:#1a1a1a;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
#phone{width:390px;min-height:844px;border-radius:48px;overflow:hidden;position:relative;background:#F2F2F7;box-shadow:0 40px 80px rgba(0,0,0,0.5);display:flex;flex-direction:column}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:126px;height:37px;border-radius:24px;background:#000;z-index:50;pointer-events:none}
.statusbar{position:absolute;top:0;left:0;right:0;height:59px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 8px;z-index:10;pointer-events:none}
.statusbar span{font-size:17px;font-weight:600;color:#1C1C1E}
.main{display:flex;flex-direction:column;flex:1;padding-top:59px;overflow:hidden;position:relative}
.screen{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}
.scroll{overflow-y:auto;-ms-overflow-style:none;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.tabbar{background:rgba(249,249,249,0.95);backdrop-filter:blur(20px);border-top:0.5px solid rgba(0,0,0,0.12);display:flex;flex-shrink:0}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 0 4px;border:none;background:transparent;cursor:pointer;gap:2px;font-family:inherit;font-size:10px;font-weight:500;color:#8E8E93}
.tab.active{color:#007AFF}
.homebar{height:8px;display:flex;justify-content:center;align-items:center;background:rgba(249,249,249,0.95);flex-shrink:0}
.homebar-pill{width:139px;height:5px;border-radius:100px;background:rgba(0,0,0,0.2)}
.card{background:#fff;border-radius:16px;margin:0 16px;box-shadow:0 1px 4px rgba(0,0,0,0.08);overflow:hidden}
.sh{padding:6px 16px 4px;font-size:13px;font-weight:600;color:#8E8E93;text-transform:uppercase;letter-spacing:0.4px}
.btn{border:none;cursor:pointer;font-family:inherit;background:none}
.back-btn{border:none;cursor:pointer;color:#007AFF;font-size:17px;font-family:inherit;display:flex;align-items:center;gap:4px;padding:0;background:none}
.toggle{width:51px;height:31px;border-radius:16px;position:relative;cursor:pointer;transition:background 0.2s;flex-shrink:0;border:none}
.toggle-thumb{position:absolute;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,0.2);transition:left 0.2s}
.fab{position:absolute;bottom:16px;right:20px;z-index:10}
.fab-btn{width:56px;height:56px;border-radius:28px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,122,255,0.4);font-size:28px;color:#fff;transition:all 0.2s;font-family:inherit}
.fab-menu{position:absolute;bottom:64px;right:0;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.fab-item{display:flex;align-items:center;gap:10px;padding:10px 16px;background:#1C1C1E;border-radius:24px;border:none;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,0.3);font-family:inherit;white-space:nowrap;color:#fff;font-size:15px;font-weight:600}
.notif{position:absolute;top:12px;left:12px;right:12px;z-index:999;background:rgba(30,30,32,0.92);border-radius:16px;padding:12px 14px;box-shadow:0 8px 32px rgba(0,0,0,0.35);cursor:pointer;animation:slideDown 0.35s ease}
.input-field{width:100%;padding:14px 16px;border:1.5px solid #E5E5EA;border-radius:12px;font-size:16px;font-family:inherit;outline:none;transition:border 0.2s;background:#fff}
.input-field:focus{border-color:#007AFF}
.primary-btn{width:100%;padding:15px;border:none;border-radius:14px;background:#007AFF;color:#fff;font-size:17px;font-weight:600;cursor:pointer;font-family:inherit;transition:opacity 0.2s}
.primary-btn:disabled{opacity:0.5;cursor:not-allowed}
.secondary-btn{width:100%;padding:15px;border:none;border-radius:14px;background:#F2F2F7;color:#1C1C1E;font-size:17px;font-weight:600;cursor:pointer;font-family:inherit}
.error-msg{color:#FF3B30;font-size:13px;text-align:center;margin-top:8px}
.loading{display:flex;align-items:center;justify-content:center;flex:1;font-size:17px;color:#8E8E93}
@keyframes slideDown{from{transform:translateY(-120%);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes allPacked{0%{transform:scale(0.95);opacity:0}60%{transform:scale(1.02)}100%{transform:scale(1);opacity:1}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.spinner{width:32px;height:32px;border:3px solid #F2F2F7;border-top-color:#007AFF;border-radius:50%;animation:spin 0.8s linear infinite;margin:auto}
</style>
</head>
<body>
<div id="phone">
  <div class="island"></div>
  <div class="statusbar">
    <span>9:41</span>
    <svg width="17" height="12" viewBox="0 0 17 12"><rect x="0" y="7" width="3" height="5" rx="1" fill="#1C1C1E"/><rect x="4.5" y="5" width="3" height="7" rx="1" fill="#1C1C1E"/><rect x="9" y="2.5" width="3" height="9.5" rx="1" fill="#1C1C1E"/><rect x="13.5" y="0" width="3" height="12" rx="1" fill="#1C1C1E"/></svg>
  </div>
  <div class="main">
    <div class="screen" id="screen"><div class="loading"><div class="spinner"></div></div></div>
    <div class="tabbar" id="tabbar" style="display:none"></div>
    <div class="homebar" id="homebar" style="display:none"><div class="homebar-pill"></div></div>
  </div>
</div>

<!-- Firebase SDKs -->
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, updateProfile } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
import { getFirestore, doc, setDoc, getDoc, collection, addDoc, onSnapshot, updateDoc, deleteDoc, query, where, orderBy } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyA2lrJJ0T_y_CBk8kOqRmwejCqHx6RVPXA",
  authDomain: "homebase-56151.firebaseapp.com",
  projectId: "homebase-56151",
  storageBucket: "homebase-56151.firebasestorage.app",
  messagingSenderId: "647157335008",
  appId: "1:647157335008:web:a15452fabd943bf5a8a185",
  measurementId: "G-2HN2XRMP54"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// ── STATE ──────────────────────────────────────────────────────
let state = {
  user: null,
  family: null,
  familyId: null,
  children: [],
  packing: {},
  events: [],
  notes: [],
  assessments: [],
  tab: 'today',
  stack: [],
  morningMode: false,
  morningChild: null,
  calDay: new Date().getDay() || 1,
  listSection: null,
  listFilter: 'all',
  notif: null,
  notifTimer: null,
  fabOpen: false,
  unsubscribers: [],
  loading: false,
};

// ── HELPERS ───────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const COLORS = ['#007AFF','#34C759','#FF9500','#FF3B30','#AF52DE','#FF6B9D','#5856D6'];
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const today = new Date();
const todayDay = today.getDay();

function chev(){return `<svg width="8" height="13" viewBox="0 0 8 13"><polyline points="1,1 7,6.5 1,12" stroke="#C7C7CC" stroke-width="2" fill="none" stroke-linecap="round"/></svg>`;}
function backSVG(){return `<svg width="10" height="17" viewBox="0 0 10 17"><polyline points="9,1 1,8.5 9,16" stroke="#007AFF" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;}
function avatar(name, color, size=36){
  const initials = name ? name.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2) : '?';
  const bg = color+'20';
  return `<div style="width:${size}px;height:${size}px;border-radius:50%;background:${bg};border:2px solid ${color};display:flex;align-items:center;justify-content:center;font-size:${size*0.35}px;font-weight:700;color:${color};flex-shrink:0">${initials}</div>`;
}
function toggle(val, onclick){
  return `<button class="toggle" style="background:${val?'#34C759':'#E5E5EA'}" onclick="${onclick}"><div class="toggle-thumb" style="left:${val?22:2}px"></div></button>`;
}
function showNotif(msg){
  if(state.notifTimer) clearTimeout(state.notifTimer);
  state.notif = msg;
  renderNotif();
  state.notifTimer = setTimeout(()=>{state.notif=null;renderNotif();}, 4000);
}
function renderNotif(){
  const existing = document.querySelector('.notif');
  if(existing) existing.remove();
  if(state.notif){
    const el = document.createElement('div');
    el.className = 'notif';
    el.onclick = ()=>{state.notif=null;el.remove();};
    el.innerHTML = `<div style="display:flex;gap:10px;align-items:flex-start">
      <div style="width:36px;height:36px;border-radius:10px;background:#007AFF;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0">🏠</div>
      <div style="flex:1">
        <div style="display:flex;justify-content:space-between"><span style="font-size:13px;font-weight:700;color:#fff">HomeBase</span><span style="font-size:12px;color:rgba(255,255,255,0.5)">now</span></div>
        <div style="font-size:13px;color:rgba(255,255,255,0.85);margin-top:2px;line-height:1.4">${state.notif}</div>
      </div>
    </div>`;
    $('screen').appendChild(el);
  }
}

function nav(screen, params={}){state.stack.push({screen,params});state.fabOpen=false;render();}
function goBack(){state.stack.pop();render();}
function setTab(t){state.tab=t;state.stack=[];state.morningMode=false;state.fabOpen=false;render();}

// ── FIREBASE OPERATIONS ────────────────────────────────────────
async function createFamily(familyName){
  const ref = await addDoc(collection(db,'families'),{
    name: familyName, createdBy: state.user.uid, createdAt: new Date(),
    members: {[state.user.uid]: {name: state.user.displayName, role:'admin', color:'#007AFF'}}
  });
  await setDoc(doc(db,'users',state.user.uid),{familyId: ref.id, name: state.user.displayName, role:'admin'});
  return ref.id;
}

async function joinFamily(familyId){
  const ref = doc(db,'families',familyId);
  const snap = await getDoc(ref);
  if(!snap.exists()) throw new Error('Family not found');
  await updateDoc(ref,{[`members.${state.user.uid}`]:{name:state.user.displayName,role:'member',color:COLORS[Math.floor(Math.random()*COLORS.length)]}});
  await setDoc(doc(db,'users',state.user.uid),{familyId,name:state.user.displayName,role:'member'});
  return familyId;
}

async function addChild(name, year, school, color){
  await addDoc(collection(db,'families',state.familyId,'children'),{
    name, year, school, color, initials: name.slice(0,1).toUpperCase(), createdAt: new Date()
  });
}

async function addPackingItem(childId, label){
  await addDoc(collection(db,'families',state.familyId,'children',childId,'packing'),{
    label, checked: false, pinned: false, createdAt: new Date()
  });
}

async function togglePackingItem(childId, itemId, checked){
  await updateDoc(doc(db,'families',state.familyId,'children',childId,'packing',itemId),{checked});
}

async function addEvent(eventData){
  await addDoc(collection(db,'families',state.familyId,'events'),{...eventData, createdAt: new Date()});
}

async function addNote(childId, text){
  await addDoc(collection(db,'families',state.familyId,'notes'),{
    childId, text, date: today.toDateString(), createdAt: new Date(), createdBy: state.user.uid
  });
}

async function addAssessment(childId, subject, title, due, daysLeft){
  await addDoc(collection(db,'families',state.familyId,'assessments'),{
    childId, subject, title, due, daysLeft, reminder: true, calendar: true, createdAt: new Date()
  });
}

function subscribeToFamily(){
  // Unsubscribe previous
  state.unsubscribers.forEach(u=>u());
  state.unsubscribers = [];

  // Children
  const childUnsub = onSnapshot(collection(db,'families',state.familyId,'children'), snap=>{
    state.children = snap.docs.map(d=>({id:d.id,...d.data()}));
    if(!state.morningChild && state.children.length > 0) state.morningChild = state.children[0].id;
    // Subscribe to packing for each child
    state.children.forEach(child=>{
      const packUnsub = onSnapshot(collection(db,'families',state.familyId,'children',child.id,'packing'), psnap=>{
        state.packing[child.id] = psnap.docs.map(d=>({id:d.id,...d.data()}));
        render();
      });
      state.unsubscribers.push(packUnsub);
    });
    render();
  });
  state.unsubscribers.push(childUnsub);

  // Events
  const evUnsub = onSnapshot(collection(db,'families',state.familyId,'events'), snap=>{
    state.events = snap.docs.map(d=>({id:d.id,...d.data()}));
    render();
  });
  state.unsubscribers.push(evUnsub);

  // Notes
  const noteUnsub = onSnapshot(collection(db,'families',state.familyId,'notes'), snap=>{
    state.notes = snap.docs.map(d=>({id:d.id,...d.data()}));
    render();
  });
  state.unsubscribers.push(noteUnsub);

  // Assessments
  const assUnsub = onSnapshot(collection(db,'families',state.familyId,'assessments'), snap=>{
    state.assessments = snap.docs.map(d=>({id:d.id,...d.data()}));
    render();
  });
  state.unsubscribers.push(assUnsub);

  // Family doc
  const famUnsub = onSnapshot(doc(db,'families',state.familyId), snap=>{
    state.family = snap.data();
    render();
  });
  state.unsubscribers.push(famUnsub);
}

// ── AUTH SCREENS ───────────────────────────────────────────────
function renderLogin(){
  return `
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;padding:40px 32px">
      <div style="width:80px;height:80px;border-radius:22px;background:linear-gradient(135deg,#007AFF,#5856D6);display:flex;align-items:center;justify-content:center;font-size:38px;box-shadow:0 8px 32px rgba(0,122,255,0.3);margin-bottom:28px">🏠</div>
      <div style="font-size:26px;font-weight:800;color:#1C1C1E;letter-spacing:-0.5px;text-align:center;margin-bottom:8px">Welcome to HomeBase</div>
      <div style="font-size:14px;color:#8E8E93;line-height:1.5;text-align:center;margin-bottom:32px">Family logistics, made simple.</div>
      <div style="width:100%;display:flex;flex-direction:column;gap:12px">
        <input class="input-field" id="login-email" type="email" placeholder="Email address"/>
        <input class="input-field" id="login-password" type="password" placeholder="Password"/>
        <div id="login-error" class="error-msg"></div>
        <button class="primary-btn" id="login-btn" onclick="handleLogin()">Sign In</button>
        <button class="secondary-btn" onclick="nav('signup')">Create Account</button>
      </div>
    </div>`;
}

function renderSignup(){
  return `
    <div style="flex:1;display:flex;flex-direction:column;background:#F2F2F7;overflow:hidden">
      <div style="background:#fff;padding:12px 16px 14px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #F2F2F7">
        <button class="back-btn" onclick="goBack()">${backSVG()} Back</button>
        <div style="flex:1;text-align:center;font-size:17px;font-weight:600">Create Account</div>
        <div style="width:60px"></div>
      </div>
      <div class="scroll" style="flex:1;overflow-y:auto;padding:24px 16px">
        <div style="display:flex;flex-direction:column;gap:12px">
          <input class="input-field" id="signup-name" type="text" placeholder="Your full name"/>
          <input class="input-field" id="signup-email" type="email" placeholder="Email address"/>
          <input class="input-field" id="signup-password" type="password" placeholder="Password (min 6 characters)"/>
          <div id="signup-error" class="error-msg"></div>
          <button class="primary-btn" onclick="handleSignup()">Create Account</button>
        </div>
      </div>
    </div>`;
}

function renderFamilySetup(){
  return `
    <div style="flex:1;display:flex;flex-direction:column;background:#F2F2F7;overflow:hidden">
      <div style="background:#fff;padding:12px 16px 14px;border-bottom:1px solid #F2F2F7;text-align:center">
        <div style="font-size:22px;font-weight:800;color:#1C1C1E">Set up your family</div>
        <div style="font-size:14px;color:#8E8E93;margin-top:4px">Hi ${state.user?.displayName}! 👋</div>
      </div>
      <div class="scroll" style="flex:1;overflow-y:auto;padding:24px 16px">
        <div style="background:#fff;border-radius:16px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,0.08);margin-bottom:16px">
          <div style="font-size:17px;font-weight:700;color:#1C1C1E;margin-bottom:8px">Create a new family</div>
          <div style="font-size:14px;color:#8E8E93;margin-bottom:16px">Start fresh and invite others to join</div>
          <input class="input-field" id="family-name" type="text" placeholder="Family name (e.g. The Clarks)" style="margin-bottom:12px"/>
          <div id="create-error" class="error-msg" style="margin-bottom:8px"></div>
          <button class="primary-btn" onclick="handleCreateFamily()">Create Family</button>
        </div>
        <div style="text-align:center;color:#8E8E93;font-size:15px;margin:16px 0">or</div>
        <div style="background:#fff;border-radius:16px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,0.08)">
          <div style="font-size:17px;font-weight:700;color:#1C1C1E;margin-bottom:8px">Join existing family</div>
          <div style="font-size:14px;color:#8E8E93;margin-bottom:16px">Enter the family code shared by your partner</div>
          <input class="input-field" id="family-code" type="text" placeholder="Family code" style="margin-bottom:12px"/>
          <div id="join-error" class="error-msg" style="margin-bottom:8px"></div>
          <button class="primary-btn" style="background:#34C759" onclick="handleJoinFamily()">Join Family</button>
        </div>
      </div>
    </div>`;
}

function renderAddChild(){
  const childColors = ['#007AFF','#34C759','#FF9500','#FF3B30','#AF52DE','#FF6B9D'];
  return `
    <div style="flex:1;display:flex;flex-direction:column;background:#F2F2F7;overflow:hidden">
      <div style="background:#fff;padding:12px 16px 14px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #F2F2F7">
        <button class="back-btn" onclick="goBack()">${backSVG()} Back</button>
        <div style="flex:1;text-align:center;font-size:17px;font-weight:600">Add Child</div>
        <div style="width:60px"></div>
      </div>
      <div class="scroll" style="flex:1;overflow-y:auto;padding:24px 16px">
        <div style="display:flex;flex-direction:column;gap:12px">
          <input class="input-field" id="child-name" type="text" placeholder="Child's name"/>
          <input class="input-field" id="child-year" type="text" placeholder="Year / Grade (e.g. Year 4)"/>
          <input class="input-field" id="child-school" type="text" placeholder="School name"/>
          <div style="font-size:15px;font-weight:600;color:#1C1C1E;margin-top:4px">Choose colour</div>
          <div style="display:flex;gap:10px;flex-wrap:wrap" id="color-picker">
            ${childColors.map((c,i)=>`<button onclick="selectColor('${c}')" id="color-${c.replace('#','')}" style="width:44px;height:44px;border-radius:22px;background:${c};border:3px solid ${i===0?'#000':'transparent'};cursor:pointer"></button>`).join('')}
          </div>
          <input type="hidden" id="child-color" value="${childColors[0]}"/>
          <div id="child-error" class="error-msg"></div>
          <button class="primary-btn" onclick="handleAddChild()">Add Child</button>
          <button class="secondary-btn" onclick="setTab('today')">Skip for now</button>
        </div>
      </div>
    </div>`;
}

// ── TODAY SCREEN ───────────────────────────────────────────────
function renderToday(){
  const members = state.family?.members || {};
  const todayEvents = state.events.filter(e => {
    if(!e.date) return false;
    const d = new Date(e.date);
    return d.toDateString() === today.toDateString();
  });

  return `
    <div style="background:#fff;padding:12px 16px 0;border-bottom:1px solid #F0F0F0;flex-shrink:0">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div>
          <div style="font-size:26px;font-weight:800;letter-spacing:-0.5px;color:#1C1C1E">${DAYS[todayDay]}</div>
          <div style="font-size:14px;color:#8E8E93;margin-top:1px">${today.toLocaleDateString('en-AU',{day:'numeric',month:'long'})}</div>
        </div>
        <div style="display:flex;gap:6px;margin-top:4px">
          <button class="btn" onclick="handleSignOut()" style="background:#F2F2F7;border-radius:10px;padding:5px 10px;font-size:11px;font-weight:600;color:#8E8E93">Sign Out</button>
          ${state.children.length>0?`<button class="btn" onclick="state.morningMode=true;render()" style="background:#007AFF;border-radius:10px;padding:5px 10px;font-size:10px;font-weight:700;color:#fff">☀️ Morning</button>`:''}
        </div>
      </div>
    </div>
    <div class="scroll" style="flex:1;overflow-y:auto;padding-top:14px;padding-bottom:90px">
      ${state.children.length === 0 ? `
        <div style="text-align:center;padding:40px 20px">
          <div style="font-size:48px;margin-bottom:16px">👧</div>
          <div style="font-size:18px;font-weight:700;color:#1C1C1E;margin-bottom:8px">Add your first child</div>
          <div style="font-size:15px;color:#8E8E93;margin-bottom:24px">Start tracking school days, packing lists and pickups</div>
          <button class="primary-btn" style="max-width:280px;margin:auto" onclick="nav('addChild')">Add Child</button>
        </div>` : `
        <div class="sh">Children</div>
        <div style="display:flex;gap:10px;padding:0 16px;margin-bottom:14px;flex-wrap:wrap">
          ${state.children.map(child=>{
            const pk = state.packing[child.id] || [];
            const packed = pk.filter(p=>p.checked).length;
            const pct = pk.length ? packed/pk.length : 0;
            const color = child.color || '#007AFF';

// ── CALENDAR SCREEN ────────────────────────────────────────────
function renderCalendar(){
  const selectedDate = state.selectedDate || today.toISOString().split('T')[0];
  const dayEvents = state.events.filter(e=>e.date===selectedDate);
  
  // Build week dates
  const weekDates = [];
  const startOfWeek = new Date(today);
  startOfWeek.setDate(today.getDate() - today.getDay() + 1);
  for(let i=0;i<7;i++){
    const d = new Date(startOfWeek);
    d.setDate(startOfWeek.getDate()+i);
    weekDates.push(d);
  }

  return `
    <div style="background:#fff;padding:12px 16px 0;border-bottom:1px solid #F2F2F7;flex-shrink:0">
      <div style="font-size:28px;font-weight:700;letter-spacing:-0.5px;color:#1C1C1E;margin-bottom:14px">Calendar</div>
      <div style="display:flex;margin:0 -16px;overflow-x:auto">
        ${weekDates.map(d=>{
          const ds = d.toISOString().split('T')[0];
          const isSelected = ds === selectedDate;
          const isToday = ds === today.toISOString().split('T')[0];
          const hasEvents = state.events.filter(e=>e.date===ds).length > 0;
          return `<button class="btn" onclick="state.selectedDate='${ds}';render()" style="flex:1;min-width:44px;display:flex;flex-direction:column;align-items:center;padding:8px 4px 12px;border-bottom:${isSelected?'3px solid #007AFF':'3px solid transparent'}">
            <div style="font-size:11px;color:${isSelected?'#007AFF':isToday?'#FF3B30':'#8E8E93'};font-weight:500">${['S','M','T','W','T','F','S'][d.getDay()]}</div>
            <div style="width:32px;height:32px;border-radius:16px;margin-top:4px;background:${isSelected?'#007AFF':'transparent'};display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;color:${isSelected?'#fff':isToday?'#FF3B30':'#1C1C1E'}">${d.getDate()}</div>
            ${hasEvents?`<div style="width:6px;height:6px;border-radius:3px;background:${isSelected?'#fff':'#007AFF'};margin-top:4px"></div>`:'<div style="height:10px"></div>'}
          </button>`;
        }).join('')}
      </div>
    </div>
    <div class="scroll" style="flex:1;overflow-y:auto;padding:12px 0 80px">
      ${dayEvents.length===0
        ?`<div style="text-align:center;padding:60px 20px">
            <div style="font-size:48px;margin-bottom:12px">🎉</div>
            <div style="font-size:18px;font-weight:700;color:#1C1C1E;margin-bottom:6px">Nothing on!</div>
            <div style="font-size:15px;color:#8E8E93">Tap + to add an event</div>
          </div>`
        :`<div class="sh">${new Date(selectedDate+'T12:00:00').toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'long'})}</div>
          ${dayEvents.map(ev=>{
            const child = state.children.find(c=>c.id===ev.childId);
            const color = child?.color || '#007AFF';
            return `<div style="width:calc(100% - 32px);margin:0 16px 10px;background:#fff;border-radius:16px;padding:14px 16px;box-shadow:0 1px 4px rgba(0,0,0,0.08);display:flex;align-items:center;gap:12px">
              <div style="width:4px;height:50px;border-radius:2px;background:${color};flex-shrink:0"></div>
              ${child?avatar(child.name,color,36):''}
              <div style="flex:1">
                <div style="font-size:16px;font-weight:600;color:#1C1C1E">${ev.title}</div>
                ${ev.time?`<div style="font-size:13px;color:#8E8E93">${ev.time}</div>`:''}
                ${ev.location?`<div style="font-size:13px;color:#8E8E93">📍 ${ev.location}</div>`:''}
                ${ev.notes?`<div style="font-size:13px;color:#8E8E93;font-style:italic">${ev.notes}</div>`:''}
              </div>
              <button onclick="deleteEvent('${ev.id}')" style="background:none;border:none;cursor:pointer;color:#FF3B30;font-size:20px;padding:0">×</button>
            </div>`;
          }).join('')}`
      }
    </div>
    <div class="fab">
      <button class="fab-btn" style="background:#007AFF" onclick="nav('addEvent')">+</button>
    </div>`;
}

              <div style="font-size:16px;font-weight:600;color:#1C1C1E">${a.title}</div>
              <div style="font-size:13px;color:#8E8E93">${a.subject||''} · Due ${a.due||''}</div>
            </div>
            ${a.daysLeft?`<div style="font-size:12px;font-weight:700;color:${urg?'#FF3B30':'#34C759'};background:${urg?'#FFF0EE':'#EAFAF0'};padding:3px 8px;border-radius:10px">${a.daysLeft}d</div>`:''}
            <button onclick="deleteAssessment('${a.id}')" style="background:none;border:none;cursor:pointer;color:#FF3B30;font-size:20px;padding:0">×</button>
          </div>`;
        }).join('')}
      </div>
      <div style="padding:16px">
        <button class="primary-btn" onclick="nav('addAssessment')">+ Add Assessment</button>
      </div>`;
  }

  if(state.listSection==='notes'){
    const filtered = state.listFilter==='all' ? state.notes : state.notes.filter(n=>n.childId===state.listFilter);
    return `
      <div style="background:#fff;padding:12px 16px 14px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #F2F2F7;flex-shrink:0">
        <button class="back-btn" onclick="state.listSection=null;render()">${backSVG()} Back</button>
        <div style="flex:1;text-align:center;font-size:17px;font-weight:600">Notes</div>
        <div style="width:60px"></div>
      </div>
      <div style="background:#fff;padding:8px 16px 12px;display:flex;gap:8px;flex-wrap:wrap;flex-shrink:0">
        ${[{id:'all',label:'All'},...state.children.map(c=>({id:c.id,label:c.name}))].map(f=>`<button class="btn" onclick="state.listFilter='${f.id}';render()" style="padding:6px 14px;border-radius:20px;border:2px solid ${state.listFilter===f.id?'#007AFF':'#E5E5EA'};background:${state.listFilter===f.id?'#EBF3FF':'#fff'};color:${state.listFilter===f.id?'#007AFF':'#8E8E93'};font-size:14px;font-weight:600">${f.label}</button>`).join('')}
      </div>
      <div class="scroll" style="flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px">
        ${filtered.length===0?`<div style="text-align:center;padding:40px 0;color:#8E8E93;font-size:15px">No notes yet</div>`:''}
        ${filtered.map(n=>{
          const child = state.children.find(c=>c.id===n.childId);
          return `<div style="background:#fff;border-radius:16px;padding:14px 16px;box-shadow:0 1px 4px rgba(0,0,0,0.08)">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
              ${child?avatar(child.name,child.color||'#007AFF',22):'<span style="font-size:18px">📝</span>'}
              <span style="font-size:13px;color:#8E8E93">${n.date||''}</span>
              <button onclick="deleteNote('${n.id}')" style="background:none;border:none;cursor:pointer;color:#FF3B30;font-size:18px;padding:0;margin-left:auto">×</button>
            </div>
            <div style="font-size:15px;color:#1C1C1E">${n.text}</div>
          </div>`;
        }).join('')}
      </div>
      <div style="padding:16px">
        <button class="primary-btn" onclick="nav('addNote')">+ Add Note</button>
      </div>`;
  }

  const urgentAssessments = state.assessments.filter(a=>a.daysLeft<=7).length;
  const cats = [
    {id:'assessments',icon:'📚',label:'Assessments',sub:`${state.assessments.length} tasks`,badge:urgentAssessments},
    {id:'notes',icon:'📝',label:'Notes',sub:`${state.notes.length} notes`},
  ];

  return `
    <div style="background:#fff;padding:12px 16px 14px;border-bottom:1px solid #F2F2F7;flex-shrink:0">
      <div style="font-size:28px;font-weight:700;letter-spacing:-0.5px;color:#1C1C1E">Lists</div>
    </div>
    <div class="scroll" style="flex:1;overflow-y:auto;padding:16px 0">
      <div class="card">
        ${cats.map((cat,i)=>`<button class="btn" onclick="state.listSection='${cat.id}';state.listFilter='all';render()" style="width:100%;padding:14px 16px;display:flex;align-items:center;gap:14px;border-bottom:${i<cats.length-1?'1px solid #F2F2F7':'none'};text-align:left">
          <div style="width:44px;height:44px;border-radius:12px;background:#F2F2F7;font-size:24px;display:flex;align-items:center;justify-content:center">${cat.icon}</div>
          <div style="flex:1"><div style="font-size:16px;font-weight:600;color:#1C1C1E">${cat.label}</div><div style="font-size:13px;color:#8E8E93">${cat.sub}</div></div>
          ${cat.badge>0?`<div style="background:#FF3B30;border-radius:12px;min-width:24px;height:24px;display:flex;align-items:center;justify-content:center;padding:0 6px"><span style="font-size:13px;font-weight:700;color:#fff">${cat.badge}</span></div>`:''}
          ${chev()}
        </button>`).join('')}
      </div>
    </div>`;
}

// ── FAMILY SCREEN ──────────────────────────────────────────────
function renderFamily(){
  const members = state.family?.members || {};
  return `
    <div style="background:#fff;padding:12px 16px 14px;border-bottom:1px solid #F2F2F7;flex-shrink:0">
      <div style="font-size:28px;font-weight:700;letter-spacing:-0.5px;color:#1C1C1E">Family</div>
    </div>
    <div class="scroll" style="flex:1;overflow-y:auto;padding:16px 0">
      <div class="sh">Children</div>
      <div class="card" style="margin-bottom:12px">
        ${state.children.map((child,i)=>`<button class="btn" onclick="nav('childDetail',{childId:'${child.id}'})" style="width:100%;padding:14px 16px;display:flex;align-items:center;gap:12px;border-bottom:${i<state.children.length-1?'1px solid #F2F2F7':'none'};text-align:left">
          ${avatar(child.name, child.color||'#007AFF', 46)}
          <div style="flex:1;text-align:left">
            <div style="font-size:17px;font-weight:600;color:#1C1C1E">${child.name}</div>
            <div style="font-size:14px;color:#8E8E93">${child.year||''} ${child.school?'· '+child.school:''}</div>
          </div>
          ${chev()}
        </button>`).join('')}
        <button class="btn" onclick="nav('addChild')" style="width:100%;padding:14px 16px;display:flex;align-items:center;justify-content:center;gap:8px;border-top:${state.children.length>0?'1px solid #F2F2F7':'none'};color:#007AFF;font-size:15px;font-weight:600">
          + Add Child
        </button>
      </div>
      <div class="sh">Members</div>
      <div class="card" style="margin-bottom:12px">
        ${Object.entries(members).map(([uid,member],i,arr)=>`
          <div style="display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:${i<arr.length-1?'1px solid #F2F2F7':'none'}">
            ${avatar(member.name, member.color||'#007AFF', 46)}
            <div style="flex:1">
              <div style="font-size:17px;font-weight:600;color:#1C1C1E">${member.name}${uid===state.user.uid?' (You)':''}</div>
              <div style="font-size:14px;color:#8E8E93;text-transform:capitalize">${member.role||'member'}</div>
            </div>
          </div>`).join('')}
      </div>
      <div style="padding:0 16px">
        <button class="btn" onclick="showFamilyCode()" style="width:100%;background:#fff;border-radius:16px;padding:14px;border:2px dashed #C7C7CC;color:#007AFF;font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px">
          <span>🔗</span> Share Family Code
        </button>
      </div>
    </div>`;
}

// ── SETTINGS SCREEN ────────────────────────────────────────────
function renderSettings(){
  const member = state.family?.members?.[state.user?.uid] || {};
  return `
    <div style="background:#fff;padding:12px 16px 14px;border-bottom:1px solid #F2F2F7;flex-shrink:0">
      <div style="font-size:28px;font-weight:700;letter-spacing:-0.5px;color:#1C1C1E">Settings</div>
    </div>
    <div class="scroll" style="flex:1;overflow-y:auto;padding:16px 0">
      <div style="margin:0 16px 16px">
        <div style="background:linear-gradient(135deg,#007AFF,#5856D6);border-radius:16px;padding:20px">
          <div style="font-size:14px;color:rgba(255,255,255,0.7);margin-bottom:4px">Signed in as</div>
          <div style="font-size:18px;font-weight:700;color:#fff">${state.user?.displayName||'User'}</div>
          <div style="font-size:13px;color:rgba(255,255,255,0.7);margin-top:4px">${state.user?.email||''}</div>
        </div>
      </div>
      <div class="sh">Family</div>
      <div class="card" style="margin-bottom:12px">
        <div style="padding:13px 16px;border-bottom:1px solid #F2F2F7">
          <div style="font-size:15px;color:#1C1C1E">Family name</div>
          <div style="font-size:13px;color:#8E8E93;margin-top:2px">${state.family?.name||'My Family'}</div>
        </div>
        <div style="padding:13px 16px;border-bottom:1px solid #F2F2F7">
          <div style="font-size:15px;color:#1C1C1E">Family code</div>
          <div style="font-size:13px;color:#007AFF;margin-top:2px;font-family:monospace">${state.familyId}</div>
        </div>
        <button class="btn" onclick="showFamilyCode()" style="width:100%;padding:13px 16px;color:#007AFF;font-size:15px;font-weight:600;text-align:left">Share Family Code</button>
      </div>
      <div class="sh">Account</div>
      <div class="card" style="margin-bottom:24px">
        <button class="btn" onclick="handleSignOut()" style="width:100%;padding:14px 16px;color:#FF3B30;font-size:15px;font-weight:600;text-align:left">Sign Out</button>
      </div>
      <div style="text-align:center;padding:0 0 20px;color:#C7C7CC;font-size:13px">HomeBase v2.0 · Powered by Firebase</div>
    </div>`;
}

// ── MAIN RENDER ────────────────────────────────────────────────
function render(){
  const screen = $('screen');
  const tabbar = $('tabbar');
  const homebar = $('homebar');

  if(!screen) return;

  let html = '';
  const cur = state.stack[state.stack.length-1];

  if(!state.user){
    // Not logged in
    tabbar.style.display = 'none';
    homebar.style.display = 'none';
    if(cur?.screen==='signup') html = renderSignup();
    else html = renderLogin();
  } else if(!state.familyId){
    // No family yet
    tabbar.style.display = 'none';
    homebar.style.display = 'none';
    html = renderFamilySetup();
  } else {
    // Main app
    if(state.morningMode){
      tabbar.style.display = 'none';
      homebar.style.display = 'flex';
      html = renderMorning();
    } else if(cur){
      tabbar.style.display = 'none';
      homebar.style.display = 'flex';
      if(cur.screen==='childDetail') html = renderChildDetail(cur.params);
      else if(cur.screen==='addPackingItem') html = renderAddPackingItem(cur.params);
      else if(cur.screen==='addEvent') html = renderAddEvent();
      else if(cur.screen==='addNote') html = renderAddNote();
      else if(cur.screen==='addAssessment') html = renderAddAssessment();
      else if(cur.screen==='addChild') html = renderAddChild();
      else if(cur.screen==='signup') html = renderSignup();
    } else {
      tabbar.style.display = 'flex';
      homebar.style.display = 'flex';
      if(state.tab==='today') html = renderToday();
      else if(state.tab==='calendar') html = renderCalendar();
      else if(state.tab==='lists') html = renderLists();
      else if(state.tab==='family') html = renderFamily();
      else if(state.tab==='settings') html = renderSettings();
    }

    // Tabbar
    const tabs = [
      {id:'today',label:'Today',icon:'🏠'},
      {id:'calendar',label:'Calendar',icon:'📅'},
      {id:'lists',label:'Lists',icon:'📋'},
      {id:'family',label:'Family',icon:'👨‍👩‍👧'},
      {id:'settings',label:'Settings',icon:'⚙️'},
    ];
    tabbar.innerHTML = tabs.map(t=>`<button class="tab ${state.tab===t.id&&!cur&&!state.morningMode?'active':''}" onclick="setTab('${t.id}')">
      <span style="font-size:22px">${t.icon}</span>${t.label}
    </button>`).join('');
  }

  screen.innerHTML = html;
  renderNotif();
}

// ── EVENT HANDLERS ─────────────────────────────────────────────
window.handleLogin = async()=>{
  const email = document.getElementById('login-email')?.value?.trim();
  const password = document.getElementById('login-password')?.value;
  const errEl = document.getElementById('login-error');
  if(!email||!password){if(errEl)errEl.textContent='Please fill in all fields';return;}
  const btn = document.getElementById('login-btn');
  if(btn){btn.disabled=true;btn.textContent='Signing in...';}
  try{
    await signInWithEmailAndPassword(auth,email,password);
  }catch(e){
    if(errEl)errEl.textContent=e.message.replace('Firebase:','').replace(/\(.*\)/,'').trim();
    if(btn){btn.disabled=false;btn.textContent='Sign In';}
  }
};

window.handleSignup = async()=>{
  const name = document.getElementById('signup-name')?.value?.trim();
  const email = document.getElementById('signup-email')?.value?.trim();
  const password = document.getElementById('signup-password')?.value;
  const errEl = document.getElementById('signup-error');
  if(!name||!email||!password){if(errEl)errEl.textContent='Please fill in all fields';return;}
  try{
    const cred = await createUserWithEmailAndPassword(auth,email,password);
    await updateProfile(cred.user,{displayName:name});
    state.user = {...cred.user, displayName:name};
  }catch(e){
    if(errEl)errEl.textContent=e.message.replace('Firebase:','').replace(/\(.*\)/,'').trim();
  }
};

window.handleCreateFamily = async()=>{
  const name = document.getElementById('family-name')?.value?.trim();
  const errEl = document.getElementById('create-error');
  if(!name){if(errEl)errEl.textContent='Please enter a family name';return;}
  try{
    const fid = await createFamily(name);
    state.familyId = fid;
    subscribeToFamily();
    render();
  }catch(e){
    if(errEl)errEl.textContent=e.message;
  }
};

window.handleJoinFamily = async()=>{
  const code = document.getElementById('family-code')?.value?.trim();
  const errEl = document.getElementById('join-error');
  if(!code){if(errEl)errEl.textContent='Please enter a family code';return;}
  try{
    const fid = await joinFamily(code);
    state.familyId = fid;
    subscribeToFamily();
    render();
  }catch(e){
    if(errEl)errEl.textContent='Family not found. Check the code and try again.';
  }
};

window.handleAddChild = async()=>{
  const name = document.getElementById('child-name')?.value?.trim();
  const year = document.getElementById('child-year')?.value?.trim();
  const school = document.getElementById('child-school')?.value?.trim();
  const color = document.getElementById('child-color')?.value||'#007AFF';
  const errEl = document.getElementById('child-error');
  if(!name){if(errEl)errEl.textContent='Please enter a name';return;}
  try{
    await addChild(name,year,school,color);
    goBack();
    showNotif(`${name} added! 🎉`);
  }catch(e){
    if(errEl)errEl.textContent=e.message;
  }
};

window.selectColor = (color)=>{
  document.getElementById('child-color').value = color;
  document.querySelectorAll('[id^="color-"]').forEach(el=>el.style.border='3px solid transparent');
  const el = document.getElementById('color-'+color.replace('#',''));
  if(el) el.style.border='3px solid #000';
};

window.handleAddPackingItem = async(childId)=>{
  const label = document.getElementById('pack-label')?.value?.trim();
  const errEl = document.getElementById('pack-error');
  if(!label){if(errEl)errEl.textContent='Please enter an item name';return;}
  try{
    await addPackingItem(childId,label);
    goBack();
    showNotif('Item added! ✅');
  }catch(e){
    if(errEl)errEl.textContent=e.message;
  }
};

window.togglePackItem = async(childId,itemId,checked)=>{
  try{await togglePackingItem(childId,itemId,checked);}catch(e){showNotif('Error updating item');}
};

window.deletePackItem = async(childId,itemId)=>{
  try{await deleteDoc(doc(db,'families',state.familyId,'children',childId,'packing',itemId));}catch(e){}
};

window.handleAddEvent = async()=>{
  const title = document.getElementById('ev-title')?.value?.trim();
  const date = document.getElementById('ev-date')?.value;
  const time = document.getElementById('ev-time')?.value?.trim();
  const location = document.getElementById('ev-location')?.value?.trim();
  const childId = document.getElementById('ev-child')?.value;
  const notes = document.getElementById('ev-notes')?.value?.trim();
  const errEl = document.getElementById('ev-error');
  if(!title||!date){if(errEl)errEl.textContent='Please enter a title and date';return;}
  try{
    await addEvent({title,date,time,location,childId,notes});
    goBack();
    showNotif('Event added! 📅');
  }catch(e){if(errEl)errEl.textContent=e.message;}
};

window.deleteEvent = async(id)=>{
  try{await deleteDoc(doc(db,'families',state.familyId,'events',id));showNotif('Event deleted');}catch(e){}
};

window.handleAddNote = async()=>{
  const text = document.getElementById('note-text')?.value?.trim();
  const childId = document.getElementById('note-child')?.value;
  const errEl = document.getElementById('note-error');
  if(!text){if(errEl)errEl.textContent='Please enter a note';return;}
  try{
    await addNote(childId,text);
    goBack();
    showNotif('Note saved! 📝');
  }catch(e){if(errEl)errEl.textContent=e.message;}
};

window.deleteNote = async(id)=>{
  try{await deleteDoc(doc(db,'families',state.familyId,'notes',id));showNotif('Note deleted');}catch(e){}
};

window.handleAddAssessment = async()=>{
  const childId = document.getElementById('ass-child')?.value;
  const subject = document.getElementById('ass-subject')?.value?.trim();
  const title = document.getElementById('ass-title')?.value?.trim();
  const due = document.getElementById('ass-due')?.value;
  const errEl = document.getElementById('ass-error');
  if(!title||!due){if(errEl)errEl.textContent='Please fill in title and due date';return;}
  const daysLeft = Math.ceil((new Date(due)-today)/(1000*60*60*24));
  try{
    await addAssessment(childId,subject,title,new Date(due).toLocaleDateString('en-AU',{day:'numeric',month:'short'}),daysLeft);
    goBack();
    showNotif('Assessment added! 📚');
  }catch(e){if(errEl)errEl.textContent=e.message;}
};

window.deleteAssessment = async(id)=>{
  try{await deleteDoc(doc(db,'families',state.familyId,'assessments',id));showNotif('Assessment deleted');}catch(e){}
};

window.handleSignOut = async()=>{
  state.unsubscribers.forEach(u=>u());
  state.unsubscribers=[];
  state.family=null;
  state.familyId=null;
  state.children=[];
  state.packing={};
  state.events=[];
  state.notes=[];
  state.assessments=[];
  state.stack=[];
  state.tab='today';
  await signOut(auth);
};

window.showFamilyCode = ()=>{
  const msg = `Share this code with family members to join:\n\n${state.familyId}`;
  if(navigator.clipboard){
    navigator.clipboard.writeText(state.familyId).then(()=>showNotif('Family code copied! 🔗'));
  } else {
    alert(msg);
  }
};

window.nav = nav;
window.goBack = goBack;
window.setTab = setTab;

// ── AUTH STATE ─────────────────────────────────────────────────
onAuthStateChanged(auth, async(user)=>{
  state.user = user;
  if(user){
    // Check if user has a family
    try{
      const userDoc = await getDoc(doc(db,'users',user.uid));
      if(userDoc.exists() && userDoc.data().familyId){
        state.familyId = userDoc.data().familyId;
        subscribeToFamily();
      }
    }catch(e){}
  }
  render();
});
</script>
</body>
</html>
