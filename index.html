window.runPlayDateOCR=async function(input){
  if(!input||!input.files||!input.files[0])return;
  const file=input.files[0];
  const status=document.getElementById('pd-ocr-status');
  if(status)status.innerHTML='⏳ Loading OCR engine...';
  try{
    const T=await loadTesseract();
    if(status)status.innerHTML='📖 Reading invite (10-20 seconds)...';
    const r=await T.recognize(file,'eng',{
      logger:m=>{if(m.status==='recognizing text'&&status)status.innerHTML='📖 Reading... '+Math.round(m.progress*100)+'%';}
    });
    const text=r.data.text||'';
    const cleanText=text.replace(/[^\x20-\x7E\n]/g,' '); // strip weird OCR artefacts
    const lines=cleanText.split(/\n+/).map(l=>l.trim()).filter(l=>l.length>1);
    const filledFields=[];
    const setVal=(id,val,label)=>{
      const el=document.getElementById(id);
      if(el&&val){el.value=val;filledFields.push(label||id);}
    };
    // Helper: determine if a string looks like coherent words (≥60% alphabetic chars, has 2+ letters in a row)
    function looksLikeText(s){
      if(!s||s.length<3)return false;
      const alpha=(s.match(/[a-zA-Z]/g)||[]).length;
      const total=s.length;
      if(alpha/total<0.5)return false;
      // Must contain a real word (2+ consecutive letters)
      if(!/[a-zA-Z]{3,}/.test(s))return false;
      // Reject if too many special chars
      const specials=(s.match(/[^a-zA-Z0-9\s'\-,.&]/g)||[]).length;
      if(specials/total>0.2)return false;
      return true;
    }

    // ── TITLE: Strictly look for "X's Birthday" pattern, otherwise leave blank ──
    let title='';
    const birthdayMatch=cleanText.match(/([A-Z][a-z]+)['\u2019]s\s+(?:(\d+)(?:st|nd|rd|th)?\s+)?birthday/i);
    const turnsMatch=cleanText.match(/([A-Z][a-z]+)\s+turns?\s+(\d+)/i);
    const partyMatch=cleanText.match(/([A-Z][a-z]+)['\u2019]s\s+(?:birthday\s+)?party/i);
    if(birthdayMatch){
      title=birthdayMatch[0].trim();
      setVal('pd-host',birthdayMatch[1],'host name');
    }else if(turnsMatch){
      const num=turnsMatch[2];
      const suffix=num.endsWith('1')&&num!=='11'?'st':num.endsWith('2')&&num!=='12'?'nd':num.endsWith('3')&&num!=='13'?'rd':'th';
      title=turnsMatch[1]+"'s "+num+suffix+' Birthday';
      setVal('pd-host',turnsMatch[1],'host name');
    }else if(partyMatch){
      title=partyMatch[1]+"'s Birthday Party";
      setVal('pd-host',partyMatch[1],'host name');
    }else{
      // Conservative fallback: only use first line if it really looks like clean text
      const firstClean=lines.find(l=>looksLikeText(l)&&l.length>=5&&l.length<=60);
      if(firstClean)title=firstClean;
    }
    if(title&&looksLikeText(title))setVal('pd-title',title,'title');

    // ── DATE: Need explicit month name OR proper dd/mm/yyyy format with 4-digit year ──
    let foundDate='';
    // Pattern 1: "15 April 2026" / "15th April 2026" / "April 15, 2026"
    const monthName=cleanText.match(/(\d{1,2})(?:st|nd|rd|th)?\s+(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\s+(\d{4})/i)
      || cleanText.match(/(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\s+(\d{1,2})(?:st|nd|rd|th)?[,\s]+(\d{4})/i);
    // Pattern 2: dd/mm/yyyy with 4-digit year
    const slashDate=cleanText.match(/(\d{1,2})[\/](\d{1,2})[\/](\d{4})/);
    const monthMap={jan:'01',feb:'02',mar:'03',apr:'04',may:'05',jun:'06',jul:'07',aug:'08',sep:'09',oct:'10',nov:'11',dec:'12'};
    if(monthName){
      // Need to detect order
      const isMonthFirst=/^(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)/i.test(monthName[1]);
      const day=isMonthFirst?monthName[2]:monthName[1];
      const monthStr=(isMonthFirst?monthName[1]:monthName[2]).toLowerCase().slice(0,3);
      const year=monthName[3];
      const m=monthMap[monthStr];
      if(m&&day>=1&&day<=31&&year>=2024&&year<=2100){
        foundDate=year+'-'+m+'-'+String(day).padStart(2,'0');
      }
    }else if(slashDate){
      const day=parseInt(slashDate[1]),month=parseInt(slashDate[2]),year=parseInt(slashDate[3]);
      if(day>=1&&day<=31&&month>=1&&month<=12&&year>=2024&&year<=2100){
        foundDate=year+'-'+String(month).padStart(2,'0')+'-'+String(day).padStart(2,'0');
      }
    }
    if(foundDate)setVal('pd-date',foundDate,'date');

    // ── TIME: Need am/pm explicitly ──
    let foundTime='';
    const timeRangeMatch=cleanText.match(/(\d{1,2})(?:[:\.](\d{2}))?\s*(am|pm)?\s*(?:-|–|—|to|until|till)\s*(\d{1,2})(?:[:\.](\d{2}))?\s*(am|pm)/i);
    const timeOneMatch=cleanText.match(/(\d{1,2})[:\.](\d{2})\s*(am|pm)/i);
    if(timeRangeMatch){
      foundTime=timeRangeMatch[0].replace(/\s+/g,' ').trim();
    }else if(timeOneMatch){
      foundTime=timeOneMatch[0].replace(/\s+/g,' ').trim();
    }
    if(foundTime)setVal('pd-time',foundTime,'time');

    // ── PHONE (Australian) ──
    const phoneMatch=cleanText.match(/(?:\+?61|0)\s?\d(?:[\s\-]?\d){7,9}/);
    if(phoneMatch){
      const phone=phoneMatch[0].trim();
      // Validate digits only count is reasonable (8-12)
      const digits=phone.replace(/\D/g,'');
      if(digits.length>=9&&digits.length<=12)setVal('pd-host-phone',phone,'phone');
    }

    // ── HOST PARENT NAME (after "RSVP", "From", "Contact", "love from") ──
    const rsvpNameMatch=cleanText.match(/(?:rsvp(?:\s+to)?|from|contact|love\s+from)[\s,:]+([A-Z][a-z]+(?:\s+[A-Z][a-z]+)?)/i);
    if(rsvpNameMatch&&document.getElementById('pd-host-parent')&&!document.getElementById('pd-host-parent').value){
      const candidate=rsvpNameMatch[1].trim();
      if(looksLikeText(candidate))setVal('pd-host-parent',candidate,'host parent name');
    }

    // ── ADDRESS (lines containing street suffixes or after "at"/"venue:"/"address:") ──
    let address='';
    const addrPatternMatch=cleanText.match(/(?:venue:?|address:?|location:?)\s+([^\n]{8,100})/i);
    if(addrPatternMatch&&looksLikeText(addrPatternMatch[1])){
      address=addrPatternMatch[1].trim();
    }else{
      // Look for lines with street suffixes (must also look like text)
      const streetSuffix=/\b(street|road|avenue|drive|lane|crescent|place|terrace|close|court|highway|park|parade)\b/i;
      const streetLine=lines.find(l=>streetSuffix.test(l)&&l.length<100&&looksLikeText(l));
      if(streetLine)address=streetLine;
    }
    if(address)setVal('pd-location',address,'location');

    // ── NOTES (raw text but only if short) ──
    // Don't count this in filledFields - it's always filled
    const notesEl=document.getElementById('pd-notes');
    if(notesEl){
      // Only set notes if user hasn't already typed something
      if(!notesEl.value){
        notesEl.value='[OCR raw text — edit as needed]\n'+text.trim().substring(0,400);
      }
    }

    if(status){
      if(filledFields.length>0){
        status.innerHTML='✅ Filled: '+filledFields.join(', ')+'. Review & edit below.';
      }else{
        status.innerHTML='⚠️ Could not detect details cleanly. Raw text saved to Notes — please enter fields manually.';
      }
    }
  }catch(ex){
    if(status)status.innerHTML='❌ OCR failed: '+ex.message+'. Please enter manually.';
  }
};

function scheduleDayBeforeNotif(pd){

    setTimeout(function(){
      try{

}

window.requestNotifPerm=async function(){
  // DIAGNOSTIC VERSION - shows alert popups at every step so we can see where it fails
  const diag=(msg)=>{try{alert('🔔 '+msg);}catch(e){}};

  diag('Step 1: Function called');

  if(typeof Notification==='undefined'){
    diag('FAIL: Notification API undefined');
    notify('Notifications not supported on this browser');
    return;
  }
  diag('Step 2: Notification API available');

  // iOS PWA gate
  if(isIOS&&!isStandalonePWA){
    diag('FAIL: On iOS but not in PWA mode. Add to Home Screen first.');
    notify('On iPhone: tap Share → Add to Home Screen, then enable from there 📲','ℹ️');
    return;
  }
  diag('Step 3: PWA mode OK (or non-iOS)');

  // Permission request
  let perm=Notification.permission;
  diag('Step 4: Current permission = '+perm);
  if(perm!=='granted'&&perm!=='denied'){
    diag('Step 5: Requesting permission...');
    perm=await Notification.requestPermission();
    diag('Step 5b: Permission result = '+perm);
  }
  if(perm!=='granted'){
    diag('FAIL: Permission not granted (was '+perm+')');
    notify('Permission denied. Enable in browser settings.','⚠️');
    return;
  }
  diag('Step 6: Permission granted!');

  try{
    if(!('serviceWorker' in navigator)){
      throw new Error('serviceWorker not in navigator');
    }
    diag('Step 7: Registering service worker...');
    const swReg=await navigator.serviceWorker.register('/firebase-messaging-sw.js');
    diag('Step 8: SW registered. State: '+(swReg.active?'active':swReg.waiting?'waiting':swReg.installing?'installing':'unknown'));

    if(swReg.installing||swReg.waiting){
      diag('Step 8b: Waiting for SW to activate...');
      await new Promise(res=>{
        const sw=swReg.installing||swReg.waiting;
        sw?.addEventListener('statechange',()=>{if(sw.state==='activated')res();});
        setTimeout(res,5000);
      });
      diag('Step 8c: SW wait done');
    }

    if(!messaging){
      diag('Step 9: Initialising messaging...');
      const ok=await initMessaging();
      diag('Step 9b: initMessaging returned '+ok);
    }
    if(!messaging){
      throw new Error('messaging is still null after init');
    }
    diag('Step 10: Messaging ready, requesting token...');

    // Wrap getToken in its own try/catch with a 15s timeout to surface errors
    let token=null;
    try{
      const tokenPromise=getToken(messaging,{vapidKey:VAPID_KEY,serviceWorkerRegistration:swReg});
      const timeoutPromise=new Promise((_,rej)=>setTimeout(()=>rej(new Error('TIMEOUT after 15 seconds')),15000));
      token=await Promise.race([tokenPromise,timeoutPromise]);
    }catch(getErr){
      diag('STEP 10 FAILED:\n\nName: '+(getErr.name||'?')+
           '\nCode: '+(getErr.code||'?')+
           '\nMessage: '+(getErr.message||String(getErr))+
           '\n\nNotification.permission: '+Notification.permission+
           '\nVAPID len: '+(VAPID_KEY?VAPID_KEY.length:0)+
           '\nSW scope: '+(swReg.scope||'?'));
      throw getErr;
    }
    diag('Step 11: getToken returned '+(token?'token of length '+token.length:'NULL'));

    if(!token){throw new Error('getToken returned null/empty');}

    if(S.user?.uid){
      diag('Step 12: Saving token to Firestore for uid '+S.user.uid.slice(0,8)+'...');
      await setDoc(doc(db,'users',S.user.uid,'fcmTokens',token),{
        token,
        platform:isIOS?'ios':(/Android/.test(navigator.userAgent)?'android':'web'),
        standalone:isStandalonePWA,
        userAgent:navigator.userAgent.slice(0,200),
        familyId:S.familyId||'',
        updatedAt:new Date()
      });
      diag('Step 13: Token saved to Firestore SUCCESS!');
    }else{
      diag('FAIL: S.user.uid is missing, cannot save token');
    }

    notify('Notifications enabled! 🔔');
    try{
      new Notification('HomeBase notifications enabled!',{body:"You'll get reminders for events, packing, and more.",tag:'enable-confirmation'});
    }catch(e){diag('Local Notification show failed: '+e.message);}
    render();
  }catch(ex){
    console.error('[HomeBase] FCM enable failed',ex);
    diag('ERROR at registration: '+(ex.message||ex)+'\n\nName: '+(ex.name||'')+'\nCode: '+(ex.code||''));
    notify('Push setup failed - see alert above','⚠️');
    render();
  }
};

// Schedule daily check for notification time
function scheduleDailyNotif(){
  if(typeof Notification==='undefined'||Notification.permission!=='granted')return;
  // Respect the morning-summary toggle. If user has disabled morning notifs,
  // we don't schedule anything (and any pre-existing timer is cleared below).
  if(window._dailyNotifTimer){clearTimeout(window._dailyNotifTimer);window._dailyNotifTimer=null;}
  if(window._dailyNotifInterval){clearInterval(window._dailyNotifInterval);window._dailyNotifInterval=null;}
  if(S.notifMorning===false)return;
  if(!S.notifTime)return;
  const now=new Date();
  const [hh,mm]=S.notifTime.split(':').map(Number);
  const next=new Date();next.setHours(hh,mm,0,0);
  if(next<=now)next.setDate(next.getDate()+1);
  const delay=next-now;
  window._dailyNotifTimer=setTimeout(function(){
    sendDailyNotif();
    window._dailyNotifInterval=setInterval(sendDailyNotif,86400000);
  },delay);
}

// === PER-EVENT REMINDERS ===
// Schedules a local notification for each timed event today, firing
// S.notifEventLead minutes before the event start time. Skips:
//   - Events without a time (all-day) — nothing to anchor to
//   - Events already past their lead-time window — too late to be useful
//   - Anything when S.notifEvents is false or permission denied
// Timers are stored in window._eventNotifTimers so we can cancel/reschedule
// when the events list changes, settings change, or midnight rolls over.
function scheduleEventNotifs(){
  // Clear any existing timers
  if(Array.isArray(window._eventNotifTimers)){
    window._eventNotifTimers.forEach(function(id){try{clearTimeout(id);}catch(e){}});
  }
  window._eventNotifTimers=[];
  if(typeof Notification==='undefined'||Notification.permission!=='granted')return;
  if(S.notifEvents!==true)return;
  const lead=Number(S.notifEventLead)||15;
  const now=new Date();
  const today=fd(now);
  const dayName=DAYSH[now.getDay()];
  // Find today's timed events (mirrors the day-view filter logic)
  const todayEvs=(S.events||[]).filter(function(ev){
    if(!ev.time)return false; // all-day events skipped
    // Skip occurrences explicitly skipped via the clash flow
    if(Array.isArray(ev.skipDates)&&ev.skipDates.includes(today))return false;
    if(!ev.freq||ev.freq==='once')return ev.date===today;
    if(!ev.days||!ev.days[dayName])return false;
    const sd=ev.startDate||ev.date;
    if(sd&&today<sd)return false;
    if(ev.endDate&&today>ev.endDate)return false;
    return true;
  });
  todayEvs.forEach(function(ev){
    const startMin=parseTimeToMinutes(ev.time);
    if(!Number.isFinite(startMin)||startMin<=0)return;
    const fireAt=new Date(now);
    const fireMin=startMin-lead;
    fireAt.setHours(Math.floor(fireMin/60),fireMin%60,0,0);
    const delay=fireAt-now;
    if(delay<=0)return; // event lead window already passed
    if(delay>86400000)return; // safety: never schedule >24h out
    const tid=setTimeout(function(){
      try{
        const body=(ev.time||'')+(ev.location?' · '+ev.location:'');
        new Notification('⏰ '+(ev.title||'Event')+' in '+lead+' min',{
          body:body,
          tag:'evnotif-'+ev.id,
          icon:(document.querySelector('link[rel=apple-touch-icon]')||{}).href||''
        });
      }catch(e){}
    },delay);
    window._eventNotifTimers.push(tid);
  });
}
function sendDailyNotif(){
  if(typeof Notification==='undefined'||Notification.permission!=='granted')return;
  const allEvs=S.events.filter(function(ev){
    if(!ev.freq||ev.freq==='once')return ev.date===todayStr;
    const start=new Date((ev.startDate||ev.date||todayStr)+'T12:00');
    const end=ev.endDate?new Date(ev.endDate+'T12:00'):null;
    const now=new Date(todayStr+'T12:00');
    if(now<start||(end&&now>end))return false;
    return ev.days&&ev.days[DAYSH[now.getDay()]];
  });
  // Short title (always fits the preview), plus a body that fits in 2 lines on most lockscreens
  let title=allEvs.length===0?'No events today 🎉':(allEvs.length+' event'+(allEvs.length>1?'s':'')+' today');
  let body='';
  if(allEvs.length>0){
    // Build "9am Swimming · 3pm Soccer" style — much shorter than full titles
    const shortItems=allEvs.slice(0,3).map(function(e){
      const t=(e.time||'').replace(/:00\b/g,'').replace(' ','');
      const tt=(e.title||'').slice(0,28);
      return t?(t+' '+tt):tt;
    });
    body=shortItems.join(' · ');
    if(allEvs.length>3)body+=' +'+(allEvs.length-3)+' more';
  }
  new Notification(title,{body:body,icon:(document.querySelector('link[rel=apple-touch-icon]')||{}).href||'',tag:'hb-daily',renotify:false});
}

window.generatePersonalCode=async function(personId,kind){
  if(!S.familyId){notify('No family found','⚠️');return;}
  const code='HB-'+(kind==='adult'?'A':'C')+'-'+Math.random().toString(36).substring(2,7).toUpperCase();
  try{
    // 1. Write the invitation token doc — this is what makes the join work without enumerating families
    await setDoc(doc(db,'invitations',code),{
      familyId:S.familyId,
      familyName:S.family?.name||'',
      kind,
      targetId:personId,
      createdBy:S.user?.uid||'',
      createdAt:new Date(),
      used:false
    });
    // 2. Stamp the code on the person doc too (so admin can see it on the profile)
    if(kind==='child'){
      await updateDoc(doc(db,'families',S.familyId,'children',personId),{personalCode:code});
      const c=S.children.find(ch=>ch.id===personId);
      if(c)c.personalCode=code;
    }else{
      const path='members.'+personId+'.personalCode';
      await updateDoc(doc(db,'families',S.familyId),{[path]:code});
      if(S.family?.members?.[personId])S.family.members[personId].personalCode=code;

  }catch(ex){

window.hAddReminder=async function(){
  const text=document.getElementById('rmText')?.value?.trim()||'';
  const date=document.getElementById('rmDate')?.value||'';
  const notes=document.getElementById('rmNotes')?.value?.trim()||'';
  const err=document.getElementById('rmErr');
  if(!text){if(err)err.textContent='Enter what to remember';return;}
  if(!date){if(err)err.textContent='Choose a date';return;}
  const forKeys=Array.isArray(S.rmFor)?[...S.rmFor]:[];
  let childId='',adultUid='';
  const firstChild=forKeys.find(k=>k.startsWith('child:'));
  const firstAdult=forKeys.find(k=>k.startsWith('adult:'));
  if(firstChild)childId=firstChild.replace('child:','');
  if(firstAdult)adultUid=firstAdult.replace('adult:','');
  const mode=S.rmMode==='ongoing'?'ongoing':'ondate';
  try{
    if(S.rmEditId){
      // Edit existing
      await fupd(['reminders',S.rmEditId],{text,date,mode,forKeys,childId,adultUid,notes});
      S.rmEditId=null;
      notify('Reminder updated ⏰');
    }else{
      // Create new
      await fadd(['reminders'],{
        text,date,mode,forKeys,childId,adultUid,notes,
        done:false,createdBy:S.user?.uid||''
      });
      notify('Reminder saved ⏰');
    }
    S.rmFor=[];
    S.rmMode='ondate';
    S.rmText=''; S.rmDate=''; S.rmNotes='';
    back();
  }catch(ex){if(err)err.textContent='Error: '+ex.message;}
};

// Universal handler for events + reminders. Mobile: hold finger 500ms.
// Desktop: right-click. Pops a small action sheet with Edit / Duplicate / Delete.
//
// Usage in a row: data-longpress="event:abc123" or data-longpress="reminder:xyz789"
// Plus oncontextmenu="hbHandleContext(event,this);return false"
//
// Touch handlers attach automatically via document delegation (set up below).

window._lpTimer=null;
window._lpStartXY=null;

function hbShowContextMenu(x,y,kind,id){

  hbCloseContextMenu();
  const item=kind==='event'?S.events.find(e=>e.id===id):S.reminders.find(r=>r.id===id);
  if(!item)return;
  // Reminders that are virtual (birthdays/parent days) shouldn't get a context menu

  const vw=window.innerWidth;

  const top=Math.min(Math.max(8,y),vh-menuH-8);

  // Truncate the title for the header
  const shortTitle=title.length>30?title.slice(0,30)+'…':title;

  let buttons='';
  if(kind==='event'){
    buttons=`
      <button onclick="hbCtxAction('edit','${id}')" style="width:100%;text-align:left;padding:11px 14px;border:none;background:transparent;color:var(--text);font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;border-radius:8px;display:flex;align-items:center;gap:10px">
        <span style="font-size:16px">✏️</span><span>Edit</span>
      </button>
      <button onclick="hbCtxAction('duplicate','${id}')" style="width:100%;text-align:left;padding:11px 14px;border:none;background:transparent;color:var(--text);font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;border-radius:8px;display:flex;align-items:center;gap:10px">
        <span style="font-size:16px">📋</span><span>Duplicate</span>
      </button>
      <div style="height:1px;background:var(--row-border);margin:4px 0"></div>
      <button onclick="hbCtxAction('delete','${id}')" style="width:100%;text-align:left;padding:11px 14px;border:none;background:transparent;color:#FF3B30;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;border-radius:8px;display:flex;align-items:center;gap:10px">
        <span style="font-size:16px">🗑️</span><span>Delete</span>
      </button>`;
  }else{
    // Reminders: Edit + Delete only (no duplicate — reminders are one-time tasks)
    buttons=`
      <button onclick="hbCtxAction('edit-reminder','${id}')" style="width:100%;text-align:left;padding:11px 14px;border:none;background:transparent;color:var(--text);font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;border-radius:8px;display:flex;align-items:center;gap:10px">
        <span style="font-size:16px">✏️</span><span>Edit reminder</span>
      </button>
      <div style="height:1px;background:var(--row-border);margin:4px 0"></div>
      <button onclick="hbCtxAction('delete-reminder','${id}')" style="width:100%;text-align:left;padding:11px 14px;border:none;background:transparent;color:#FF3B30;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;border-radius:8px;display:flex;align-items:center;gap:10px">
        <span style="font-size:16px">🗑️</span><span>Delete</span>
      </button>`;
  }

  menu.innerHTML=`
    <div style="padding:8px 14px 6px;font-size:11px;color:var(--text-secondary);font-weight:600;text-transform:uppercase;letter-spacing:0.5px;border-bottom:1px solid var(--row-border);margin-bottom:4px">${shortTitle}</div>
    ${buttons}
  `;

  // Backdrop to capture taps outside
  const backdrop=document.createElement('div');
  backdrop.id='hb-context-backdrop';
  backdrop.style.cssText='position:fixed;inset:0;z-index:9999;background:transparent';
  backdrop.onclick=hbCloseContextMenu;
  backdrop.addEventListener('contextmenu',function(e){e.preventDefault();hbCloseContextMenu();});

  document.body.appendChild(backdrop);
  document.body.appendChild(menu);

  // Haptic feedback on mobile
  if(navigator.vibrate)try{navigator.vibrate(8);}catch(e){}
}

window.hbCtxAction=function(action,id){

// Document-level event delegation for long-press detection.
// Hooks into elements with data-longpress="kind:id"
document.addEventListener('touchstart',function(e){
  const target=e.target.closest('[data-longpress]');
  if(!target)return;
  const t=e.touches[0];
  window._lpStartXY={x:t.clientX,y:t.clientY};
  if(window._lpTimer)clearTimeout(window._lpTimer);
  window._lpTimer=setTimeout(function(){
    const lp=target.getAttribute('data-longpress')||'';
    const [kind,id]=lp.split(':');
    if(!kind||!id)return;
    // Long-press triggered — show menu, prevent click that would otherwise follow
    target._lpFired=true;
    hbShowContextMenu(window._lpStartXY.x,window._lpStartXY.y,kind,id);
  },500);
},{passive:true});

document.addEventListener('touchmove',function(e){
  if(!window._lpStartXY||!window._lpTimer)return;
  const t=e.touches[0];
  const dx=Math.abs(t.clientX-window._lpStartXY.x);
  const dy=Math.abs(t.clientY-window._lpStartXY.y);
  // Cancel long-press if user is scrolling
  if(dx>10||dy>10){
    clearTimeout(window._lpTimer);
    window._lpTimer=null;
  }
},{passive:true});

document.addEventListener('touchend',function(e){
  if(window._lpTimer){clearTimeout(window._lpTimer);window._lpTimer=null;}
  // If long-press fired, swallow the click that follows
  const target=e.target.closest('[data-longpress]');
  if(target&&target._lpFired){
    e.preventDefault();
    e.stopPropagation();
    setTimeout(function(){target._lpFired=false;},50);
  }
},{passive:false});

// Right-click on desktop = context menu
document.addEventListener('contextmenu',function(e){
  const target=e.target.closest('[data-longpress]');
  if(!target)return;
  const lp=target.getAttribute('data-longpress')||'';
  const [kind,id]=lp.split(':');
  if(!kind||!id)return;
  e.preventDefault();
  hbShowContextMenu(e.clientX,e.clientY,kind,id);
});

// Opens a bottom-sheet showing all recurring events of a given title (e.g. "Swimming"),
// grouped by person. Tap outside or × to close.
window.openActivityModal=function(activityTitle){
  // Find all recurring events matching this title (case-insensitive)
  const target=(activityTitle||'').trim().toLowerCase();
  const matching=S.events.filter(ev=>(ev.freq&&ev.freq!=='once')&&((ev.title||'').trim().toLowerCase()===target));
  if(matching.length===0)return;
  closeActivityModal();

  // Group events by person (using participantIds OR childId/adultUid)
  const peopleForEv=ev=>{
    const ids=Array.isArray(ev.participantIds)&&ev.participantIds.length
      ?ev.participantIds
      :[ev.childId,ev.adultUid].filter(Boolean);
    return ids.map(id=>{
      const c=S.children.find(x=>x.id===id);
      if(c)return {name:c.name,color:c.color||NAVY,photo:c.photoURL,id};
      const m=members().find(x=>x.uid===id);
      if(m)return {name:m.name,color:m.color||NAVY,photo:m.photoURL,id};
      return null;
    }).filter(Boolean);
  };

  // Map: personId → {person, events[]} ; family events keyed under '__family'
  const byPerson=new Map();
  matching.forEach(ev=>{
    const ppl=peopleForEv(ev);
    if(ppl.length===0){
      if(!byPerson.has('__family'))byPerson.set('__family',{person:null,events:[]});
      byPerson.get('__family').events.push(ev);
    }else{
      ppl.forEach(p=>{
        if(!byPerson.has(p.id))byPerson.set(p.id,{person:p,events:[]});
        byPerson.get(p.id).events.push(ev);
      });
    }
  });

  const groups=[...byPerson.values()].sort((a,b)=>{
    if(!a.person)return 1;
    if(!b.person)return -1;
    return a.person.name.localeCompare(b.person.name);
  });

  // Format the days array into "Mon, Wed" or "weekly" style
  const formatDays=ev=>{
    if(!ev.days)return ev.freq||'';
    const order=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
    const ds=order.filter(d=>ev.days[d]);
    if(ds.length===7)return 'every day';
    if(ds.length===0)return ev.freq||'';
    const long={Mon:'Mondays',Tue:'Tuesdays',Wed:'Wednesdays',Thu:'Thursdays',Fri:'Fridays',Sat:'Saturdays',Sun:'Sundays'};
    if(ds.length===1)return long[ds[0]];
    return ds.join(', ');
  };

  const overlay=document.createElement('div');
  overlay.id='activity-modal-overlay';
  overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:9999;display:flex;align-items:flex-end;justify-content:center;animation:hbFadeIn 0.18s ease-out';
  if(!document.getElementById('hbPickerKeyframes')){
    const st=document.createElement('style');st.id='hbPickerKeyframes';
    st.textContent='@keyframes hbFadeIn{from{opacity:0}to{opacity:1}}@keyframes hbSlideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}';
    document.head.appendChild(st);
  }
  overlay.onclick=function(e){if(e.target===overlay)closeActivityModal();};

  const sheet=document.createElement('div');
  sheet.style.cssText='background:var(--card);border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;animation:hbSlideUp 0.24s cubic-bezier(.22,.61,.36,1);box-shadow:0 -8px 32px rgba(0,0,0,0.18);-webkit-overflow-scrolling:touch';
  sheet.onclick=function(e){e.stopPropagation();};

  const groupHtml=groups.map(g=>{
    const personLabel=g.person?g.person.name.split(' ')[0]:'Family';
    const personColor=g.person?g.person.color:NAVY;
    const eventsHtml=g.events.sort((a,b)=>parseTimeToMinutes(a.time)-parseTimeToMinutes(b.time)).map(ev=>{
      const myName=S.user?.displayName||'';
      const myFirst=myName.split(' ')[0];
      const isMyDropoff=ev.dropoff&&(ev.dropoff===myName||ev.dropoff===myFirst);
      const isMyPickup=ev.pickup&&(ev.pickup===myName||ev.pickup===myFirst);
      return `<div onclick="closeActivityModal();openEventModal('${ev.id}')" style="background:var(--bg);border-radius:10px;padding:10px 12px;margin-bottom:6px;cursor:pointer;display:flex;align-items:center;gap:8px">
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:600;color:var(--text)">${formatDays(ev)}${ev.time?' · '+ev.time:''}</div>
          ${ev.location?`<div style="font-size:11px;color:var(--text-secondary);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">📍 ${ev.location}</div>`:''}
          ${ev.dropoff||ev.pickup?`<div style="font-size:11px;color:${personColor};margin-top:2px;font-weight:500">${ev.dropoff?(isMyDropoff?'🚗 '+ev.dropoff.split(' ')[0]+' (you)':'🚗 '+ev.dropoff.split(' ')[0]):''}${ev.dropoff&&ev.pickup?' · ':''}${ev.pickup?(isMyPickup?'🏠 '+ev.pickup.split(' ')[0]+' (you)':'🏠 '+ev.pickup.split(' ')[0]):''}</div>`:''}
        </div>
        <div style="color:var(--text-secondary);font-size:16px;flex-shrink:0">›</div>
      </div>`;
    }).join('');
    return `<div style="margin-bottom:14px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
        ${g.person?av(g.person.name,personColor,28,g.person.photo):'<div style="width:28px;height:28px;border-radius:14px;background:'+NAVY+'18;display:flex;align-items:center;justify-content:center;font-size:14px">👨‍👩‍👧</div>'}
        <div style="font-size:14px;font-weight:700;color:${personColor}">${personLabel}</div>
        <div style="font-size:11px;color:var(--text-secondary);font-weight:500">· ${g.events.length} ${g.events.length===1?'event':'events'}</div>
      </div>
      ${eventsHtml}
    </div>`;
  }).join('');

  sheet.innerHTML=`
    <div style="position:sticky;top:0;background:var(--card);padding:10px 0 6px;z-index:1;border-bottom:1px solid var(--row-border)">
      <div style="width:40px;height:4px;background:#D1D1D6;border-radius:2px;margin:0 auto"></div>
    </div>
    <div style="padding:14px 20px 22px">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
        <div style="flex:1">
          <div style="font-size:11px;font-weight:600;color:var(--text-secondary);letter-spacing:0.5px;margin-bottom:2px">ACTIVITY</div>

      </div>
      ${groupHtml}
      <button onclick="closeActivityModal()" style="width:100%;margin-top:6px;padding:13px;border-radius:12px;background:var(--bg);border:none;color:var(--text);font-size:14px;font-weight:700;cursor:pointer;font-family:inherit">Close</button>
    </div>`;

  overlay.appendChild(sheet);
  document.body.appendChild(overlay);

  const escHandler=function(e){if(e.key==='Escape')closeActivityModal();};
  document.addEventListener('keydown',escHandler);
  overlay._escHandler=escHandler;
};

// ── VOICE QUICK ADD ──────────────────────────────────
// Web Speech API → intent parser → save as reminder/grocery
const _SR=window.SpeechRecognition||window.webkitSpeechRecognition;

// Parse a transcript into a structured intent
function parseVoiceIntent(transcript){
  const text=(transcript||'').trim();
  if(!text)return {kind:'empty'};
  const low=text.toLowerCase();

  // Gift idea intents (tested first since they have specific keywords)
  // "gift idea for olivia: blue scarf"  /  "birthday present for alby blue headphones"
  // Recipient is captured as a single word (or "for X: " for two-word names)
  let m=low.match(/^(?:add\s+)?(?:a\s+)?(?:birthday\s+|christmas\s+|xmas\s+)?(?:gift|present)(?:\s+idea)?\s+(?:for|to)\s+(\w+)\s*[:,\-]\s*(.+)/);
  if(m&&m[2]&&m[2].trim().length>1){
    return {kind:'gift',recipientHint:m[1].trim(),idea:m[2].trim(),phrase:text};
  }
  m=low.match(/^(?:add\s+)?(?:a\s+)?(?:birthday\s+|christmas\s+|xmas\s+)?(?:gift|present)(?:\s+idea)?\s+(?:for|to)\s+(\w+)\s+(.+)/);
  if(m&&m[2]&&m[2].trim().length>1){
    return {kind:'gift',recipientHint:m[1].trim(),idea:m[2].trim(),phrase:text};
  }

  // Shopping list intents
  m=low.match(/^(?:shopping list|grocery list|groceries|shop)\s*[:,]?\s*(.+)/);
  if(m){
    const items=m[1].split(/\s*(?:,|\band\b)\s*/i).map(s=>s.trim()).filter(s=>s.length>0);
    return {kind:'grocery',items,phrase:text};
  }
  m=low.match(/^(?:buy|get|need|pick up|add)\s+(.+)/);
  if(m){
    const rest=m[1];
    if(/\b(?:from (?:the )?(?:shop|shops|store|supermarket)|to (?:the )?(?:grocery|shopping)\s*list?)\b/.test(rest)){
      const cleaned=rest.replace(/\b(?:from (?:the )?(?:shop|shops|store|supermarket)|to (?:the )?(?:grocery|shopping)\s*list?)\b.*$/,'').trim();
      const items=cleaned.split(/\s*(?:,|\band\b)\s*/i).map(s=>s.trim()).filter(Boolean);
      return {kind:'grocery',items,phrase:text};
    }
    if(rest.length<60&&!/\b(today|tomorrow|monday|tuesday|wednesday|thursday|friday|saturday|sunday|am|pm|at \d|by \d|next |on (?:the )?\d)\b/i.test(rest)){
      const items=rest.split(/\s*(?:,|\band\b)\s*/i).map(s=>s.trim()).filter(Boolean);
      return {kind:'grocery',items,phrase:text};
    }
  }

  // Reminder intents
  m=low.match(/^(?:remind (?:me|us)(?:\s+to)?|reminder(?:\s*(?:to|for))?|set (?:a )?reminder(?:\s+(?:to|for))?|add (?:a )?reminder(?:\s+(?:to|for))?|note to self(?:\s+to)?|don'?t forget (?:to)?)\s+(.+)/);
  if(m){
    return {kind:'reminder',raw:m[1],phrase:text};
  }

  return {kind:'unknown',phrase:text};
}

// Pull date + time out of a reminder phrase
function extractDateTimeFromPhrase(phrase){
  let cleaned=phrase;
  let date='';
  const today=new Date();

  if(/\btoday\b/i.test(cleaned)){
    date=fd(today);
    cleaned=cleaned.replace(/\btoday\b/i,'');
  }else if(/\btomorrow\b/i.test(cleaned)){
    const t=new Date(today);t.setDate(t.getDate()+1);
    date=fd(t);
    cleaned=cleaned.replace(/\btomorrow\b/i,'');
  }else{
    const dowMatch=cleaned.match(/\b(?:next\s+|on\s+|this\s+)?(monday|tuesday|wednesday|thursday|friday|saturday|sunday)\b/i);
    if(dowMatch){
      const days=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
      const targetDow=days.indexOf(dowMatch[1].toLowerCase());
      const todayDow=today.getDay();
      let daysAhead=(targetDow-todayDow+7)%7;
      if(daysAhead===0||/^next/i.test(dowMatch[0]))daysAhead=daysAhead||7;
      const t=new Date(today);t.setDate(t.getDate()+daysAhead);
      date=fd(t);
      cleaned=cleaned.replace(dowMatch[0],'');
    }else{
      const d=parseLooseDate(cleaned);
      if(d){
        date=d;
        const dateRe=/\d{1,2}(?:st|nd|rd|th)?\s+(?:jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*/i;
        cleaned=cleaned.replace(dateRe,'');
      }
    }
  }

  const time=parseLooseTime(cleaned);
  if(time)cleaned=cleaned.replace(/\b\d{1,2}(?::\d{2})?\s*(?:am|pm|AM|PM)\b/,'');

  cleaned=cleaned.replace(/\s+(?:at|on|by|in)\s*$/i,'').replace(/^(?:at|on|by|in)\s+/i,'').replace(/\s+/g,' ').trim();

  return {text:cleaned,date,time};
}

window.closeVoiceQuickAdd=function(){
  if(window._activeRecognition){
    try{window._activeRecognition.stop();}catch(e){}
    window._activeRecognition=null;
  }
  const m=document.getElementById('voice-modal-overlay');
  if(m){
    if(m._escHandler)document.removeEventListener('keydown',m._escHandler);
    m.style.animation='hbVoiceFadeIn 0.15s reverse';
    setTimeout(function(){if(m.parentNode)m.remove();},140);
  }
};

window.startVoiceCapture=function(){
  if(!_SR)return;
  const recognition=new _SR();
  recognition.lang='en-AU';
  recognition.continuous=false;
  recognition.interimResults=true;
  recognition.maxAlternatives=1;

  const iconEl=document.getElementById('voice-state-icon');
  const titleEl=document.getElementById('voice-state-title');
  const hintEl=document.getElementById('voice-state-hint');
  const btnEl=document.getElementById('voice-start-btn');
  const transcriptEl=document.getElementById('voice-transcript');
  let finalTranscript='';

  if(iconEl)iconEl.textContent='👂';
  if(titleEl)titleEl.textContent='Listening…';
  if(hintEl)hintEl.textContent='Speak naturally, then pause when done';
  if(btnEl){
    btnEl.textContent='⏹';
    btnEl.style.background='#8E8E93';
    btnEl.style.animation='hbPulse 1.4s infinite';
    btnEl.onclick=function(){try{recognition.stop();}catch(e){}};
  }
  if(transcriptEl){transcriptEl.style.display='block';transcriptEl.textContent='…';}

  recognition.onresult=function(e){
    let interim='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      const t=e.results[i][0].transcript;
      if(e.results[i].isFinal)finalTranscript+=t;
      else interim+=t;
    }
    if(transcriptEl)transcriptEl.textContent=(finalTranscript+interim)||'…';
  };
  recognition.onend=function(){
    window._activeRecognition=null;
    if(btnEl)btnEl.style.animation='';
    finishVoiceCapture(finalTranscript||(transcriptEl?transcriptEl.textContent:''));
  };
  recognition.onerror=function(e){
    window._activeRecognition=null;
    if(btnEl)btnEl.style.animation='';
    if(e.error==='not-allowed'||e.error==='service-not-allowed'){
      if(titleEl)titleEl.textContent='Microphone permission denied';
      if(hintEl)hintEl.textContent='Allow microphone access in browser settings, then try again.';
    }else if(e.error==='no-speech'){
      if(titleEl)titleEl.textContent='Didn\'t hear anything';
      if(hintEl)hintEl.textContent='Tap the mic and try again.';
      if(btnEl){btnEl.textContent='🎤';btnEl.style.background='#FF3B30';btnEl.onclick=function(){startVoiceCapture();};}
    }else{
      if(titleEl)titleEl.textContent='Error: '+e.error;
    }
  };

  try{
    recognition.start();
    window._activeRecognition=recognition;
  }catch(ex){
    notify('Could not start microphone: '+(ex.message||ex),'❌');
  }
};

function finishVoiceCapture(transcript){
  const card=document.getElementById('voice-modal-card');
  if(!card)return;
  if(!transcript||!transcript.trim()){
    const titleEl=document.getElementById('voice-state-title');
    const hintEl=document.getElementById('voice-state-hint');
    const btnEl=document.getElementById('voice-start-btn');
    if(titleEl)titleEl.textContent='Didn\'t catch that';
    if(hintEl)hintEl.textContent='Tap to try again.';
    if(btnEl){btnEl.textContent='🎤';btnEl.style.background='#FF3B30';btnEl.onclick=function(){startVoiceCapture();};}
    return;
  }
  // Bold mode: ALWAYS hand off to AI for intent parsing.
  // Falls back to local regex parser if AI is unavailable or rate-limited.
  routeVoiceViaAI(transcript);
}

// AI-powered voice routing: send transcript to parseVoiceCommand cloud function,
// then render confirmation UI for each intent the AI returned.
async function routeVoiceViaAI(transcript){
  const iconEl=document.getElementById('voice-state-icon');
  const titleEl=document.getElementById('voice-state-title');
  const hintEl=document.getElementById('voice-state-hint');
  const btnEl=document.getElementById('voice-start-btn');
  const transcriptEl=document.getElementById('voice-transcript');
  const actionsEl=document.getElementById('voice-actions');

  if(transcriptEl){
    transcriptEl.style.display='block';
    transcriptEl.innerHTML='<div style="font-size:11px;color:var(--text-secondary);font-weight:600;margin-bottom:4px">YOU SAID</div>'+transcript;
  }
  if(btnEl)btnEl.style.display='none';
  if(iconEl)iconEl.textContent='🤖';
  if(titleEl)titleEl.textContent='Understanding…';
  if(hintEl)hintEl.innerHTML='<div style="font-size:12px;color:var(--text-secondary)">AI is parsing your command</div>';

  // Pull people hints for the AI so it can match names
  const peopleHints=[
    ...S.children.map(c=>({name:c.name,kind:'child'})),
    ...members().map(m=>({name:m.name,kind:'adult'}))
  ];

  // Try AI first
  try{
    if(typeof httpsCallable==='undefined'||!functions){
      throw new Error('Cloud functions unavailable');
    }
    const aiCall=httpsCallable(functions,'parseVoiceCommand');
    const resp=await aiCall({
      transcript,
      familyId:S.familyId||'',
      peopleHints
    });
    const data=resp?.data||{};
    const intents=Array.isArray(data.intents)?data.intents:[];
    console.log('[voice-ai] intents:',intents,'confidence:',data.confidence);
    if(intents.length===0){
      throw new Error('AI returned no intents');
    }
    renderVoiceIntentConfirmation(intents,data.summary,transcript);
  }catch(e){
    console.warn('[voice-ai] failed, falling back to local parser:',e);
    // Fall back to old regex parser so user is never stuck
    if(titleEl)titleEl.textContent='Save it as…';
    if(hintEl)hintEl.innerHTML='<div style="font-size:11px;color:#FF9500;line-height:1.4">⚠️ AI unavailable — pick a destination:</div>';
    if(actionsEl){
      actionsEl.style.display='flex';
      actionsEl.style.gap='8px';
      actionsEl.style.marginTop='6px';
      actionsEl.innerHTML=`
        <button onclick='saveVoiceAsReminder(${JSON.stringify(transcript)})' style="flex:1;padding:13px;border-radius:12px;background:#AF52DE;border:none;color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit">⏰ Reminder</button>
        <button onclick='saveVoiceAsGroceryRaw(${JSON.stringify(transcript)})' style="flex:1;padding:13px;border-radius:12px;background:#34C759;border:none;color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit">🛒 Shopping</button>
        <button onclick="closeVoiceQuickAdd()" style="padding:13px;border-radius:12px;background:var(--bg);border:none;color:var(--text-secondary);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit">Cancel</button>`;
    }
  }
}

// Render a list of intents with per-intent Approve/Skip controls
function renderVoiceIntentConfirmation(intents,summary,transcript){
  const iconEl=document.getElementById('voice-state-icon');
  const titleEl=document.getElementById('voice-state-title');
  const hintEl=document.getElementById('voice-state-hint');
  const actionsEl=document.getElementById('voice-actions');
  // Stash intents on window so onclick handlers can grab by index
  window._voiceIntents=intents;

  if(iconEl)iconEl.textContent='🤖';
  if(titleEl)titleEl.textContent=intents.length===1?'Got it!':intents.length+' things to add';

  // Render each intent as a preview card
  const cards=intents.map((it,idx)=>{
    let icon='📌',title='Item',details='';
    if(it.type==='event'){
      icon='📅';title=it.title||'Event';
      const parts=[];
      if(it.freq&&it.freq!=='once')parts.push(it.freq+(Array.isArray(it.days)&&it.days.length?' on '+it.days.join(', '):''));
      if(it.date)parts.push(it.freq==='once'?new Date(it.date+'T12:00').toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'}):'from '+it.date);
      if(it.time)parts.push('⏰ '+it.time+(it.endTime?'–'+it.endTime:''));
      if(it.location)parts.push('📍 '+it.location);
      if(Array.isArray(it.participants)&&it.participants.length)parts.push('👥 '+it.participants.join(', '));
      details=parts.join(' · ');
    }else if(it.type==='reminder'){
      icon='⏰';title=it.text||'Reminder';
      const parts=[];
      if(it.date)parts.push(it.mode==='ongoing'?'by '+it.date:'on '+it.date);
      if(Array.isArray(it.forNames)&&it.forNames.length)parts.push('for '+it.forNames.join(', '));
      details=parts.join(' · ')||'(no date)';
    }else if(it.type==='grocery'){
      icon='🛒';title='Shopping list';
      const items=Array.isArray(it.items)?it.items:[];
      details=items.map(i=>i.label+(i.quantity>1?' ×'+i.quantity:'')).join(', ');
    }else if(it.type==='gift'){
      icon='🎁';title='Gift idea: '+(it.idea||'—');
      details='for '+(it.for||'?')+(it.occasion?' · '+it.occasion:'');
    }else if(it.type==='dinner'){
      icon='🍽️';title='Dinner: '+(it.meal||'—');
      details=it.date?new Date(it.date+'T12:00').toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'}):'';
    }
    return `<div style="background:var(--bg);border-radius:10px;padding:10px 12px;margin-bottom:6px;text-align:left;display:flex;align-items:flex-start;gap:10px">
      <div style="font-size:20px;line-height:1;flex-shrink:0">${icon}</div>
      <div style="flex:1;min-width:0">
        <div style="font-size:13px;font-weight:700;color:var(--text)">${title}</div>
        ${details?`<div style="font-size:11px;color:var(--text-secondary);margin-top:2px;line-height:1.4">${details}</div>`:''}
      </div>
    </div>`;
  }).join('');

  if(hintEl){
    hintEl.style.minHeight='auto';
    hintEl.innerHTML=cards+(summary?`<div style="font-size:10px;color:var(--text-secondary);font-style:italic;margin-top:6px">${summary}</div>`:'');
  }

  if(actionsEl){
    actionsEl.style.display='flex';
    actionsEl.style.gap='8px';
    actionsEl.style.marginTop='10px';
    actionsEl.innerHTML=`
      <button onclick="saveAllVoiceIntents()" style="flex:2;padding:13px;border-radius:12px;background:#34C759;border:none;color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit">✓ Save all</button>
      <button onclick="closeVoiceQuickAdd()" style="flex:1;padding:13px;border-radius:12px;background:var(--bg);border:none;color:var(--text-secondary);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit">Cancel</button>`;
  }
}

// Save all the AI-extracted intents — events go to events, reminders to reminders, etc.
window.saveAllVoiceIntents=async function(){
  const intents=window._voiceIntents||[];
  console.log('[voice-save] starting with',intents.length,'intents:',JSON.parse(JSON.stringify(intents)));
  if(!intents.length){closeVoiceQuickAdd();return;}
  if(!S.familyId){
    notify('No family loaded — cannot save','⚠️');
    console.error('[voice-save] S.familyId is empty');
    return;
  }
  let saved=0,failed=0;
  const results=[],errors=[];
  for(const it of intents){
    try{
      console.log('[voice-save] processing',it.type,it);
      if(it.type==='event'){
        const allPeople=[
          ...S.children.map(c=>({id:c.id,name:c.name,kind:'child'})),
          ...members().map(m=>({id:m.uid,name:m.name,kind:'adult'}))
        ];
        const participantIds=[];
        if(Array.isArray(it.participants)){
          it.participants.forEach(name=>{
            const norm=String(name).toLowerCase().trim();
            const match=allPeople.find(p=>p.name.split(' ')[0].toLowerCase()===norm||p.name.toLowerCase()===norm);
            if(match)participantIds.push(match.id);
          });
        }
        const evCat=it.category||'other';
        const catMeta=EV_CATEGORIES.find(c=>c.id===evCat)||{emoji:'📅'};
        const days={Mon:false,Tue:false,Wed:false,Thu:false,Fri:false,Sat:false,Sun:false};
        if(it.freq&&it.freq!=='once'&&Array.isArray(it.days)){
          it.days.forEach(d=>{if(days.hasOwnProperty(d))days[d]=true;});
        }
        const timeStr=it.time?(it.endTime?it.time+' – '+it.endTime:it.time):'';
        const ref=await fadd(['events'],{
          title:(it.title||'').trim(),
          emoji:catMeta.emoji||'📅',
          participantIds,childId:'',adultUid:'',
          freq:it.freq||'once',
          date:it.freq==='once'?(it.date||''):'',
          startDate:it.freq!=='once'?(it.date||''):'',
          endDate:it.endDate||'',
          days,
          time:timeStr,
          category:evCat,
          sport:it.sport||'',
          location:it.location||'',
          dropoff:'',pickup:'',
          packItems:[],
          notes:it.notes||''
        });
        console.log('[voice-save] event saved id=',ref?.id);
        saved++;results.push('📅 '+it.title);
      }else if(it.type==='reminder'){
        const allPeople=[
          ...S.children.map(c=>({id:c.id,name:c.name,kind:'child'})),
          ...members().map(m=>({id:m.uid,name:m.name,kind:'adult'}))
        ];
        const forKeys=[];
        let childId='',adultUid='';
        if(Array.isArray(it.forNames)){
          it.forNames.forEach(name=>{
            const norm=String(name).toLowerCase().trim();
            const match=allPeople.find(p=>p.name.split(' ')[0].toLowerCase()===norm||p.name.toLowerCase()===norm);
            if(match){
              forKeys.push(match.kind+':'+match.id);
              // Backwards-compat: also write the legacy single-target field
              if(match.kind==='adult'&&!adultUid)adultUid=match.id;
              if(match.kind==='child'&&!childId)childId=match.id;
            }
          });
        }
        // Normalise mode — Today filter only knows 'ondate' and 'ongoing'.
        // AI sometimes returns 'anytime'; treat that as 'ondate' so the reminder still shows up.
        let normalisedMode=it.mode||'ondate';
        if(normalisedMode!=='ondate'&&normalisedMode!=='ongoing')normalisedMode='ondate';
        const reminderDoc={
          text:(it.text||'').trim(),
          date:it.date||fd(new Date()),
          mode:normalisedMode,
          forKeys,
          childId,
          adultUid,
          notes:'',
          done:false,
          createdBy:S.user?.uid||''
        };
        const ref=await fadd(['reminders'],reminderDoc);
        console.log('[voice-save] reminder saved id=',ref?.id,'doc=',reminderDoc);
        saved++;results.push('⏰ '+it.text);
      }else if(it.type==='grocery'){
        const items=Array.isArray(it.items)?it.items:[];
        for(const i of items){
          const ref=await fadd(['groceries'],{
            label:(i.label||'').trim(),
            quantity:Math.max(1,parseInt(i.quantity)||1),
            isFrequent:false,
            checked:false,
            addedToList:true
          });
          console.log('[voice-save] grocery saved id=',ref?.id,'label=',i.label);
        }
        if(items.length){saved+=items.length;results.push('🛒 '+items.length+' item'+(items.length===1?'':'s'));}
      }else if(it.type==='gift'){
        // Gift schema fix: use `label` (not `idea`) and `price` (not `estimatedCost`)
        // to match what sGifts and sPersonProfile read.
        const allPeople=[
          ...S.children.map(c=>({id:c.id,name:c.name})),
          ...members().map(m=>({id:m.uid,name:m.name}))
        ];
        const norm=String(it.for||'').toLowerCase().trim();
        const match=allPeople.find(p=>p.name.split(' ')[0].toLowerCase()===norm||p.name.toLowerCase()===norm);
        if(match){
          const ref=await fadd(['gifts'],{
            recipientId:match.id,
            label:(it.idea||'').trim(),
            price:typeof it.estimatedCost==='number'?it.estimatedCost:null,
            occasion:it.occasion||'',
            isPrivate:false,
            createdBy:S.user?.uid||''
          });
          console.log('[voice-save] gift saved id=',ref?.id,'recipient=',match.name,'label=',it.idea);
          saved++;results.push('🎁 '+match.name.split(' ')[0]+': '+it.idea);
        }else{
          console.warn('[voice-save] gift recipient not matched:',it.for);
          failed++;errors.push('No match for "'+it.for+'"');
        }
      }else if(it.type==='dinner'){
        const dinnerDate=it.date||fd(new Date());
        // Replace existing dinner for same date — same behaviour as manual dinner save
        const existing=S.dinners.find(d=>d.date===dinnerDate);
        if(existing){
          try{await fdel(['dinners',existing.id]);}catch(e){console.warn('Failed to remove existing dinner',e);}
        }
        const ref=await fadd(['dinners'],{
          date:dinnerDate,
          meal:(it.meal||'').trim(),
          cook:it.cook||'',
          notes:''
        });
        console.log('[voice-save] dinner saved id=',ref?.id);
        saved++;results.push('🍽️ '+it.meal);
      }else{
        console.warn('[voice-save] unknown intent type:',it.type);
        failed++;errors.push('Unknown type: '+it.type);
      }
    }catch(ex){
      console.error('[voice-save] failed for intent',it,ex);
      failed++;
      errors.push((it.type||'?')+': '+(ex.message||ex));
    }
  }
  console.log('[voice-save] done. saved=',saved,'failed=',failed,'errors=',errors);
  closeVoiceQuickAdd();
  if(failed===0){
    notify('✅ '+results.join(' · '),'🤖');
  }else if(saved>0){
    notify('Saved '+saved+', '+failed+' failed: '+errors.join('; '),'⚠️');
  }else{
    notify('All failed: '+errors.join('; '),'❌');
  }
};


window.saveVoiceGrocery=async function(items){
  if(typeof items==='string'){try{items=JSON.parse(items);}catch(e){items=[items];}}
  if(!items||!items.length){closeVoiceQuickAdd();return;}
  if(!S.familyId){notify('No family loaded — open the app fully first','⚠️');return;}
  if(!S.user||!S.user.uid){notify('Not signed in','⚠️');return;}

  // Show "saving" feedback in the modal so user sees progress
  const titleEl=document.getElementById('voice-state-title');
  const hintEl=document.getElementById('voice-state-hint');
  const actionsEl=document.getElementById('voice-actions');
  if(titleEl)titleEl.textContent='Saving…';
  if(hintEl)hintEl.innerHTML='<div style="font-size:12px;color:var(--text-secondary)">Adding '+items.length+' item'+(items.length===1?'':'s')+' to shopping list…</div>';
  if(actionsEl)actionsEl.innerHTML='';

  let saved=0;
  const errors=[];
  for(const item of items){
    const trimmed=String(item).trim();
    if(!trimmed)continue;
    try{
      const label=trimmed.charAt(0).toUpperCase()+trimmed.slice(1);
      // EXACT same shape as hAddGrocery (which works) — addedToList:true is what makes it
      // appear on the shopping list (not just in the frequents bank).
      await fadd(['groceries'],{label,quantity:1,isFrequent:false,addedToList:true,checked:false});
      saved++;
    }catch(e){
      console.error('[voice-grocery] save failed for',item,e);
      errors.push((item||'?')+': '+(e.message||e.code||'unknown error'));
    }
  }

  if(saved>0&&errors.length===0){
    notify('Added '+saved+' item'+(saved===1?'':'s')+' to shopping list 🛒','✅');
    closeVoiceQuickAdd();
  }else if(saved>0&&errors.length>0){
    if(titleEl)titleEl.textContent='Saved '+saved+', '+errors.length+' failed';
    if(hintEl)hintEl.innerHTML='<div style="font-size:12px;color:#FF3B30;text-align:left;background:#FF3B3014;border-radius:8px;padding:8px;line-height:1.5">'+errors.join('<br>')+'</div>';
    if(actionsEl)actionsEl.innerHTML='<button onclick="closeVoiceQuickAdd()" style="flex:1;padding:13px;border-radius:12px;background:var(--bg);border:none;color:var(--text);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit">Close</button>';
  }else{
    // All failed
    if(titleEl)titleEl.textContent='Save failed';
    if(hintEl)hintEl.innerHTML='<div style="font-size:12px;color:#FF3B30;text-align:left;background:#FF3B3014;border-radius:8px;padding:8px;line-height:1.5">'+(errors.length?errors.join('<br>'):'Unknown error — check the console for details.')+'</div>';
    if(actionsEl)actionsEl.innerHTML='<button onclick="closeVoiceQuickAdd()" style="flex:1;padding:13px;border-radius:12px;background:var(--bg);border:none;color:var(--text);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit">Close</button>';
  }
};

// Save a gift idea from voice
window.saveVoiceGift=async function(recipientId,idea,isPrivate){
  if(!recipientId||!idea){closeVoiceQuickAdd();return;}
  if(!S.familyId){notify('No family loaded','⚠️');return;}
  try{
    const cleanIdea=idea.charAt(0).toUpperCase()+idea.slice(1);
    await fadd(['gifts'],{
      recipientId,
      label:cleanIdea,
      price:null,
      occasion:'birthday',
      isPrivate:!!isPrivate,
      createdBy:S.user?.uid||''
    });
    notify('Gift idea saved 🎁'+(isPrivate?' (private)':''),'✅');
  }catch(e){
    notify('Save failed: '+(e.message||e),'❌');
  }
  closeVoiceQuickAdd();
};

// Show private/open picker for ambiguous gift recipient choice
window.showGiftPrivacyPicker=function(){
  const pending=S._giftIdeaPending;
  if(!pending){closeVoiceQuickAdd();return;}
  const allPeople=[...S.children.map(c=>({id:c.id,name:c.name})),...members().map(m=>({id:m.uid,name:m.name}))];
  const recipient=allPeople.find(p=>p.id===pending.recipientId);
  if(!recipient){closeVoiceQuickAdd();return;}
  const iconEl=document.getElementById('voice-state-icon');
  const titleEl=document.getElementById('voice-state-title');
  const hintEl=document.getElementById('voice-state-hint');
  const actionsEl=document.getElementById('voice-actions');
  if(iconEl)iconEl.textContent='🎁';
  if(titleEl)titleEl.textContent='Private or open?';
  if(hintEl)hintEl.innerHTML='<div style="background:var(--bg);border-radius:8px;padding:8px 10px;color:var(--text);text-align:left">'+
    '<div style="font-size:13px"><strong>'+pending.idea+'</strong> for <strong>'+recipient.name+'</strong></div>'+
    '<div style="font-size:11px;color:var(--text-secondary);margin-top:4px">Private = only you see it. Open = '+recipient.name.split(' ')[0]+' can see it too.</div>'+
    '</div>';
  if(actionsEl){
    actionsEl.innerHTML=
      `<button onclick='saveVoiceGift(${JSON.stringify(pending.recipientId)},${JSON.stringify(pending.idea)},true)' style="flex:1;padding:13px;border-radius:12px;background:#FF9500;border:none;color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit">🔒 Private</button>`+
      `<button onclick='saveVoiceGift(${JSON.stringify(pending.recipientId)},${JSON.stringify(pending.idea)},false)' style="flex:1;padding:13px;border-radius:12px;background:#FF6B9D;border:none;color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit">👀 Open</button>`+
      '<button onclick="closeVoiceQuickAdd()" style="padding:13px;border-radius:12px;background:var(--bg);border:none;color:var(--text-secondary);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit">Cancel</button>';
  }
};

// "Coming soon" placeholder modal for the recurring-import buttons
window.openComingSoon=function(kind){
  const titles={
    spreadsheet:{emoji:'📄',title:'Spreadsheet template',desc:'Download a pre-formatted .xlsx template, fill in your recurring events, then upload it back here. Bulk-add an entire term in one go — much faster than entering one event at a time.'},
    fixtures:{emoji:'🏊',title:'Sport fixtures import',desc:'Paste a Revolutionise URL or upload a fixture PDF (e.g. an Ovens & Murray sports schedule). HomeBase parses the rows and creates the events for you.'}
  };
  const data=titles[kind]||{emoji:'✨',title:'Coming soon',desc:'This feature is on the way.'};

  const overlay=document.createElement('div');
  overlay.id='coming-soon-overlay';
  overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;animation:hbFadeIn 0.18s ease-out';
  if(!document.getElementById('hbPickerKeyframes')){
    const st=document.createElement('style');st.id='hbPickerKeyframes';
    st.textContent='@keyframes hbFadeIn{from{opacity:0}to{opacity:1}}@keyframes hbSlideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}';
    document.head.appendChild(st);
  }
  overlay.onclick=function(e){if(e.target===overlay){overlay.style.animation='hbFadeIn 0.15s reverse';setTimeout(()=>overlay.remove(),140);}};

  const card=document.createElement('div');
  card.style.cssText='background:var(--card);border-radius:18px;padding:24px;max-width:380px;width:100%;text-align:center;animation:hbSlideUp 0.24s cubic-bezier(.22,.61,.36,1);box-shadow:0 12px 48px rgba(0,0,0,0.25)';
  card.onclick=function(e){e.stopPropagation();};
  card.innerHTML=`
    <div style="font-size:44px;margin-bottom:8px">${data.emoji}</div>
    <div style="font-size:18px;font-weight:800;color:var(--text);margin-bottom:8px">${data.title}</div>
    <div style="font-size:13px;color:var(--text-secondary);line-height:1.55;margin-bottom:6px">${data.desc}</div>
    <div style="font-size:12px;color:var(--navy);font-weight:700;margin-bottom:18px;letter-spacing:0.3px">COMING NEXT UPDATE ✨</div>
    <button onclick="this.closest('#coming-soon-overlay').click()" style="width:100%;padding:12px;border-radius:12px;background:var(--navy);border:none;color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit">Got it</button>`;
  overlay.appendChild(card);
  document.body.appendChild(overlay);
};

// Diagnostic wrapper for inbox review — logs everything so we can debug
window.openInboxReview=function(){
  try{
    console.log('[openInboxReview] starting. S exists?',!!window.S,'pendingEmails:',(window.S&&window.S.pendingEmails)||'undefined');
    if(!window.S){console.error('[openInboxReview] S is undefined — app state broken');return;}
    window.S.screen='inboxReview';
    window.S.fabOpen=false;
    console.log('[openInboxReview] State set. Calling render…');
    if(typeof render==='function'){render();console.log('[openInboxReview] render() called successfully');}
    else{console.error('[openInboxReview] render is not a function:',typeof render);}
  }catch(e){
    console.error('[openInboxReview] EXCEPTION:',e);
    alert('Inbox open failed: '+(e.message||e)+'\n\nSee browser console for details.');
  }
};

// Load persisted settings
try{
  const loc=JSON.parse(localStorage.getItem('hb_location')||'null');
  if(loc){S.manualLat=loc.lat||'';S.manualLon=loc.lon||'';S.manualCity=loc.city||'';}
  const nt=localStorage.getItem('hb_notif_time');
  if(nt)S.notifTime=nt;
  // Hydrate notification toggles from localStorage so first paint matches the
  // user's saved settings even before Firestore round-trips.
  const nMorn=localStorage.getItem('hb_notifMorning');
  if(nMorn!==null)S.notifMorning=(nMorn==='true');
  const nEvs=localStorage.getItem('hb_notifEvents');
  if(nEvs!==null)S.notifEvents=(nEvs==='true');
  const nLead=parseInt(localStorage.getItem('hb_notifEventLead'),10);
  if(Number.isFinite(nLead)&&nLead>0)S.notifEventLead=nLead;
  const td=JSON.parse(localStorage.getItem('hb_terms')||'null');
  if(td)S.termDates=td;
  const nm=localStorage.getItem('hb_night_mode');
  if(nm==='1'){S.nightMode=true;document.documentElement.setAttribute('data-theme','dark');}
  if(localStorage.getItem('hb_hide_onboarding')==='1')S.hideOnboarding=true;
}catch(e){}

onAuthStateChanged(auth,async user=>{
  // Fade out the splash overlay once we know the auth state
  setTimeout(function(){
    var sp=document.getElementById('hb-splash');
    if(sp){sp.classList.add('fade');setTimeout(function(){sp.remove();},300);}
  },150);
  S.user=user;
  if(user){
    try{const ud=await getDoc(doc(db,'users',user.uid));if(ud.exists()){const d=ud.data();if(d.familyId){S.familyId=d.familyId;subscribe();}if(d.notifTime)S.notifTime=d.notifTime;if(typeof d.notifMorning==='boolean')S.notifMorning=d.notifMorning;if(typeof d.notifEvents==='boolean')S.notifEvents=d.notifEvents;if(typeof d.notifEventLead==='number')S.notifEventLead=d.notifEventLead;}}
    catch(ex){}
    // If the user is signed in, has no family, AND we have a pending invite from the URL — auto-join
    if(!S.familyId&&S.pendingInvite){
      try{
        notify('Joining family...','⏳');
        S.familyId=await joinFamily(S.pendingInvite);
        S.pendingInvite=null;
        subscribe();
        notify('🎉 You\'re in!','✅');
      }catch(ex){
        notify('Invite couldn\'t be applied: '+(ex.message||'unknown error'),'⚠️');
        // Leave S.pendingInvite set so the family-setup screen can offer it
      }
    }
    // Schedule daily notification + per-event reminders
    setTimeout(function(){scheduleDailyNotif();scheduleEventNotifs();},2000);
  }
  render();
});
