<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;background:#F2F2F7;display:flex;flex-direction:column}
#app{display:flex;flex-direction:column;width:100%;height:100%;overflow:hidden;position:relative}
.topbar{background:#1C3A6B;padding:12px 16px 10px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;padding-top:max(12px,env(safe-area-inset-top))}
.screen{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;background:#F2F2F7}
.scroll{overflow-y:auto;-ms-overflow-style:none;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{display:none}
.tabbar{background:rgba(249,249,249,0.96);backdrop-filter:blur(20px);border-top:0.5px solid rgba(0,0,0,0.15);display:flex;flex-shrink:0;padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 0 6px;border:none;background:transparent;cursor:pointer;gap:2px;font-family:inherit;font-size:9px;font-weight:600;color:#8E8E93;transition:color 0.15s;min-width:0}
.tab.active{color:#1C3A6B}
.card{background:#fff;border-radius:16px;margin:0 16px;box-shadow:0 1px 6px rgba(0,0,0,0.08);overflow:hidden}
.sh{padding:8px 16px 4px;font-size:12px;font-weight:700;color:#8E8E93;text-transform:uppercase;letter-spacing:0.6px}
.btn{border:none;cursor:pointer;font-family:inherit;background:none}
.back-btn{border:none;cursor:pointer;color:#1C3A6B;font-size:17px;font-family:inherit;display:flex;align-items:center;gap:4px;padding:0;background:none;font-weight:500}
.primary-btn{width:100%;padding:16px;border:none;border-radius:14px;background:#1C3A6B;color:#fff;font-size:17px;font-weight:600;cursor:pointer;font-family:inherit}
.primary-btn:active{opacity:0.85}
.secondary-btn{width:100%;padding:16px;border:none;border-radius:14px;background:#F2F2F7;color:#1C1C1E;font-size:17px;font-weight:600;cursor:pointer;font-family:inherit}
.green-btn{width:100%;padding:16px;border:none;border-radius:14px;background:#34C759;color:#fff;font-size:17px;font-weight:600;cursor:pointer;font-family:inherit}
.input{width:100%;padding:14px 16px;border:1.5px solid #E5E5EA;border-radius:12px;font-size:16px;font-family:inherit;outline:none;background:#fff;color:#1C1C1E}
.input:focus{border-color:#1C3A6B}
.err{color:#FF3B30;font-size:13px;text-align:center;min-height:16px;margin-top:2px}
.toggle{width:51px;height:31px;border-radius:16px;position:relative;cursor:pointer;transition:background 0.2s;flex-shrink:0;border:none;padding:0}
.tthumb{position:absolute;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,0.22);transition:left 0.2s}
.cb{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;border:2px solid #C7C7CC;transition:all 0.15s}
.cb.on{border:none}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.fab{position:absolute;bottom:16px;right:16px;z-index:10}
.fab-btn{width:56px;height:56px;border-radius:28px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:28px;color:#fff;transition:all 0.2s;font-family:inherit;box-shadow:0 4px 20px rgba(28,58,107,0.45)}
.fab-menu{position:absolute;bottom:66px;right:0;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.fab-item{display:flex;align-items:center;gap:10px;padding:11px 18px;background:#1C1C1E;border-radius:24px;border:none;cursor:pointer;box-shadow:0 4px 20px rgba(0,0,0,0.3);font-family:inherit;color:#fff;font-size:15px;font-weight:600;white-space:nowrap}
.notif{position:absolute;top:12px;left:12px;right:12px;z-index:999;background:rgba(28,28,30,0.94);border-radius:16px;padding:12px 14px;box-shadow:0 8px 32px rgba(0,0,0,0.4);cursor:pointer;animation:sdown 0.35s cubic-bezier(.2,.8,.4,1)}
.pill{display:flex;align-items:center;gap:7px;padding:7px 14px 7px 7px;border-radius:24px;border:2px solid #E5E5EA;cursor:pointer;background:none;font-family:inherit;white-space:nowrap;transition:all 0.15s}
.chev{display:inline-block;width:7px;height:7px;border-right:2px solid #C7C7CC;border-top:2px solid #C7C7CC;transform:rotate(45deg)}
.day-btn{width:40px;height:40px;border-radius:20px;border:2px solid #E5E5EA;background:#fff;font-size:13px;font-weight:600;color:#8E8E93;cursor:pointer;font-family:inherit;flex-shrink:0;transition:all 0.15s}
.day-btn.on{background:#1C3A6B;border-color:#1C3A6B;color:#fff}
.spinner{width:32px;height:32px;border:3px solid #E5E5EA;border-top-color:#1C3A6B;border-radius:50%;animation:spin 0.75s linear infinite}
.badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px}
.photo-upload{width:90px;height:90px;border-radius:45px;border:3px dashed #C7C7CC;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;margin:0 auto;background:#F2F2F7;overflow:hidden;position:relative}
@keyframes sdown{from{transform:translateY(-110%);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes packed{0%{transform:scale(0.95);opacity:0}60%{transform:scale(1.02)}100%{transform:scale(1);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.fadein{animation:fadein 0.2s ease}
</style>

<script type="module">

const fbapp=initializeApp({apiKey:"AIzaSyA2lrJJ0T_y_CBk8kOqRmwejCqHx6RVPXA",authDomain:"homebase-56151.firebaseapp.com",projectId:"homebase-56151",storageBucket:"homebase-56151.firebasestorage.app",messagingSenderId:"647157335008",appId:"1:647157335008:web:a15452fabd943bf5a8a185"});

const NAVY='#1C3A6B';

const todayStr=fd(today);
function fd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

// State
const S={user:null,familyId:null,family:null,children:[],packing:{},events:[],notes:[],assessments:[],groceries:[],gifts:[],tab:'today',stack:[],activeChild:null,morningMode:false,calWeekOffset:0,selectedDate:null,listSection:null,listFilter:'all',eventsSubTab:'events',fabOpen:false,notif:null,notifTimer:null,weather:null,toggles:{notifs:true,loc:false},unsubs:[],

const $=id=>document.getElementById(id);
function av(name,color,size,photoURL){
  size=size||36;
  if(photoURL){return '<div class="av" style="width:'+size+'px;height:'+size+'px;border:2px solid '+color+';flex-shrink:0;background:url(\''+photoURL+'\') center/cover no-repeat"></div>';}
  const bg=color+'22',fs=Math.round(size*0.38),ini=(name||'?').split(' ').map(function(w){return w[0];}).join('').toUpperCase().slice(0,2);
  return '<div class="av" style="width:'+size+'px;height:'+size+'px;background:'+bg+';border:2px solid '+color+';color:'+color+';font-size:'+fs+'px;flex-shrink:0">'+ini+'</div>';
}
function bk(color){color=color||NAVY;return '<svg width="10" height="17" viewBox="0 0 10 17"><polyline points="9,1 1,8.5 9,16" stroke="'+color+'" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';}
function chk(){return '<svg width="14" height="10" viewBox="0 0 14 10"><polyline points="1,5 5,9 13,1" stroke="white" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';}
function tog(val,fn){return '<button class="toggle" style="background:'+(val?'#34C759':'#E5E5EA')+'" onclick="'+fn+'"><div class="tthumb" style="left:'+(val?22:2)+'px"></div></button>';}
function chev(){return '<span class="chev"></span>';}
function getMemberList(){
  if(!S.family||!S.family.members)return[];
  return Object.entries(S.family.members).map(function(e){return {uid:e[0],name:e[1].name,role:e[1].role,color:e[1].color||NAVY};});
}

  icon=icon||'🏠';

async function fetchWeather(){
  if(!navigator.geolocation||S.weather)return;
  navigator.geolocation.getCurrentPosition(async function(pos){
    try{
      var r=await fetch('https://api.open-meteo.com/v1/forecast?latitude='+pos.coords.latitude+'&longitude='+pos.coords.longitude+'&current_weather=true&timezone=auto');
      var d=await r.json();
      var wc=d.current_weather&&d.current_weather.weathercode||0;
      var temp=Math.round(d.current_weather&&d.current_weather.temperature||20);
      var icons={0:'☀️',1:'🌤',2:'⛅',3:'☁️',45:'🌫',51:'🌦',61:'🌧',71:'❄️',80:'🌧',95:'⛈'};
      var descs={0:'Sunny',1:'Mostly sunny',2:'Partly cloudy',3:'Cloudy',45:'Foggy',51:'Drizzle',61:'Rainy',71:'Snowy',80:'Showers',95:'Thunderstorm'};
      S.weather={temp:temp,icon:icons[wc]||icons[Math.floor(wc/10)*10]||'🌤',desc:descs[wc]||descs[Math.floor(wc/10)*10]||'Clear'};
      render();
    }catch(e){}
  },function(){});
}

async function createFamily(name){
  var code='HB-'+Math.random().toString(36).substr(2,6).toUpperCase();
  var ref=await addDoc(collection(db,'families'),{name:name,inviteCode:code,createdBy:S.user.uid,createdAt:new Date(),members:{[S.user.uid]:{name:S.user.displayName,role:'Admin',color:NAVY}}});
  await setDoc(doc(db,'users',S.user.uid),{familyId:ref.id,name:S.user.displayName,role:'Admin'});
  return ref.id;
}
async function joinFamily(code){
  var q=query(collection(db,'families'),where('inviteCode','==',code.trim().toUpperCase()));
  var snap=await getDocs(q);
  if(snap.empty)throw new Error('Family not found');
  var fid=snap.docs[0].id;
  var color=COLORS[Math.floor(Math.random()*COLORS.length)];
  await updateDoc(doc(db,'families',fid),{['members.'+S.user.uid]:{name:S.user.displayName,role:'Member',color:color}});
  await setDoc(doc(db,'users',S.user.uid),{familyId:fid,name:S.user.displayName,role:'Member'});
  return fid;
}

function subscribe(){
  S.unsubs.forEach(function(u){u();});S.unsubs=[];
  S.unsubs.push(onSnapshot(doc(db,'families',S.familyId),function(snap){S.family=snap.data();render();}));
  S.unsubs.push(onSnapshot(collection(db,'families',S.familyId,'children'),function(snap){
    S.children=snap.docs.map(function(d){return Object.assign({id:d.id},d.data());});
    if(!S.activeChild&&S.children.length)S.activeChild=S.children[0].id;
    S.children.forEach(function(c){
      var u=onSnapshot(collection(db,'families',S.familyId,'children',c.id,'packing'),function(ps){
        S.packing[c.id]=ps.docs.map(function(d){return Object.assign({id:d.id},d.data());});render();
      });S.unsubs.push(u);
    });render();
  }));
  S.unsubs.push(onSnapshot(collection(db,'families',S.familyId,'events'),function(snap){S.events=snap.docs.map(function(d){return Object.assign({id:d.id},d.data());});render();}));
  S.unsubs.push(onSnapshot(collection(db,'families',S.familyId,'notes'),function(snap){S.notes=snap.docs.map(function(d){return Object.assign({id:d.id},d.data());});render();}));
  S.unsubs.push(onSnapshot(collection(db,'families',S.familyId,'assessments'),function(snap){S.assessments=snap.docs.map(function(d){return Object.assign({id:d.id},d.data());});render();}));
  S.unsubs.push(onSnapshot(collection(db,'families',S.familyId,'groceries'),function(snap){S.groceries=snap.docs.map(function(d){return Object.assign({id:d.id},d.data());});render();}));
  S.unsubs.push(onSnapshot(collection(db,'families',S.familyId,'gifts'),function(snap){S.gifts=snap.docs.map(function(d){return Object.assign({id:d.id},d.data());});render();}));
}

function renderToday(){

    +'<div style="font-size:72px;margin-bottom:16px">🏠</div>'

    +'<button class="primary-btn" style="max-width:300px" onclick="nav(\'addChild\')">Add Your First Child</button></div>';
  }
  var color=child.color||NAVY;
  var pk=S.packing[child.id]||[];
  var packed=pk.filter(function(p){return p.checked;}).length;
  var pct=pk.length?packed/pk.length:0;
  var todayEvs=S.events.filter(function(e){
    if(!e.date&&!e.startDate)return false;
    if(e.freq==='once')return e.date===todayStr;
    // recurring - check if today matches
    var start=new Date((e.startDate||e.date)+'T12:00');
    var end=e.endDate?new Date(e.endDate+'T12:00'):null;
    var now=new Date(todayStr+'T12:00');
    if(now<start)return false;
    if(end&&now>end)return false;
    var dayName=DAYSH[now.getDay()];
    if(!e.days||!e.days[dayName])return false;
    if(e.freq==='fortnightly'){
      var diffDays=Math.round((now-start)/(1000*60*60*24));
      var diffWeeks=Math.floor(diffDays/7);
      return diffWeeks%2===0;
    }
    return true;
  }).sort(function(a,b){return (a.time||'').localeCompare(b.time||'');});
  var childEvs=todayEvs.filter(function(e){return !e.childId||e.childId===child.id;});

// ── CALENDAR ───────────────────────────────────────────
function renderCalendar(){
  var wStart=new Date(today);
  wStart.setDate(today.getDate()-today.getDay()+1+S.calWeekOffset*7);
  var wDates=[];
  for(var i=0;i<7;i++){var d=new Date(wStart);d.setDate(wStart.getDate()+i);wDates.push(d);}
  var sel=S.selectedDate||todayStr;
  var dayEvs=S.events.filter(function(e){
    if(e.freq==='once'||!e.freq)return e.date===sel;
    var start=new Date((e.startDate||e.date)+'T12:00');
    var end=e.endDate?new Date(e.endDate+'T12:00'):null;
    var now=new Date(sel+'T12:00');
    if(now<start)return false;
    if(end&&now>end)return false;
    var dayName=DAYSH[now.getDay()];
    return e.days&&e.days[dayName];
  }).sort(function(a,b){return (a.time||'').localeCompare(b.time||'');});

  var h='<div style="background:#fff;padding:14px 16px 0;border-bottom:1px solid #F2F2F7;flex-shrink:0">';
  h+='<div style="font-size:26px;font-weight:800;letter-spacing:-0.5px;color:#1C1C1E;margin-bottom:12px">Calendar</div>';
  h+='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">';
  h+='<button class="btn" onclick="S.calWeekOffset--;render()" style="color:#1C3A6B;font-size:26px;padding:0 12px">‹</button>';
  h+='<div style="font-size:15px;font-weight:700;color:#1C1C1E">'+MONTHS[wStart.getMonth()]+' '+wStart.getFullYear()+'</div>';
  h+='<button class="btn" onclick="S.calWeekOffset++;render()" style="color:#1C3A6B;font-size:26px;padding:0 12px">›</button></div>';
  h+='<div style="display:flex;margin:0 -16px">';
  wDates.forEach(function(d){
    var ds=fd(d),isSel=ds===sel,isTod=ds===todayStr;
    var evs=S.events.filter(function(e){return e.date===ds||(e.freq!=='once'&&e.startDate<=ds);});
    h+='<button class="btn" onclick="S.selectedDate=\''+ds+'\';render()" style="flex:1;display:flex;flex-direction:column;align-items:center;padding:6px 2px 12px;border-bottom:'+(isSel?'3px solid #1C3A6B':'3px solid transparent')+'">';
    h+='<div style="font-size:10px;color:'+(isSel?'#1C3A6B':isTod?'#FF3B30':'#8E8E93')+';font-weight:500;margin-bottom:4px">'+DAYSH[d.getDay()]+'</div>';
    h+='<div style="width:32px;height:32px;border-radius:16px;background:'+(isSel?'#1C3A6B':'transparent')+';display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;color:'+(isSel?'#fff':isTod?'#FF3B30':'#1C1C1E')+'">'+d.getDate()+'</div>';
    h+='<div style="display:flex;gap:2px;margin-top:4px">';
    evs.slice(0,3).forEach(function(e){var ec=S.children.find(function(c){return c.id===e.childId;});h+='<div style="width:5px;height:5px;border-radius:3px;background:'+(ec&&ec.color||NAVY)+'"></div>';});
    h+='</div></button>';
  });
  h+='</div></div>';
  h+='<div class="scroll" style="flex:1;overflow-y:auto;padding:14px 0 80px">';
  if(!dayEvs.length){h+='<div style="text-align:center;padding:60px 20px"><div style="font-size:56px;margin-bottom:14px">🎉</div><div style="font-size:18px;font-weight:700;color:#1C1C1E;margin-bottom:6px">Nothing on!</div><div style="font-size:15px;color:#8E8E93">Tap + to add an event</div></div>';}
  else{
    h+='<div class="sh" style="margin-bottom:10px">'+new Date(sel+'T12:00').toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'long'})+'</div>';
    dayEvs.forEach(function(ev){
      var ec=S.children.find(function(c){return c.id===ev.childId;}),col=ec&&ec.color||NAVY;
      h+='<div style="width:calc(100% - 32px);margin:0 16px 10px;background:#fff;border-radius:16px;padding:14px 16px;box-shadow:0 1px 6px rgba(0,0,0,0.08)">';
      h+='<div style="display:flex;align-items:flex-start;gap:12px">';
      h+='<div style="font-size:30px;flex-shrink:0">'+(ev.emoji||'📅')+'</div>';
      h+='<div style="flex:1"><div style="font-size:16px;font-weight:700;color:#1C1C1E">'+ev.title+'</div>';
      if(ev.freq&&ev.freq!=='once')h+='<div style="font-size:12px;color:#1C3A6B;font-weight:600;text-transform:capitalize">🔄 '+ev.freq+'</div>';
      if(ev.time)h+='<div style="font-size:13px;color:#8E8E93">⏰ '+ev.time+'</div>';
      if(ev.location)h+='<div style="font-size:13px;color:#8E8E93">📍 '+ev.location+'</div>';
      if(ev.dropoff)h+='<div style="font-size:13px;color:#8E8E93">🚗 Drop-off: '+ev.dropoff+'</div>';
      if(ev.pickup)h+='<div style="font-size:13px;color:#1C3A6B;font-weight:600">🏠 Pick-up: '+ev.pickup+'</div>';
      if(ev.packItems&&ev.packItems.length)h+='<div style="font-size:12px;color:#8E8E93;margin-top:4px">🎒 '+ev.packItems.join(', ')+'</div>';
      if(ev.notes)h+='<div style="font-size:13px;color:#8E8E93;font-style:italic;margin-top:4px">'+ev.notes+'</div>';
      if(ec)h+='<div style="margin-top:6px;display:flex;align-items:center;gap:6px">'+av(ec.name,col,20,ec.photoURL)+'<span style="font-size:12px;color:'+col+';font-weight:600">'+ec.name+'</span></div>';
      h+='</div><button onclick="dEvent(\''+ev.id+'\')" style="background:none;border:none;cursor:pointer;color:#FF3B30;font-size:22px;padding:0;opacity:0.6">×</button></div></div>';
    });
  }
  h+='</div><div class="fab"><button class="fab-btn" style="background:#1C3A6B" onclick="nav(\'addEvent\')">+</button></div>';
  return h;
}

// ── MAIN RENDER ───────────────────────────────────────
function render(){
  var sc=$('screen'),tb=$('tabbar');
  if(!sc)return;
  var cur=S.stack[S.stack.length-1];
  var html='',showTabs=false;
  if(!S.user){
    tb.style.display='none';
    html=cur&&cur.screen==='signup'?renderSignup():renderLogin();
  } else if(!S.familyId){
    tb.style.display='none';html=renderFamilySetup();
  } else if(cur){
    tb.style.display='none';
    var m={addChild:renderAddChild,addPackItem:function(){return renderAddPackItem(cur.params);},addEvent:renderAddEvent,addNote:renderAddNote,addAssessment:renderAddAssessment,addGrocery:renderAddGrocery,addGift:function(){return renderAddGift(cur.params);},signup:renderSignup,childProfile:renderFamily,editChild:renderAddChild};
    html=(m[cur.screen]||renderToday)();
  } else {
    showTabs=true;tb.style.display='flex';
    var m2={today:renderToday,calendar:renderCalendar,events:renderEvents,lists:renderLists,family:renderFamily,settings:renderSettings};
    html=(m2[S.tab]||renderToday)();
  }
  sc.innerHTML=html;
  _notif();
  updateTopBar();
  // Set logo
  var logoEl=$('topbar-logo');
  if(logoEl)logoEl.innerHTML='<img id="hb-logo" style="height:34px;cursor:pointer" onclick="setTab(\'today\')" /><script>document.getElementById("hb-logo").src="data:image/png;base64,'+window._touchIcon+'";<\/script>';
  var loginLogoEl=$('login-logo');
  if(loginLogoEl)loginLogoEl.innerHTML='<img style="height:80px;border-radius:16px" src="data:image/png;base64,'+window._touchIcon+'"/>';
  if(showTabs){
    var TABS=[{id:'today',icon:'🏠',label:'Today'},{id:'calendar',icon:'📅',label:'Calendar'},{id:'events',icon:'📋',label:'Events'},{id:'lists',icon:'🛒',label:'Lists'},{id:'family',icon:'👨‍👩‍👧',label:'Family'},{id:'settings',icon:'⚙️',label:'Settings'}];
    tb.innerHTML=TABS.map(function(t){return '<button class="tab '+(S.tab===t.id?'active':'')+'" onclick="setTab(\''+t.id+'\')"><span style="font-size:20px">'+t.icon+'</span>'+t.label+'</button>';}).join('');
  }
  if(S.tab==='today'&&S.toggles.loc&&!S.weather)fetchWeather();
  // Re-render event pack items list
  var epList=$('ev-pack-list');
  if(epList){
    epList.innerHTML=S.evPackItems.map(function(item,i){return '<div style="display:flex;align-items:center;gap:8px;padding:8px 12px;background:#fff;border-radius:10px;border:1px solid #E5E5EA"><span style="flex:1;font-size:15px">'+item+'</span><button onclick="removeEvPackItem('+i+')" style="background:none;border:none;cursor:pointer;color:#FF3B30;font-size:18px">×</button></div>';}).join('');
  }
  // Show/hide other field
  var dropSel=$('edrop'),dropOther=$('edrop-other'),pickSel=$('epick'),pickOther=$('epick-other');
  if(dropSel&&dropOther)dropOther.style.display=dropSel.value==='other'?'block':'none';
  if(pickSel&&pickOther)pickOther.style.display=pickSel.value==='other'?'block':'none';
}

window.handlePhotoSelect=function(input){
  if(!input.files||!input.files[0])return;
  var file=input.files[0];
  var reader=new FileReader();
  reader.onload=function(e){
    var data=e.target.result;
    $('photo-data').value=data;
    var preview=$('photo-preview');

  reader.readAsDataURL(file);
};

window.hAddEvent=async function(){
  var t=$('et')&&$('et').value.trim(),err=$('everr');
  if(!t){if(err)err.textContent='Please enter a title';return;}
  var freq=S.evFreq||'once';
  if(freq==='once'){
    var d=$('edate')&&$('edate').value;
    if(!d){if(err)err.textContent='Please select a date';return;}
  } else {
    var hasDays=Object.values(S.evDays).some(function(v){return v;});
    if(!hasDays){if(err)err.textContent='Please select at least one day';return;}
  }
  var dropVal=$('edrop')&&$('edrop').value;
  var dropoff=dropVal==='other'?($('edrop-other')&&$('edrop-other').value.trim()||''):dropVal;
  var pickVal=$('epick')&&$('epick').value;
  var pickup=pickVal==='other'?($('epick-other')&&$('epick-other').value.trim()||''):pickVal;
  try{
    await saveEvent({
      title:t,emoji:$('eemoji')&&$('eemoji').value||'📅',
      childId:$('echild')&&$('echild').value||'',
      freq:freq,
      date:freq==='once'?($('edate')&&$('edate').value):'',
      startDate:freq!=='once'?($('estartdate')&&$('estartdate').value||fd(today)):'',
      endDate:freq!=='once'?($('eenddate')&&$('eenddate').value||''):'',
      days:freq!=='once'?Object.assign({},S.evDays):{},
      time:$('etime')&&$('etime').value.trim()||'',
      location:$('eloc')&&$('eloc').value.trim()||'',
      dropoff:dropoff,pickup:pickup,
      packItems:S.evPackItems.slice(),
      notes:$('enotes')&&$('enotes').value.trim()||''
    });
    // Add packing items to child's packing list
    var childId=$('echild')&&$('echild').value;
    if(childId&&S.evPackItems.length){
      for(var i=0;i<S.evPackItems.length;i++){
        try{await addPackItem(childId,S.evPackItems[i],'afterschool');}catch(pe){}
      }
    }
    S.evDays={Mon:false,Tue:false,Wed:false,Thu:false,Fri:false,Sat:false,Sun:false};
    S.evFreq='once';S.evPackItems=[];
    goBack();showNotif('Event saved! 📅');
  }catch(ex){if(err)err.textContent=ex.message;}
};
