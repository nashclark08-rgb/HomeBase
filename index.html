// Find every parseable date in a text and return positions + ISO date
function findAllDates(text){
  const results=[];
  const seen=new Set();
  // Patterns ordered most-specific to least
  const patterns=[
    /\b(\d{4}-\d{1,2}-\d{1,2})\b/g,                                      // ISO 2026-05-10
    /\b(\d{1,2}[\/\-\.]\d{1,2}[\/\-\.]\d{2,4})\b/g,                       // 10/05/2026
    /\b(?:mon|tue|wed|thu|fri|sat|sun)[a-z]*\.?\s+\d{1,2}(?:st|nd|rd|th)?\s+(?:jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?(?:\s+\d{2,4})?/gi,  // "Sat 10 May 2026"
    /\b\d{1,2}(?:st|nd|rd|th)?\s+(?:jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?(?:\s+\d{2,4})?\b/gi,                                          // "10 May 2026"
    /\b(?:jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+\d{1,2}(?:st|nd|rd|th)?(?:,?\s+\d{2,4})?/gi                                            // "May 10, 2026"
  ];
  for(const pat of patterns){
    let m;
    while((m=pat.exec(text))!==null){
      const matched=m[0];
      const d=parseLooseDate(matched);
      if(d){
        // Dedupe by position (don't double-count overlapping matches)
        const key=m.index+'|'+d;
        if(!seen.has(key)){
          seen.add(key);
          results.push({match:matched,index:m.index,date:d});
        }
      }
    }
  }
  results.sort((a,b)=>a.index-b.index);
  // Suppress matches that overlap or sit within ~5 chars of an earlier one (same date written two ways)
  const filtered=[];
  for(const r of results){
    const last=filtered[filtered.length-1];
    if(last&&r.date===last.date&&r.index<last.index+last.match.length+5)continue;
    filtered.push(r);
  }
  return filtered;
}

// Find the sentence/line containing a position in the text
function getContextAround(text,index,radius){
  radius=radius||220;
  const start=Math.max(0,index-radius);
  const end=Math.min(text.length,index+radius);
  // Try to extend to natural sentence boundaries
  let s=start;
  while(s>0&&!/[\n\.\!\?]/.test(text[s-1]))s--;
  let e=end;
  while(e<text.length&&!/[\n\.\!\?]/.test(text[e]))e++;
  return text.slice(s,Math.min(e+1,text.length)).trim();
}

// Find the line containing a position in text
function getLineContaining(text,index){
  let start=index;
  while(start>0&&text[start-1]!=='\n')start--;
  let end=index;
  while(end<text.length&&text[end]!=='\n')end++;
  return {text:text.slice(start,end).trim(),start,end};
}

// Find the previous non-empty line above a given position (for heading lookups)
function getPreviousNonEmptyLine(text,beforeIndex){
  let i=beforeIndex-1;
  // Skip newlines
  while(i>0&&text[i]==='\n')i--;
  if(i<=0)return '';
  let lineEnd=i;
  let lineStart=i;
  while(lineStart>0&&text[lineStart-1]!=='\n')lineStart--;
  return text.slice(lineStart,lineEnd+1).trim();
}

// Strip common email noise — signatures, disclaimers — to reduce false positives
// Takes the full text and the date index so we can look BEFORE the date for sig markers
function isLikelyNoiseContext(fullText,dateIndex,context){
  // Lookback: the 250 chars before the date. If a signature marker sits in there,
  // this date is probably in the signature itself (not a real event).
  const lookback=fullText.slice(Math.max(0,dateIndex-250),dateIndex).toLowerCase();
  if(/\b(?:kind regards|best regards|sincerely|yours faithfully|warm regards|yours truly|cheers)[\s\,]/.test(lookback))return true;
  if(/\b(?:principal|deputy principal|head of school|head of (?:senior|junior|primary))\s*\n/i.test(lookback))return true;
  // Footer/disclaimer markers
  if(/this email (?:and any attachments|is intended|contains|may contain)/i.test(context))return true;
  if(/unsubscribe|privacy policy|do not reply|noreply|no\-reply/i.test(context.toLowerCase()))return true;
  // Email opening dates ("Sent: 15 May 2026")
  if(/^(?:sent|date)[\:\s]+/i.test(context.trim()))return true;
  return false;
}

// Extract a clean title from the LINE containing the date.
// Strategy: strip date/time/time-range/location, clean up scaffolding, that's the title.
// We deliberately AVOID over-aggressive sentence trimming — the user can edit in preview.
function extractTitleFromContext(lineText,dateMatch,timeStr,locationStr){
  // Cut at the first sentence-ending period EARLY so we don't process the next sentence
  // (handles cases where multiple sentences live on one line)
  let cleaned=lineText;
  // Find first period that's followed by a space + capital letter (true sentence boundary, not abbreviation)
  const sentenceCut=cleaned.match(/\.\s+[A-Z]/);
  if(sentenceCut)cleaned=cleaned.slice(0,sentenceCut.index+1);
  // Now process the (single sentence) cleaned line
  cleaned=cleaned.replace(dateMatch,' ');
  // Strip time RANGES first (before stripping the single time, which would break the range)
  cleaned=cleaned.replace(/\bfrom\s+\d{1,2}(?::\d{2})?\s*(?:am|pm)?\s*(?:[\-\–\—]|to|until|till)\s*\d{1,2}(?::\d{2})?\s*(?:am|pm)?/gi,' ');
  cleaned=cleaned.replace(/\b\d{1,2}(?::\d{2})?\s*(?:am|pm)\s*(?:[\-\–\—]|to|until|till)\s*\d{1,2}(?::\d{2})?\s*(?:am|pm)/gi,' ');
  if(timeStr)cleaned=cleaned.replace(timeStr,' ');
  cleaned=cleaned.replace(/\b\d{1,2}(?::\d{2})?\s*(?:am|pm)\b/gi,' ');
  // Remove the detected location
  if(locationStr&&locationStr.length>2){
    const escaped=locationStr.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    cleaned=cleaned.replace(new RegExp('(?:^|\\s)(?:at|@|in)\\s+(?:the\\s+)?'+escaped+'\\b','gi'),' ');
    cleaned=cleaned.replace(new RegExp('(?:^|\\s)(?:the\\s+)?'+escaped+'\\b','gi'),' ');
  }
  // Strip leading scaffolding
  cleaned=cleaned.replace(/^[\-\*\u2022\u00b7•#\d\.\s,:]+/,'').trim();
  cleaned=cleaned.replace(/^(?:reminder[:\s]*|note[:\s]*|fyi[:\s]*|please note that\s+|please be advised that\s+|just a (?:quick )?(?:reminder|note)(?:\s+that)?\s*)/gi,' ').trim();
  cleaned=cleaned.replace(/^\s*that\s+(?:the\s+)?/i,' ').trim();
  // Specific common scaffolding that survives
  cleaned=cleaned.replace(/\b(?:will be held|will take place|takes place|is being held|is on|is at|is in|will run|will be on|will be at|will commence|will start|will end)\b/gi,' ');
  // Iteratively strip dangling prepositions + connector words (loop a few times for chains)
  for(let i=0;i<5;i++){
    const before=cleaned;
    cleaned=cleaned.replace(/\s+(?:on|at|from|by|until|in|to|of|for|the|departing|departs|leaving|happening)\s*(?:[,\.;]|$)/gi,' ');
    cleaned=cleaned.replace(/\s+\.+/g,'.').replace(/^\s*\.+\s*/,'').replace(/\s+/g,' ').trim();
    if(cleaned===before)break;
  }
  // Cut at remaining period
  cleaned=cleaned.split(/[\.\;]/)[0].trim();
  // Strip leading "The "
  cleaned=cleaned.replace(/^the\s+/i,'');
  // Trim trailing junk
  cleaned=cleaned.replace(/[\,\—\–\-]\s*$/,'').replace(/\s+(?:and|or|with|for|to|at|on|in|is|are|will|of|the)\s*$/i,'').trim();
  // Capitalise first letter
  if(cleaned&&cleaned[0]&&cleaned[0]===cleaned[0].toLowerCase()){
    cleaned=cleaned.charAt(0).toUpperCase()+cleaned.slice(1);
  }
  if(cleaned.length>80)cleaned=cleaned.slice(0,77)+'…';
  return cleaned;
}

// Extract location from "at X" or "in (the) X" patterns within the line.
// Prefers locations that contain venue keywords or are clearly venue-shaped names.
function extractLocationFromContext(lineText){
  const VENUE_KEYWORDS=/(?:hall|pool|court|field|oval|park|centre|center|stadium|gym|complex|arena|grounds?|club|library|theatre|theater|chapel|auditorium|room|building|showgrounds?|aquatics|sports\s+ground|pavillion)/i;
  // "at School Hall" / "@ Pool" / "at the school oval"
  const m=lineText.match(/(?:^|\s)(?:at|@)\s+((?:the\s+)?[\w'\-][\w'\-\s,]{1,60}?)(?:[\.\,\;]|\s+(?:on|from|until|with|please|will|is|—|–|-)\b|$)/);
  if(m){
    let loc=m[1].trim().replace(/[\s,]+$/,'').replace(/^the\s+/i,'');
    if(/^\d/.test(loc)||/(?:am|pm)$/i.test(loc))return '';
    // Must contain a venue keyword OR be clearly a proper noun (multi-capitalized words)
    if(VENUE_KEYWORDS.test(loc)||/^[A-Z][\w\-]+(\s+[A-Z][\w\-]+){0,4}$/.test(loc))return loc;
    // Very short single-word lowercase locations are usually false positives ("PE uniform")
  }
  // "in the Hall" / "in Room 5" / "in the gym"
  const m2=lineText.match(/(?:^|\s)in\s+((?:the\s+)?[\w'\-][\w'\-\s,]{1,60}?)(?:[\.\,\;]|\s+(?:on|from|until|with|please|will|is|—|–|-)\b|$)/);
  if(m2){
    let loc=m2[1].trim().replace(/[\s,]+$/,'').replace(/^the\s+/i,'');
    if(/^\d/.test(loc)||/(?:am|pm)$/i.test(loc))return '';
    if(VENUE_KEYWORDS.test(loc)||/^[A-Z][\w\-]+(\s+[A-Z][\w\-]+){0,4}$/.test(loc))return loc;
  }
  return '';
}

// Main parser
function parseEventsFromEmail(text){
  if(!text||text.trim().length<10)return [];
  const norm=text.replace(/\r\n?/g,'\n').replace(/[ \t]+/g,' ');
  // Build a line-index for adjacent-line lookups
  const allLines=norm.split('\n');
  const lineStartIdx=[];
  let cumLen=0;
  for(const ln of allLines){
    lineStartIdx.push(cumLen);
    cumLen+=ln.length+1; // +1 for newline
  }
  function lineNumberAt(charIdx){
    // Find which line contains charIdx
    for(let i=lineStartIdx.length-1;i>=0;i--){
      if(charIdx>=lineStartIdx[i])return i;
    }
    return 0;
  }
  function getLineText(lineNum){
    return (lineNum>=0&&lineNum<allLines.length)?allLines[lineNum]:'';
  }

  const dates=findAllDates(norm);
  if(dates.length===0)return [];
  const events=[];
  const seenKeys=new Set();
  for(const d of dates){
    // Get JUST THE LINE containing the date — keeps each event tight
    const line=getLineContaining(norm,d.index);
    const lineText=line.text;
    if(isLikelyNoiseContext(norm,d.index,lineText))continue;

    // Look at current + ONE next line (not two — too greedy) for time/location
    // Only consult next line if current line has no time AND no location
    const lineNum=lineNumberAt(d.index);
    const sameLineTime=parseLooseTime(lineText);
    const sameLineLocation=extractLocationFromContext(lineText);
    let timeStr=sameLineTime;
    let location=sameLineLocation;
    if(!timeStr||!location){
      const nextLine=getLineText(lineNum+1);
      // Skip the next line if it looks like a different event (starts with a date or bullet)
      const nextLineStartsEvent=nextLine&&(/^\s*(?:[\-\*\u2022•]|[A-Z][a-zA-Z\s]+:|\d{1,2}[\/\-\.])/.test(nextLine)||findAllDates(nextLine).length>0);
      if(nextLine&&!nextLineStartsEvent){
        if(!timeStr)timeStr=parseLooseTime(nextLine);
        if(!location)location=extractLocationFromContext(nextLine);
      }
    }

    // Title: try the line containing the date first
    let title=extractTitleFromContext(lineText,d.match,timeStr,location);
    // If title is too short/empty, look at the previous non-empty line for a heading
    if(!title||title.length<4){
      const prevLine=getPreviousNonEmptyLine(norm,line.start);
      if(prevLine&&prevLine.length<90&&prevLine.length>3&&!prevLine.endsWith('.')){
        title=prevLine.replace(/^(?:reminder[:\s]*|note[:\s]*|fyi[:\s]*)/i,'').trim();
        title=title.replace(/[\:\,\—\–\-]\s*$/,'').trim();
      }
    }
    if(!title||title.length<3)continue;
    // FALLBACK LOCATION EXTRACTION: if no location yet, look for a trailing "venue-like" token
    // in a comma-separated list (handles "X: date, time, school hall" format)
    if(!location){
      const VENUE_KW=/(hall|pool|court|field|oval|park|centre|center|stadium|gym|complex|arena|grounds?|club|library|theatre|theater|chapel|auditorium|building|showgrounds?|aquatics)/i;
      // Look at trailing comma-separated parts of the title
      const parts=title.split(/\s*,\s*/);
      for(let i=parts.length-1;i>=0;i--){
        if(VENUE_KW.test(parts[i])){
          location=parts[i].trim();
          // Remove that part from title
          parts.splice(i,1);
          title=parts.join(', ').trim();
          break;
        }
      }
    }
    // Final cleanup of title — strip leading/trailing colons, commas, dashes, and double-commas
    title=title.replace(/^[\,\s\:\-]+/,'').replace(/[\,\s\:]+$/,'').replace(/,\s*,/g,',').replace(/\s+/g,' ').trim();
    if(!title||title.length<3)continue;

    const notes=lineText.slice(0,400);
    const key=d.date+'|'+title.toLowerCase();
    if(seenKeys.has(key))continue;
    seenKeys.add(key);
    events.push({
      id:Math.random().toString(36).slice(2,9),
      title,date:d.date,time:timeStr,location,notes,
      raw:lineText.slice(0,160)
    });
  }
  return events;
}

// Use Claude API (via cloud function) to parse emails. Much smarter than regex.
window.parseEmailWithAI=async function(){
  console.log('[ai-parse] === START ===');
  const ei=S.emailImport;
  if(!ei){console.error('[ai-parse] No emailImport state');return;}
  const ta=document.getElementById('ei-content');
  if(ta)ei.content=ta.value;
  if(!ei.content||ei.content.trim().length<10){
    notify('Paste an email first','⚠️');
    return;
  }
  if(typeof httpsCallable==='undefined'||!functions){
    notify('Cloud functions not loaded — refresh the app','❌');
    return;
  }
  console.log('[ai-parse] Email length:',ei.content.length,'familyId:',S.familyId,'user:',S.user?.uid);

  // Show full-screen "AI is reading…" overlay so user sees feedback
  const overlay=document.createElement('div');
  overlay.id='ai-parse-overlay';
  overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px';
  overlay.innerHTML='<div style="background:var(--card);border-radius:20px;padding:32px 28px;width:100%;max-width:340px;text-align:center;box-shadow:0 12px 48px rgba(0,0,0,0.3)">'
    +'<div style="font-size:60px;margin-bottom:8px">🤖</div>'
    +'<div style="font-size:18px;font-weight:800;color:var(--text);margin-bottom:6px">AI is reading…</div>'
    +'<div style="font-size:13px;color:var(--text-secondary);margin-bottom:16px;line-height:1.5">Extracting events from your email — this usually takes 3-8 seconds</div>'
    +'<div style="width:32px;height:32px;border:3px solid #AF52DE;border-top-color:transparent;border-radius:16px;animation:spin 0.8s linear infinite;margin:0 auto"></div>'
    +'</div>';
  document.body.appendChild(overlay);

  try{
    console.log('[ai-parse] Calling cloud function…');
    const callable=httpsCallable(functions,'parseEmailWithAI');
    const resp=await callable({
      emailText:ei.content,
      familyId:S.familyId||'',
      contextHint:'Default category preference is '+(ei.defaultCategory||'school')+'.'
    });
    console.log('[ai-parse] Cloud function returned:',resp);
    const data=resp?.data||{};
    const aiEvents=Array.isArray(data.events)?data.events:[];
    console.log('[ai-parse] Got',aiEvents.length,'events from AI');
    overlay.remove();

    if(aiEvents.length===0){
      notify('AI didn\'t find any events. Try the basic parser, or check the email content.','⚠️');
      return;
    }

    // Map AI events into our preview format. AI provides per-event category, so we
    // honor that (don't force the default).
    const events=aiEvents.map(ev=>({
      id:Math.random().toString(36).slice(2,9),
      title:ev.title||'',
      date:ev.date||'',
      endDate:ev.endDate||'',
      time:ev.time||'',
      endTime:ev.endTime||'',
      location:ev.location||'',
      notes:ev.notes||'',
      category:ev.category||ei.defaultCategory||'school',
      raw:'AI: '+(ev.title||'').slice(0,80)
    }));

    // Dedupe check — flag events that already exist in the family's events collection.
    // Match on normalised title + same date (or overlapping date range for multi-day).
    const norm=s=>String(s||'').toLowerCase().replace(/\s+/g,' ').trim();
    const existingEvents=Array.isArray(S.events)?S.events:[];
    events.forEach(ev=>{
      const nTitle=norm(ev.title);
      const nDate=ev.date;
      const dup=existingEvents.find(existing=>{
        if(!existing.title||!existing.date)return false;
        const sameTitle=norm(existing.title)===nTitle;
        if(!sameTitle)return false;
        // Same date OR overlapping multi-day range
        if(existing.date===nDate)return true;
        // Multi-day overlap check
        const evStart=ev.date;
        const evEnd=ev.endDate||ev.date;
        const exStart=existing.date;
        const exEnd=existing.endDate||existing.date;
        return !(evEnd<exStart||evStart>exEnd);
      });
      if(dup){
        ev._duplicate=true;
        ev._duplicateOf=dup.id;
        ev._removed=true; // skip duplicates by default — user can undo
      }
    });

    S.emailPreview={
      events,
      sourceCategory:ei.defaultCategory,
      participantIds:[...ei.participantIds],
      source:'ai',
      usage:data.usage
    };
    console.log('[ai-parse] Set emailPreview:',S.emailPreview);
    notify('AI found '+aiEvents.length+' event'+(aiEvents.length===1?'':'s')+' — opening preview…','🤖');
    console.log('[ai-parse] Calling go(emailPreview)…');
    go('emailPreview');
    console.log('[ai-parse] go() returned. S.screen=',S.screen);
    // Verify the screen actually rendered — if not, force again
    setTimeout(function(){
      if(S.screen!=='emailPreview'){
        console.error('[ai-parse] Screen failed to navigate! Current screen:',S.screen,'Forcing re-render…');
        S.screen='emailPreview';
        render();
      }
    },200);
  }catch(ex){
    overlay.remove();
    const detail=ex?.message||ex?.code||String(ex);
    console.error('[ai-parse] FAILED:',ex);
    notify('AI parse failed: '+detail,'❌');
  }
};

window.updateEmailEvent=function(id,field,value){
  const data=S.emailPreview;
  if(!data)return;
  const ev=data.events.find(x=>x.id===id);
  if(!ev)return;
  ev[field]=value;
  if(field==='date'||field==='title')render();
};
window.removeEmailEvent=function(id){
  const data=S.emailPreview;
  if(!data)return;
  const ev=data.events.find(x=>x.id===id);
  if(ev){ev._removed=true;render();}
};
window.restoreEmailEvent=function(id){
  const data=S.emailPreview;
  if(!data)return;
  const ev=data.events.find(x=>x.id===id);
  if(ev){ev._removed=false;render();}
};

window.commitEmailImport=async function(){
  const data=S.emailPreview;
  if(!data){notify('Nothing to import','⚠️');return;}
  if(!S.familyId){notify('No family loaded','⚠️');return;}
  const valid=data.events.filter(e=>e.title&&e.date&&!e._removed);
  if(valid.length===0){notify('No valid events to import','⚠️');return;}

  const btn=document.getElementById('commit-email-btn');
  if(btn){btn.disabled=true;btn.textContent='Importing…';}

  // Build legacy fields from selected participants
  let childId='',adultUid='';
  if(data.participantIds.length===1){
    const c=S.children.find(x=>x.id===data.participantIds[0]);
    const m=members().find(x=>x.uid===data.participantIds[0]);
    if(c)childId=data.participantIds[0];
    else if(m)adultUid=data.participantIds[0];
  }

  let success=0;let failed=0;
  for(const ev of valid){
    // Determine category: per-event (from AI) preferred over default
    const eventCat=ev.category||data.sourceCategory||'school';
    const catMeta=EV_CATEGORIES.find(c=>c.id===eventCat)||{emoji:'📅'};
    const eventEmoji=catMeta.emoji||'📅';
    // Combine time + endTime into a range string if both provided
    const timeStr=ev.endTime?(ev.time||'')+' – '+ev.endTime:(ev.time||'');
    try{
      await fadd(['events'],{
        title:(ev.title||'').trim(),
        emoji:eventEmoji,
        participantIds:[...data.participantIds],childId,adultUid,
        freq:'once',
        date:ev.date,
        endDate:ev.endDate||'',
        startDate:'',
        days:{Mon:false,Tue:false,Wed:false,Thu:false,Fri:false,Sat:false,Sun:false},
        time:timeStr,
        category:eventCat,
        sport:'',
        location:ev.location||'',
        dropoff:'',pickup:'',
        packItems:[],
        notes:ev.notes||''
      });
      success++;
    }catch(e){failed++;console.warn('Email event import failed',ev,e);}
  }

  S.emailPreview=null;
  S.emailImport=null;
  if(failed===0){notify('Imported '+success+' event'+(success===1?'':'s')+' ✅','📅');}
  else{notify('Imported '+success+' / failed '+failed,'⚠️');}
  S.screen=null;S.tab='events';S.evView='tiles';render();
};

// Approve a single event in a pending bundle — saves to events, removes from bundle
window.approvePendingEvent=async function(bundleId,eventIdx){
  if(!S.familyId)return;
  const bundle=(S.pendingEmails||[]).find(p=>p.id===bundleId);
  if(!bundle||!Array.isArray(bundle.events))return;
  const ev=bundle.events[eventIdx];
  if(!ev)return;
  try{
    const evCat=ev.category||'school';
    const catMeta=EV_CATEGORIES.find(c=>c.id===evCat)||{emoji:'📅'};
    const timeStr=ev.endTime?(ev.time||'')+' – '+ev.endTime:(ev.time||'');
    await fadd(['events'],{
      title:(ev.title||'').trim(),
      emoji:catMeta.emoji||'📅',
      participantIds:[],childId:'',adultUid:'',
      freq:'once',
      date:ev.date,endDate:ev.endDate||'',startDate:'',
      days:{Mon:false,Tue:false,Wed:false,Thu:false,Fri:false,Sat:false,Sun:false},
      time:timeStr,
      category:evCat,
      sport:'',
      location:ev.location||'',
      dropoff:'',pickup:'',
      packItems:[],
      notes:ev.notes||''
    });
    // Remove this event from the bundle
    const remaining=bundle.events.filter((_,i)=>i!==eventIdx);
    if(remaining.length===0){
      // Last event in bundle — mark whole bundle reviewed
      await updateDoc(doc(db,'families',S.familyId,'pending_events',bundleId),{
        status:'reviewed',events:[],reviewedAt:new Date()
      });
    }else{
      await updateDoc(doc(db,'families',S.familyId,'pending_events',bundleId),{events:remaining});
    }
    notify('Event approved 📅','✅');
  }catch(e){
    console.error('Approve failed:',e);
    notify('Failed: '+(e.message||e),'❌');
  }
};

// Dismiss a single pending event
window.dismissPendingEvent=async function(bundleId,eventIdx){
  if(!S.familyId)return;
  const bundle=(S.pendingEmails||[]).find(p=>p.id===bundleId);
  if(!bundle||!Array.isArray(bundle.events))return;
  try{
    const remaining=bundle.events.filter((_,i)=>i!==eventIdx);
    if(remaining.length===0){
      await updateDoc(doc(db,'families',S.familyId,'pending_events',bundleId),{
        status:'dismissed',events:[],dismissedAt:new Date()
      });
    }else{
      await updateDoc(doc(db,'families',S.familyId,'pending_events',bundleId),{events:remaining});
    }
    notify('Event dismissed','🗑️');
  }catch(e){notify('Failed: '+(e.message||e),'❌');}
};

// Approve every event in a bundle
window.approveAllInBundle=async function(bundleId){
  if(!S.familyId)return;
  const bundle=(S.pendingEmails||[]).find(p=>p.id===bundleId);
  if(!bundle||!Array.isArray(bundle.events))return;
  let success=0,failed=0;
  for(const ev of bundle.events){
    try{
      const evCat=ev.category||'school';
      const catMeta=EV_CATEGORIES.find(c=>c.id===evCat)||{emoji:'📅'};
      const timeStr=ev.endTime?(ev.time||'')+' – '+ev.endTime:(ev.time||'');
      await fadd(['events'],{
        title:(ev.title||'').trim(),
        emoji:catMeta.emoji||'📅',
        participantIds:[],childId:'',adultUid:'',
        freq:'once',
        date:ev.date,endDate:ev.endDate||'',startDate:'',
        days:{Mon:false,Tue:false,Wed:false,Thu:false,Fri:false,Sat:false,Sun:false},
        time:timeStr,category:evCat,sport:'',
        location:ev.location||'',
        dropoff:'',pickup:'',packItems:[],
        notes:ev.notes||''
      });
      success++;
    }catch(e){failed++;}
  }
  try{
    await updateDoc(doc(db,'families',S.familyId,'pending_events',bundleId),{
      status:'reviewed',events:[],reviewedAt:new Date()
    });
  }catch(e){}
  if(failed===0)notify('Approved '+success+' event'+(success===1?'':'s')+' 📅','✅');
  else notify('Approved '+success+', '+failed+' failed','⚠️');
};

// Copy the inbound address to clipboard
window.copyInboundAddress=function(addr){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(addr).then(
      ()=>notify('Address copied 📋','✅'),
      ()=>notify('Copy failed — long-press to copy manually','⚠️')
    );
  }else{
    // Fallback for older browsers
    const ta=document.createElement('textarea');
    ta.value=addr;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');notify('Address copied 📋','✅');}
    catch(e){notify('Copy failed — long-press to copy','⚠️');}
    finally{document.body.removeChild(ta);}
  }
};

// Generic category-filtered events view (used for Work)
// Comparator: sorts events chronologically by NEXT occurrence (closest date first).
// One-off events use ev.date. Recurring events compute their next occurrence from today.
// Events with no resolvable date sort last.
function eventChronoCmp(a,b){
  const tNow=Date.now();
  const next=(ev)=>{
    if(!ev.freq||ev.freq==='once'){
      if(!ev.date)return Infinity;
      const t=new Date(ev.date+'T'+(ev.time?'00':'12')+':00:00').getTime();
      return t;
    }
    // For recurring: find the next occurrence today/onward, falling back to start date
    if(!ev.days)return ev.startDate?new Date(ev.startDate+'T12:00').getTime():Infinity;
    const start=ev.startDate?new Date(ev.startDate+'T00:00').getTime():tNow;
    const end=ev.endDate?new Date(ev.endDate+'T23:59').getTime():Infinity;
    if(tNow>end)return Infinity; // already finished
    const baseT=Math.max(tNow,start);
    // Walk forward up to 14 days to find the next active day
    for(let i=0;i<14;i++){
      const d=new Date(baseT+i*86400000);
      const dn=DAYSH[d.getDay()];
      if(ev.days[dn]){
        if(ev.freq==='fortnightly'){
          const wks=Math.floor((d.getTime()-start)/(7*86400000));
          if(wks%2!==0)continue;
        }
        return d.getTime();
      }
    }
    return start;
  };
  return next(a)-next(b);
}

window.pickQTSport=function(sport){

  // Update pill highlights
  document.querySelectorAll('button.freq-btn').forEach(btn=>{

window.toggleQTParticipant=function(id){

  if(!Array.isArray(S.qt.participantIds))S.qt.participantIds=[];

window.saveQuickTraining=async function(){
  const qt=S.qt;
  const err=document.getElementById('qt-err');
  if(!qt){if(err)err.textContent='Form state lost — please reopen';return;}
  // Validate
  const sport=(document.getElementById('qt-sport')?.value||qt.sport||'').trim();
  if(!sport){if(err)err.textContent='Please pick or type a sport';return;}
  const anyDay=Object.values(qt.days).some(v=>v);
  if(!anyDay){if(err)err.textContent='Please pick at least one day';return;}
  const time=(document.getElementById('qt-time')?.value||qt.time||'').trim();
  if(!time){if(err)err.textContent='Please enter a start time';return;}
  const endTime=(document.getElementById('qt-endtime')?.value||qt.endTime||'').trim();
  const location=(document.getElementById('qt-loc')?.value||qt.location||'').trim();
  const startDate=(document.getElementById('qt-startdate')?.value||qt.startDate||fd(new Date())).trim();
  const endDate=(document.getElementById('qt-enddate')?.value||qt.endDate||'').trim();
  const notes=(document.getElementById('qt-notes')?.value||qt.notes||'').trim();
  if(err)err.textContent='';
  try{
    // Auto-add the sport to family.sports if not already there
    try{
      const existing=Array.isArray(S.family?.sports)?S.family.sports:[];
      const has=existing.some(s=>String(s).toLowerCase()===sport.toLowerCase());
      if(!has&&S.familyId){
        await updateDoc(doc(db,'families',S.familyId),{sports:[...existing,sport]});
      }
    }catch(e){console.warn('Failed to add sport to family.sports',e);}

    const timeStr=endTime?(time+' – '+endTime):time;
    await fadd(['events'],{
      title:sport+' Training',
      emoji:'🏃',
      participantIds:Array.isArray(qt.participantIds)?qt.participantIds:[],
      childId:'',adultUid:'',
      freq:'weekly',
      date:'',
      startDate,
      endDate,
      days:qt.days,
      time:timeStr,
      category:'sport-training',
      sport,
      location,
      dropoff:'',pickup:'',
      packItems:[],
      notes
    });
    notify(sport+' Training saved 🏃','✅');
    S.qt=null;
    back();
  }catch(ex){
    if(err)err.textContent='Save failed: '+(ex.message||ex);
  }
};

function sDinners(){
  // Get this week (today + 6 forward)
  const days=[];
  for(let i=0;i<7;i++){
    const d=new Date(today);d.setDate(today.getDate()+i);
    const ds=fd(d);
    const meal=S.dinners?.find(dn=>dn.date===ds);
    days.push({date:ds,dateObj:d,meal:meal});
  }
  // Past dinners (history) - automatically saved
  const pastDinners=(S.dinners||[]).filter(d=>d.date<todayStr).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  // Build meal history with frequency for suggestions
  const mealCounts={};
  pastDinners.forEach(d=>{
    const k=(d.meal||'').toLowerCase().trim();
    if(k)mealCounts[k]=(mealCounts[k]||0)+1;
  });
  const totalUnique=Object.keys(mealCounts).length;
  return `<div style="min-height:100%;display:flex;flex-direction:column">
    <div style="background:var(--card);padding:14px 16px;display:flex;align-items:center;border-bottom:1px solid var(--row-border);position:sticky;top:0;z-index:10">
      <button class="back-btn" onclick="S.listTab='menu';render()">${bk()} Back</button>
      <div style="flex:1;text-align:center;font-size:17px;font-weight:600">🍽 Dinners</div>
      <button class="btn" onclick="go('addDinner')" style="color:var(--navy);font-size:15px;font-weight:600">+ Add</button>
    </div>
    <div style="padding:14px 0 100px">
      <div class="sh" style="margin-bottom:6px">This Week</div>
      <div class="card" style="margin-bottom:14px">
        ${days.map((d,i,arr)=>{
          const isToday=d.date===todayStr;
          const dayLabel=isToday?'TODAY':DAYSH[d.dateObj.getDay()].toUpperCase();
          const dateLabel=d.dateObj.getDate()+' '+MONTHS[d.dateObj.getMonth()];
          return `<div class="row" style="border-bottom:${i<arr.length-1?'1px solid var(--row-border)':'none'}">
            <div style="width:60px;flex-shrink:0">
              <div style="font-size:11px;font-weight:700;color:${isToday?'#FF3B30':'var(--text-secondary)'}">${dayLabel}</div>
              <div style="font-size:12px;color:var(--text-secondary);margin-top:1px">${dateLabel}</div>
            </div>
            ${d.meal?`<div style="flex:1">
              <div style="font-size:15px;font-weight:600">${d.meal.meal}</div>
              ${d.meal.cook?`<div style="font-size:12px;color:var(--text-secondary)">👨‍🍳 ${d.meal.cook}</div>`:''}
              ${d.meal.notes?`<div style="font-size:12px;color:var(--text-secondary);font-style:italic">${d.meal.notes}</div>`:''}
            </div>
            <button onclick="dDinner('${d.meal.id}')" style="color:#FF3B30;font-size:20px;opacity:0.5;border:none;background:none;cursor:pointer">×</button>`:
            `<button onclick="go('addDinner',{date:'${d.date}'})" style="flex:1;text-align:left;color:var(--navy);font-size:14px;font-weight:600;background:none;border:none;cursor:pointer;padding:0;font-family:inherit">+ Plan a meal</button>`}
          </div>`;
        }).join('')}
      </div>

      <!-- MEAL IDEAS LIBRARY -->
      <div class="sh" style="margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;padding-right:16px">
        <span>💡 Meal Ideas (${(S.mealIdeas||[]).length})</span>
        <button onclick="addMealIdea()" style="background:none;border:none;color:var(--navy);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit">+ Add idea</button>
      </div>
      <div class="card" style="margin-bottom:14px">
        ${(S.mealIdeas||[]).length===0?'<div class="row" style="color:var(--text-secondary);font-size:13px;justify-content:center;padding:14px">No ideas yet — tap "Add idea" to start your bank</div>':
          (S.mealIdeas||[]).sort((a,b)=>(a.label||'').localeCompare(b.label||'')).map((m,i,arr)=>`<div class="row" style="border-bottom:${i<arr.length-1?'1px solid var(--row-border)':'none'}">
            <div style="flex:1;font-size:14px">${m.label}</div>
            <button onclick="useMealIdea('${m.id}')" style="padding:5px 10px;border-radius:8px;background:var(--navy-soft);border:none;cursor:pointer;color:var(--navy);font-size:12px;font-weight:600;font-family:inherit;margin-right:6px">Use →</button>
            <button onclick="dMealIdea('${m.id}')" style="color:#FF3B30;font-size:18px;opacity:0.5;border:none;background:none;cursor:pointer">×</button>
          </div>`).join('')}
      </div>

      ${pastDinners.length>0?`
      <div class="sh" style="margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;padding-right:16px">
        <span>📖 Meal History (${pastDinners.length})</span>
        ${totalUnique>=10?`<span style="font-size:11px;color:var(--text-secondary);font-weight:500;text-transform:none;letter-spacing:0">Auto-suggesting ✨</span>`:`<span style="font-size:11px;color:var(--text-secondary);font-weight:500;text-transform:none;letter-spacing:0">${10-totalUnique} more for suggestions</span>`}
      </div>
      <div class="card" style="margin-bottom:14px">
        ${pastDinners.slice(0,30).map((d,i,arr)=>{
          const dt=new Date(d.date+'T12:00');
          return `<div class="row" style="border-bottom:${i<Math.min(arr.length,30)-1?'1px solid var(--row-border)':'none'}">
            <div style="width:70px;flex-shrink:0;font-size:11px;color:var(--text-secondary)">${DAYSH[dt.getDay()]} ${dt.getDate()}/${dt.getMonth()+1}</div>
            <div style="flex:1">
              <div style="font-size:14px;font-weight:600">${d.meal}</div>
              ${d.cook?`<div style="font-size:11px;color:var(--text-secondary)">👨‍🍳 ${d.cook}</div>`:''}
            </div>
            <button onclick="reuseDinner('${d.id}')" style="padding:5px 10px;border-radius:8px;background:var(--navy-soft);border:none;cursor:pointer;color:var(--navy);font-size:12px;font-weight:600;font-family:inherit;margin-right:6px">↻ Reuse</button>
            <button onclick="saveAsMealIdea('${d.id}')" style="padding:5px 10px;border-radius:8px;background:#34C75920;border:none;cursor:pointer;color:#34C759;font-size:12px;font-weight:600;font-family:inherit" title="Save to ideas bank">💡</button>
          </div>`;
        }).join('')}
        ${pastDinners.length>30?`<div class="row" style="justify-content:center;color:var(--text-secondary);font-size:12px">+${pastDinners.length-30} older meals</div>`:''}
      </div>
      `:''}
    </div>
  </div>`;
}

function sAddDinner(){
  const presetDate=S.screenParams?.date||todayStr;
  const prefillMeal=S.screenParams?.prefillMeal||'';
  const prefillCook=S.screenParams?.prefillCook||'';
  const prefillNotes=S.screenParams?.prefillNotes||'';
  const mems=members();
  // Combine meal ideas + history for suggestions
  const mealCounts={};
  (S.dinners||[]).forEach(d=>{
    const k=(d.meal||'').trim();
    if(k)mealCounts[k]=(mealCounts[k]||0)+1;
  });
  const ideaLabels=(S.mealIdeas||[]).map(m=>m.label).filter(Boolean);
  // Merge: meal ideas + past meals (deduped, ideas first)
  const allMeals=[...new Set([...ideaLabels,...Object.keys(mealCounts).sort((a,b)=>mealCounts[b]-mealCounts[a])])];
  const uniqueMeals=allMeals;
  // Show suggestions if either: 10+ history OR any meal ideas saved
  const showSuggestions=ideaLabels.length>0||Object.keys(mealCounts).length>=10;
  // Pick a random suggestion as placeholder
  const placeholderMeal=showSuggestions?uniqueMeals[Math.floor(Math.random()*Math.min(uniqueMeals.length,8))]:'';
  return `<div style="min-height:100%;display:flex;flex-direction:column;background:var(--bg)">

          ${done.map((g,i)=>`<div class="row" style="border-bottom:${i<done.length-1?'1px solid var(--row-border)':'none'}">

// ── UNIFIED PERSON PROFILE (kids + adults) ─────────
function sPersonProfile(){
  const kind=S.screenParams?.kind;
  let person=null;
  if(kind==='child'){
    person=S.children.find(c=>c.id===S.screenParams.childId);
  }else if(kind==='adult'){
    const m=members().find(x=>x.uid===S.screenParams.uid);
    if(m)person={...m,id:m.uid,isAdult:true};
  }
  if(!person)return back(),'';
  const color=person.color||NAVY;
  const name=person.name||'';
  const photoURL=person.photoURL||'';
  const displayMeta=person.isAdult?(person.relationship||person.role||''):(person.year+' · '+(person.school||''));
  // Day offset used here too - allow scrolling forward/back for this person
  if(typeof S.profileDayOffset==='undefined')S.profileDayOffset=0;
  const dateOffset=S.profileDayOffset||0;
  const viewDate=new Date(today);viewDate.setDate(today.getDate()+dateOffset);
  const viewDateStr=fd(viewDate);
  const dayLabel=dateOffset===0?'Today':dateOffset===1?'Tomorrow':dateOffset===-1?'Yesterday':DAYNAMES[viewDate.getDay()];

  // Events for THIS person on view date
  let dayEvents=[];
  let dayLogistics=[]; // adult's drop-off/pick-up duties (not their own events)
  if(person.isAdult){
    const firstName=name.split(' ')[0];
    S.events.forEach(e=>{
      // Is this event happening today?
      let happens=false;
      if(!e.freq||e.freq==='once'){
        happens=(e.date===viewDateStr);
      }else{
        const start=new Date((e.startDate||e.date||viewDateStr)+'T12:00');
        const end=e.endDate?new Date(e.endDate+'T12:00'):null;
        const v=new Date(viewDateStr+'T12:00');
        if(v<start||(end&&v>end))return;
        if(!e.days||!e.days[DAYSH[v.getDay()]])return;
        happens=true;
      }
      if(!happens)return;
      // Determine relationship to this adult
      const isParticipant=Array.isArray(e.participantIds)
        ? e.participantIds.includes(person.id)
        : e.adultUid===person.id;
      const isDuty=(e.dropoff===name||e.pickup===name||e.dropoff===firstName||e.pickup===firstName);
      if(isParticipant){
        dayEvents.push(e);
      }else if(isDuty){
        dayLogistics.push(e);
      }
    });
  }else{
    dayEvents=eventsForChildOnDate(person,viewDateStr);
  }
  dayEvents.sort((a,b)=>parseTimeToMinutes(a.time)-parseTimeToMinutes(b.time));
  dayLogistics.sort((a,b)=>parseTimeToMinutes(a.time)-parseTimeToMinutes(b.time));

  // Packing for child / events for adult — only items needed for this date's events (+ pinned)
  const pk=person.isAdult?[]:packingForChildOnDate(person,viewDateStr);

  return `<div style="flex:1;display:flex;flex-direction:column">
    <div style="background:${color}18;padding:14px 16px;display:flex;align-items:center;border-bottom:2px solid ${color}25;position:sticky;top:0;z-index:10">
      <button class="back-btn" onclick="S.profileDayOffset=0;back()" style="color:${color}"><svg width="10" height="17" viewBox="0 0 10 17"><polyline points="9,1 1,8.5 9,16" stroke="${color}" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg> Back</button>
      <div style="flex:1;text-align:center;font-size:17px;font-weight:600;color:${color}">${name}</div>
      <button onclick="${person.isAdult?`go('editCaregiver',{uid:'${person.id}'})`:`go('editChild',{childId:'${person.id}'})`}" style="border:none;background:none;cursor:pointer;color:${color};font-size:14px;font-weight:600;font-family:inherit;width:60px">Edit</button>
    </div>
    <div class="scroll-view" style="padding:20px 0 100px">
      <!-- Big avatar + name -->
      <div style="display:flex;flex-direction:column;align-items:center;margin-bottom:18px;padding:0 16px">
        ${photoURL?`<div style="width:140px;height:140px;border-radius:70px;border:5px solid ${color};background-image:url('${photoURL}');background-size:cover;background-position:center;box-shadow:0 8px 24px ${color}40"></div>`:`<div style="width:140px;height:140px;border-radius:70px;background:${color};display:flex;align-items:center;justify-content:center;color:#fff;font-size:48px;font-weight:800;box-shadow:0 8px 24px ${color}40">${name.split(' ').map(n=>n[0]).slice(0,2).join('').toUpperCase()}</div>`}
        <div style="font-size:28px;font-weight:800;margin-top:14px;color:var(--text)">${name}</div>
        <div style="font-size:14px;color:var(--text-secondary);margin-top:2px">${displayMeta}</div>
      </div>

      <!-- Day toggle -->
      <div style="display:flex;align-items:center;gap:8px;padding:0 16px;margin-bottom:14px">
        <button onclick="S.profileDayOffset=(S.profileDayOffset||0)-1;render()" style="width:34px;height:34px;border-radius:17px;background:${color}18;border:none;color:${color};font-size:20px;font-weight:300;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;flex-shrink:0">‹</button>
        <button onclick="S.profileDayOffset=0;render()" style="flex:1;padding:8px 12px;border-radius:12px;border:${dateOffset===0?'none':'2px solid '+color};background:${dateOffset===0?color:'var(--bg)'};color:${dateOffset===0?'#fff':color};font-size:13px;font-weight:700;cursor:pointer;font-family:inherit">${dayLabel} · ${DAYNAMES[viewDate.getDay()]} ${viewDate.getDate()} ${MONTHS[viewDate.getMonth()]}</button>
        <button onclick="S.profileDayOffset=(S.profileDayOffset||0)+1;render()" style="width:34px;height:34px;border-radius:17px;background:${color}18;border:none;color:${color};font-size:20px;font-weight:300;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;flex-shrink:0">›</button>
        <button onclick="S.profileDayOffset=0;render()" title="Today" style="padding:8px 14px;border-radius:14px;background:${dateOffset===0?'#FF9500':color};border:none;color:#fff;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;flex-shrink:0">Today</button>
      </div>

      <!-- Activities -->
      <div class="sh" style="padding:0 16px;margin-bottom:6px">📅 ${dayLabel}'s Events ${dayEvents.length?'('+dayEvents.length+')':''}</div>
      <div class="card" style="margin-bottom:14px">
        ${dayEvents.length===0?`<div style="padding:20px;text-align:center;color:var(--text-secondary);font-size:14px">No events ${dayLabel.toLowerCase()}</div>`:''}
        ${dayEvents.map((ev,i)=>`<div class="row" style="border-bottom:${i<dayEvents.length-1?'1px solid var(--row-border)':'none'}">
          <div style="width:44px;text-align:right;font-size:12px;font-weight:600;color:var(--text-secondary);flex-shrink:0">${ev.time||`<span style="font-size:10px">All day</span>`}</div>
          <div style="width:32px;height:32px;border-radius:16px;background:${color}18;border:2px solid ${color};display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0">${ev.emoji||'📅'}</div>
          <div style="flex:1">
            <div style="font-size:14px;font-weight:600;color:var(--text)">${ev.title}</div>
            ${ev.location?`<div style="font-size:12px;color:var(--text-secondary)">${locLink(ev.location)}</div>`:''}
            ${ev.dropoff||ev.pickup?`<div style="font-size:11px;color:${color};font-weight:500">${ev.dropoff?'🚗 '+ev.dropoff:''}${ev.dropoff&&ev.pickup?' · ':''}${ev.pickup?'🏠 '+ev.pickup:''}</div>`:''}
          </div>
        </div>`).join('')}
        <button onclick="go('addEvent',{${person.isAdult?`adultUid:'${person.id}'`:`childId:'${person.id}'`},date:'${viewDateStr}'})" style="width:100%;padding:13px 16px;border-top:1px solid var(--row-border);background:none;border-left:none;border-right:none;border-bottom:none;color:${color};font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;text-align:center">+ Add Event for ${name.split(' ')[0]} on ${dayLabel.toLowerCase()}</button>
      </div>

      <!-- Reminders for this person on this day -->
      ${(()=>{
        const myKey=person.isAdult?'adult:'+person.id:'child:'+person.id;
        const personReminders=(S.reminders||[]).filter(r=>{
          // First: is this reminder relevant to this person?
          let relevant=false;
          if(Array.isArray(r.forKeys)&&r.forKeys.length){
            relevant=r.forKeys.includes(myKey);
          }else{
            relevant=person.isAdult?r.adultUid===person.id:r.childId===person.id;
          }
          if(!relevant)return false;
          // Then: is it active on the date being viewed?
          if(r.done)return false; // hide ticked-off reminders (Nash request)
          if(r.mode==='ongoing')return viewDateStr<=r.date;
          return r.date===viewDateStr;
        }).sort((a,b)=>{
          const da=a.date||'9999-12-31';
          const db=b.date||'9999-12-31';
          return da.localeCompare(db);
        });
        if(personReminders.length===0)return '';
        return `<div class="sh" style="padding:0 16px;margin-bottom:6px">⏰ ${dayLabel}'s Reminders</div>
        <div class="card" style="margin-bottom:14px">
          ${personReminders.map((r,i)=>{
            // Build "Due X" label for ongoing reminders
            let dueLabel='';
            if(r.mode==='ongoing'&&r.date){
              const dDate=new Date(r.date+'T12:00');
              const isDueToday=r.date===viewDateStr;
              const dStr=DAYSH[dDate.getDay()]+' '+dDate.getDate()+' '+MONTHS[dDate.getMonth()];
              dueLabel=`<div style="font-size:11px;font-weight:700;color:${isDueToday?'#FF3B30':color};margin-top:3px">${isDueToday?'🔴 Due today · '+dStr:'📅 Due '+dStr}</div>`;
            }
            return `<div class="row" data-longpress="reminder:${r.id}" style="border-bottom:${i<personReminders.length-1?'1px solid var(--row-border)':'none'};${r.done?'opacity:0.55':''}">
            <div class="cb ${r.done?'on':''}" onclick="tReminder('${r.id}',${!r.done})" style="${r.done?'background:'+color+';border:none':'border-color:'+color}">${r.done?ck():''}</div>
            <div style="flex:1">
              <div style="font-size:15px;font-weight:500;color:var(--text);${r.done?'text-decoration:line-through':''}">${r.text}</div>
              ${dueLabel}
              ${r.notes?`<div style="font-size:11px;color:var(--text-secondary);font-style:italic;margin-top:2px">${r.notes}</div>`:''}
            </div>
            <button onclick="dReminder('${r.id}')" style="color:#FF3B30;font-size:18px;opacity:0.5;border:none;background:none;cursor:pointer">×</button>
          </div>`;
          }).join('')}
          <button onclick="go('addReminder')" style="width:100%;padding:13px 16px;border-top:1px solid var(--row-border);background:none;border-left:none;border-right:none;border-bottom:none;color:${color};font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;text-align:center">+ Add Reminder</button>
        </div>`;
      })()}

      ${person.isAdult?`
      <!-- Today's Logistics (drop-off/pick-up duties) -->
      <div class="sh" style="padding:0 16px;margin-bottom:6px">🚗 ${dayLabel}'s Logistics ${dayLogistics.length?'('+dayLogistics.length+')':''}</div>
      <div class="card" style="margin-bottom:14px">
        ${dayLogistics.length===0?`<div style="padding:20px;text-align:center;color:var(--text-secondary);font-size:14px">No drop-offs or pick-ups ${dayLabel.toLowerCase()}</div>`:''}
        ${dayLogistics.map((ev,i)=>{
          const firstName=name.split(' ')[0];
          const isMyDropoff=ev.dropoff===name||ev.dropoff===firstName;
          const isMyPickup=ev.pickup===name||ev.pickup===firstName;
          // Find the participant child(ren) for context
          let participantNames='';
          if(Array.isArray(ev.participantIds)&&ev.participantIds.length){
            participantNames=ev.participantIds.map(pid=>{
              const c=S.children.find(ch=>ch.id===pid);return c?c.name:null;
            }).filter(Boolean).join(', ');
          }else if(ev.childId){
            const c=S.children.find(ch=>ch.id===ev.childId);
            if(c)participantNames=c.name;
          }
          return `<div class="row" style="border-bottom:${i<dayLogistics.length-1?'1px solid var(--row-border)':'none'}">
            <div style="width:44px;text-align:right;font-size:12px;font-weight:600;color:var(--text-secondary);flex-shrink:0">${ev.time||`<span style="font-size:10px">All day</span>`}</div>
            <div style="width:32px;height:32px;border-radius:16px;background:${color}18;border:2px solid ${color};display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0">${isMyDropoff&&isMyPickup?'🔄':isMyDropoff?'🚗':'🏠'}</div>
            <div style="flex:1">
              <div style="font-size:14px;font-weight:600;color:var(--text)">${ev.title}</div>
              ${participantNames?`<div style="font-size:12px;color:var(--text-secondary)">For ${participantNames}</div>`:''}
              ${ev.location?`<div style="font-size:12px;color:var(--text-secondary)">${locLink(ev.location)}</div>`:''}
              <div style="font-size:11px;color:${color};font-weight:600">${isMyDropoff?'🚗 Drop-off':''}${isMyDropoff&&isMyPickup?' · ':''}${isMyPickup?'🏠 Pick-up':''}</div>
            </div>
          </div>`;
        }).join('')}
      </div>
      `:''}

      ${!person.isAdult&&!S.screenParams?.fromFamily?`
      <!-- Packing list (children only, NOT shown when reached from Family page) -->
      <div class="sh" style="padding:0 16px;margin-bottom:6px">🎒 ${dayLabel}'s Packing (${pk.filter(p=>p.checked).length}/${pk.length})</div>
      <div class="card" style="margin-bottom:14px">
        ${pk.length===0?`<div style="padding:20px;text-align:center;color:var(--text-secondary);font-size:14px;line-height:1.5">Nothing to pack ${dayLabel.toLowerCase()} 🎉<br><span style="font-size:12px">Pack items appear here based on ${name.split(' ')[0]}'s events for this day</span></div>`:''}
        ${pk.map((item,i)=>`<div class="row" style="border-bottom:${i<pk.length-1?'1px solid var(--row-border)':'none'}">
          <div class="cb ${item.checked?'on':''}" style="${item.checked?'background:'+color+';border:none':'border-color:'+color}" onclick="tPack('${person.id}','${item.id}',${!item.checked})">${item.checked?ck():''}</div>
          <span style="flex:1;font-size:15px;color:${item.checked?'var(--text-secondary)':'var(--text)'};text-decoration:${item.checked?'line-through':'none'}">${item.label}</span>
          <button onclick="dPack('${person.id}','${item.id}')" style="color:#FF3B30;font-size:18px;opacity:0.5;border:none;background:none;cursor:pointer">×</button>
        </div>`).join('')}
        <button onclick="go('addPackItem',{childId:'${person.id}'})" style="width:100%;padding:13px 16px;border-top:1px solid var(--row-border);background:none;border-left:none;border-right:none;border-bottom:none;color:${color};font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;text-align:center">+ Add Packing Item</button>
      </div>
      `:''}

      <!-- GIFTS (everyone — kids & adults) -->
      ${(()=>{
        const uid=S.user?.uid;
        const personGifts=(S.gifts||[]).filter(g=>g.recipientId===person.id&&(!g.isPrivate||g.createdBy===uid));
        return `<div class="sh" style="padding:0 16px;margin-bottom:6px">🎁 Gift Ideas (${personGifts.length})</div>
        <div class="card" style="margin-bottom:14px">
          ${personGifts.length===0?`<div style="padding:20px;text-align:center;color:var(--text-secondary);font-size:14px">No gift ideas yet</div>`:personGifts.map((g,i,arr)=>`<div class="row" style="border-bottom:${i<arr.length-1?'1px solid var(--row-border)':'none'}">
            <div style="flex:1">
              <div style="font-size:14px;font-weight:600;color:var(--text)">${g.label}</div>
              <div style="font-size:12px;color:var(--text-secondary)">${g.occasion||''}${g.price?' · $'+g.price:''}${g.isPrivate?' · 🔒 Private':''}</div>
            </div>
            <button onclick="dGift('${g.id}')" style="color:#FF3B30;font-size:18px;opacity:0.5;border:none;background:none;cursor:pointer">×</button>
          </div>`).join('')}
          <button onclick="go('addGift',{id:'${person.id}',name:'${name.replace(/'/g,'&#39;')}'})" style="width:100%;padding:13px 16px;border-top:1px solid var(--row-border);background:none;border-left:none;border-right:none;border-bottom:none;color:${color};font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;text-align:center">+ Add Gift Idea for ${name.split(' ')[0]}</button>
        </div>`;
      })()}

      ${!person.isAdult?`

      <!-- ASSESSMENTS (Year 7+ only) -->
      ${(()=>{
        const yr=childYearNum(person);
        if(yr===null||yr<7)return '';
        const childAssess=S.assessments.filter(a=>a.childId===person.id).sort((a,b)=>(a.daysLeft||999)-(b.daysLeft||999));
        return `<div class="sh" style="padding:0 16px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;padding-right:16px">
          <span>📚 Assessments (${childAssess.length})</span>
        </div>
        <div class="card" style="margin-bottom:14px">
          ${childAssess.length===0?`<div style="padding:20px;text-align:center;color:var(--text-secondary);font-size:14px">No assessments yet</div>`:childAssess.map((a,i,arr)=>{
            const urg=(a.daysLeft||99)<=7;
            return `<div class="row" style="border-bottom:${i<arr.length-1?'1px solid var(--row-border)':'none'}">
              <div style="flex:1">
                <div style="font-size:14px;font-weight:600;color:var(--text)">${a.title}</div>
                <div style="font-size:12px;color:var(--text-secondary)">${a.subject||''}${a.due?' · Due '+a.due:''}</div>
                ${a.notes?`<div style="font-size:11px;color:var(--text-secondary);font-style:italic;margin-top:2px">${a.notes.substring(0,90)}${a.notes.length>90?'...':''}</div>`:''}
              </div>
              ${a.daysLeft!==undefined?`<div style="font-size:11px;font-weight:700;color:${urg?'#FF3B30':'#34C759'};background:${urg?'#FFF0EE':'#EAFAF0'};padding:3px 8px;border-radius:12px;white-space:nowrap;margin-right:6px">${a.daysLeft}d</div>`:''}
              <button onclick="dAssessment('${a.id}')" style="color:#FF3B30;font-size:18px;opacity:0.5;border:none;background:none;cursor:pointer">×</button>
            </div>`;
          }).join('')}
          <button onclick="S.preselectChild='${person.id}';go('addAssessment')" style="width:100%;padding:13px 16px;border-top:1px solid var(--row-border);background:none;border-left:none;border-right:none;border-bottom:none;color:${color};font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;text-align:center">+ Add Assessment for ${name.split(' ')[0]}</button>
        </div>`;
      })()}
      `:''}

      ${person.isAdult&&S.screenParams?.fromFamily?`
      <!-- Contact (adult only, from Family page) -->
      <div class="sh" style="padding:0 16px;margin-bottom:6px">👤 Profile</div>
      <div class="card" style="margin-bottom:14px">
        <div class="row"><span style="flex:1;color:var(--text-secondary);font-size:14px">Role</span><span style="color:var(--text);font-weight:600">${person.role||'Member'}</span></div>
        ${person.relationship?`<div class="row"><span style="flex:1;color:var(--text-secondary);font-size:14px">Relationship</span><span style="color:var(--text);font-weight:600">${person.relationship}</span></div>`:''}
        ${person.email?`<div class="row"><span style="flex:1;color:var(--text-secondary);font-size:14px">Email</span><span style="color:var(--text);font-weight:600;font-size:13px">${person.email}</span></div>`:''}
      </div>
      `:''}

      <!-- Personal invite code (only when accessed from Family page) -->
      ${S.screenParams?.fromFamily?(()=>{
        const m=person.isAdult?members().find(x=>x.uid===person.id):null;
        const code=person.isAdult?(m?.personalCode||''):(person.personalCode||'');
        const escName=name.replace(/'/g,"\\\\'");
        return `<div class="sh" style="padding:0 16px;margin-bottom:6px">🔑 Personal Invite</div>
        <div style="margin:0 16px 14px;background:${color};border-radius:14px;padding:18px 18px;color:#fff">
          ${code?`
            <div style="font-size:11px;font-weight:700;color:rgba(255,255,255,0.78);letter-spacing:0.5px;margin-bottom:6px">FOR ${name.toUpperCase()} ONLY</div>
            <div style="font-size:13px;color:rgba(255,255,255,0.92);line-height:1.5;margin-bottom:14px">When ${name.split(' ')[0]} taps the link below, they'll be guided through sign-up and their account will link directly to this profile.</div>
            <button onclick="sharePersonalCode('${code}','${escName}')" style="width:100%;background:#fff;border:none;border-radius:12px;padding:14px;color:${color};font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,0.1)">📤 Send invite link</button>
            <div style="display:flex;gap:6px;flex-wrap:wrap">
              <button onclick="copyPersonalCode('${code}','${escName}')" style="flex:1;min-width:0;background:rgba(255,255,255,0.22);border:none;border-radius:8px;padding:9px 12px;color:#fff;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit">📋 Copy link</button>
              <button onclick="emailPersonalCode('${code}','${escName}','${person.email||''}')" style="flex:1;min-width:0;background:rgba(255,255,255,0.22);border:none;border-radius:8px;padding:9px 12px;color:#fff;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit">📧 Email</button>
            </div>
            <div style="font-size:10px;font-weight:600;color:rgba(255,255,255,0.6);letter-spacing:0.5px;margin-top:14px;padding-top:10px;border-top:1px solid rgba(255,255,255,0.18)">FALLBACK CODE</div>
            <div style="font-size:14px;font-weight:700;letter-spacing:1.5px;font-family:monospace;color:rgba(255,255,255,0.85);margin-top:2px">${code}</div>
            <div style="font-size:10px;color:rgba(255,255,255,0.55);margin-top:2px;line-height:1.45">If the link can't be opened for any reason, ${name.split(' ')[0]} can also type this code on the sign-up page.</div>
          `:`
            <div style="font-size:13px;color:rgba(255,255,255,0.92);margin-bottom:12px;line-height:1.55">Generate a personal invite link for ${name.split(' ')[0]}. They tap it, sign up, and the account links straight to this profile — no shared family codes, no chance of mix-ups.</div>
            <button onclick="generatePersonalCode('${person.id}','${person.isAdult?'adult':'child'}')" style="width:100%;background:#fff;border:none;border-radius:12px;padding:14px;color:${color};font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;box-shadow:0 2px 8px rgba(0,0,0,0.1)">🔑 Generate invite link</button>
          `}
        </div>`;
      })():''}
    </div>
  </div>`;
}

    <div style="background:var(--card);padding:14px 16px;display:flex;align-items:center;border-bottom:1px solid var(--row-border);position:sticky;top:0;z-index:10">

      <div style="background:var(--navy-soft);border-radius:14px;padding:16px;margin-top:8px;margin-bottom:80px">

function sPrivacy(){
  return `<div style="min-height:100%;display:flex;flex-direction:column;background:var(--bg)">
    <div style="background:var(--card);padding:14px 16px;display:flex;align-items:center;border-bottom:1px solid var(--row-border);position:sticky;top:0;z-index:10">
      <button class="back-btn" onclick="back()">${bk()} Back</button>
      <div style="flex:1;text-align:center;font-size:17px;font-weight:600">Privacy & Your Data</div>
      <div style="width:60px"></div>

// ── HAND-OFF LOG ──────────────────────────────────
function sLogHandoff(){
  const sp=S.screenParams||{};
  const childId=sp.childId;
  const child=S.children.find(c=>c.id===childId);
  if(!child){back();return '';}
  const color=child.color||NAVY;
  const adults=members();
  const me=members().find(m=>m.uid===S.user?.uid);
  const myName=me?.name||S.user?.displayName||'';
  // Recent handoffs for this child
  const recent=(S.handoffs||[]).filter(h=>h.childId===childId).sort((a,b)=>(b.when||0)-(a.when||0)).slice(0,5);
  return `<div style="min-height:100%;display:flex;flex-direction:column;background:var(--bg)">
    <div style="background:var(--card);padding:14px 16px;display:flex;align-items:center;border-bottom:1px solid var(--row-border);position:sticky;top:0;z-index:10">
      <button class="back-btn" onclick="back()">${bk()} Back</button>
      <div style="flex:1;text-align:center;font-size:17px;font-weight:600">🚗 Hand-off log</div>
      <div style="width:60px"></div>
    </div>
    <div style="padding:20px;display:flex;flex-direction:column;gap:14px;max-width:560px;margin:auto;width:100%">

      <!-- Child header -->
      <div style="display:flex;align-items:center;gap:12px;background:${color}15;border:1px solid ${color}40;border-radius:14px;padding:12px 14px">
        ${av(child.name,color,44,child.photoURL)}
        <div>
          <div style="font-size:11px;font-weight:700;color:${color};letter-spacing:0.5px">FOR</div>
          <div style="font-size:18px;font-weight:700;color:var(--text)">${child.name}</div>
        </div>
      </div>

      <!-- From / To -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div>
          <div style="font-size:12px;font-weight:700;color:var(--text-secondary);margin-bottom:6px">FROM (handing over)</div>
          <select class="input" id="hoFrom">
            <option value="${myName}" selected>${myName} (you)</option>
            ${adults.filter(a=>a.uid!==S.user?.uid).map(a=>`<option value="${a.name}">${a.name}</option>`).join('')}
            <option value="School">School</option>
            <option value="After-school care">After-school care</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div>
          <div style="font-size:12px;font-weight:700;color:var(--text-secondary);margin-bottom:6px">TO (now with)</div>
          <select class="input" id="hoTo">
            <option value="">Select...</option>
            ${adults.map(a=>`<option value="${a.name}" ${a.uid===S.user?.uid?'':''}>${a.name}${a.uid===S.user?.uid?' (you)':''}</option>`).join('')}
            <option value="School">School</option>
            <option value="Sport">Sport / activity</option>
            <option value="After-school care">After-school care</option>
            <option value="Other">Other</option>
          </select>
        </div>
      </div>

      <!-- Location -->
      <div>
        <div style="font-size:12px;font-weight:700;color:var(--text-secondary);margin-bottom:6px">LOCATION (optional)</div>
        <input class="input" id="hoLoc" type="text" placeholder="e.g. School gate, GT Aquatics, home"/>
      </div>

      <!-- Note -->
      <div>
        <div style="font-size:12px;font-weight:700;color:var(--text-secondary);margin-bottom:6px">NOTE (optional)</div>
        <input class="input" id="hoNote" type="text" placeholder="e.g. Has homework, fed lunch"/>
      </div>

      <div id="hoErr" class="err"></div>
      <button class="primary-btn" onclick="hLogHandoff('${childId}')">✓ Log hand-off</button>

      ${recent.length>0?`
        <div style="margin-top:8px">
          <div class="sh" style="margin-bottom:6px">RECENT HAND-OFFS · ${child.name}</div>
          <div class="card">
            ${recent.map((h,i)=>{
              const d=new Date(h.when||0);
              const ago=Date.now()-(h.when||0);
              const mins=Math.round(ago/60000);
              const timeStr=mins<60?(mins+' min ago'):mins<1440?(Math.round(mins/60)+' hr ago'):(Math.round(mins/1440)+' day(s) ago');
              return `<div class="row" style="border-bottom:${i<recent.length-1?'1px solid var(--row-border)':'none'}">
                <div style="width:30px;height:30px;border-radius:15px;background:${color}18;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0">🚗</div>
                <div style="flex:1">
                  <div style="font-size:14px;font-weight:600;color:var(--text)">${h.from||'?'} → <strong>${h.to||'?'}</strong></div>
                  <div style="font-size:11px;color:var(--text-secondary)">${h.location?h.location+' · ':''}${timeStr}</div>

// ── Image shrinking helper for photos ─────────────────
async function shrinkImage(dataUrl, maxSize){
  return new Promise(resolve=>{
    const img=new Image();
    img.onload=()=>{
      const ratio=Math.min(maxSize/img.width,maxSize/img.height,1);
      const w=Math.round(img.width*ratio);
      const h=Math.round(img.height*ratio);
      const canvas=document.createElement('canvas');
      canvas.width=w;canvas.height=h;
      const ctx=canvas.getContext('2d');
      ctx.drawImage(img,0,0,w,h);
      resolve(canvas.toDataURL('image/jpeg',0.8));
    };
    img.onerror=()=>resolve(dataUrl);
    img.src=dataUrl;
  });
}

function authErrMsg(code,raw){
  const map={
    'auth/invalid-credential':'Incorrect email or password',
    'auth/wrong-password':'Incorrect password',
    'auth/user-not-found':'No account found with this email',
    'auth/invalid-email':'Please enter a valid email address',
    'auth/email-already-in-use':'An account already exists with this email — try signing in instead',
    'auth/weak-password':'Password is too weak (must be at least 6 characters)',
    'auth/too-many-requests':'Too many attempts. Please wait a few minutes and try again',
    'auth/network-request-failed':'Network error — check your connection and try again',
    'auth/popup-closed-by-user':'Sign in cancelled',
    'auth/popup-blocked':'Pop-up blocked — please allow pop-ups for this site',
    'auth/missing-password':'Please enter your password',
    'auth/missing-email':'Please enter your email'
  };
  return map[code]||(raw?String(raw).replace(/Firebase:\s*/,'').replace(/\(.*\)/,'').trim():'Something went wrong');
}

window.hGoogle=async()=>{
  try{
    await signInWithPopup(auth,gp);
  }catch(ex){
    const code=ex.code||'';
    // User cancelled or closed the popup - no error needed
    if(code==='auth/popup-closed-by-user'||code==='auth/cancelled-popup-request')return;
    // Real error - tell the user
    let msg='Google sign-in failed';
    if(code==='auth/popup-blocked')msg='Popup blocked. Please allow popups and try again.';
    else if(code==='auth/operation-not-allowed')msg='Google sign-in not enabled in Firebase';
    else if(code==='auth/unauthorized-domain')msg='This domain is not authorised in Firebase';
    else if(code==='auth/network-request-failed')msg='Network error. Check your connection.';
    else if(ex.message)msg='Google sign-in failed: '+ex.message;
    notify(msg,'⚠️');
    console.error('[HomeBase] Google sign-in error',ex);
  }
};

// Capture all Add Event form field values into S.ef so they survive a re-render.
// Called before any change that triggers render() (category toggle, freq change, etc.)
function captureEventFormToState(){
  const ef=S.ef;
  if(!ef)return;
  const get=(id)=>document.getElementById(id);
  const v=(id)=>get(id)?.value;
  if(get('et'))ef.title=v('et')||'';
  if(get('edate'))ef.date=v('edate')||'';
  if(get('estartdate'))ef.startDate=v('estartdate')||'';
  if(get('eenddate'))ef.endDate=v('eenddate')||'';
  if(get('eloc'))ef.location=v('eloc')||'';
  if(get('enotes'))ef.notes=v('enotes')||'';
  if(get('edrop'))ef.dropoff=v('edrop')||'';
  if(get('epick'))ef.pickup=v('epick')||'';
  // Build time string from the time selects if present
  try{
    const builtTime=typeof buildTimeString==='function'?buildTimeString():'';
    if(builtTime||get('etime-h-start'))ef.time=builtTime;
  }catch(e){/* ignore */}
}

function buildTimeString(){

window.hSaveEvent=async()=>{
  const title=$('et')?.value?.trim(),err=$('everr');
  if(!title){if(err)err.textContent='Please enter a title';return;}
  const ef=S.ef;
  if(ef.freq==='once'&&!$('edate')?.value){if(err)err.textContent='Please select a date';return;}
  if(ef.freq!=='once'&&!Object.values(ef.days).some(v=>v)){if(err)err.textContent='Please select at least one day';return;}
  // Category is compulsory now
  if(!ef.category){if(err)err.textContent='Please pick a category';return;}
  // Sport is compulsory when category is sport-*
  let sportValue='';
  if(ef.category==='sport-games'||ef.category==='sport-training'){
    sportValue=($('ev-sport-input')?.value||ef.sport||'').trim();
    if(!sportValue){if(err)err.textContent='Please specify which sport';return;}
    // Also add to family.sports if not already there (auto-grow the list)
    try{
      const existing=Array.isArray(S.family?.sports)?S.family.sports:[];
      const has=existing.some(s=>String(s).toLowerCase()===sportValue.toLowerCase());
      if(!has&&S.familyId){
        const next=[...existing,sportValue].sort();
        await updateDoc(doc(db,'families',S.familyId),{sports:next});
        if(S.family)S.family.sports=next;
      }
    }catch(e){}
  }
  const dropRaw=$('edrop')?.value||'';
  const pickRaw=$('epick')?.value||'';
  const dropoff=dropRaw==='__other'?prompt('Enter drop-off person name:')||'':dropRaw;
  const pickup=pickRaw==='__other'?prompt('Enter pick-up person name:')||'':pickRaw;
  const ef2=S.ef;
  // Build a draft for conflict detection
  const draft={
    title,
    time:buildTimeString(),
    freq:ef2.freq,
    date:ef2.freq==='once'?$('edate')?.value:'',
    startDate:ef2.freq!=='once'?$('estartdate')?.value||fd(today):'',
    endDate:ef2.freq!=='once'?$('eenddate')?.value||'':'',
    days:ef2.freq!=='once'?{...ef2.days}:{},
    participantIds:[...(ef2.participantIds||[])],
    dropoff,pickup
  };
  const conflicts=findConflicts(draft);
  if(conflicts.length>0&&!ef2._overrideConflict){
    const lines=conflicts.slice(0,3).map(c=>'• '+(c.emoji||'📅')+' '+c.title+(c.time?' at '+c.time:'')).join('\n');
    const more=conflicts.length>3?`\n…and ${conflicts.length-3} more`:'';
    const ok=confirm('⚠️ This overlaps with:\n\n'+lines+more+'\n\nSave anyway?');
    if(!ok)return;
    ef2._overrideConflict=true; // user confirmed - don't ask again on retry
  }
  try{
    const participantIds=Array.isArray(ef.participantIds)?[...ef.participantIds]:[];
    // Derive legacy fields for backwards compat
    let childId='';
    let adultUid='';
    if(participantIds.length===1){
      const c=S.children.find(ch=>ch.id===participantIds[0]);
      const a=members().find(m=>m.uid===participantIds[0]);
      if(c)childId=participantIds[0];
      else if(a)adultUid=participantIds[0];
    }
    // Pick emoji: sport-specific if it's a sport category, else category emoji
    let saveEmoji=ef.emoji||'📅';
    if((ef.category==='sport-games'||ef.category==='sport-training')&&sportValue){
      saveEmoji=SPORT_EMOJI[sportValue.toLowerCase().trim()]||(ef.category==='sport-games'?'🏆':'🏃');
    }else if(ef.category){
      const cat=EV_CATEGORIES.find(c=>c.id===ef.category);
      if(cat)saveEmoji=cat.emoji;
    }

    // Honour the all-day toggle: skip the time picker entirely when ticked.
    const allDay=document.getElementById('eallday')?.checked||false;
    const timeStr=allDay?'':buildTimeString();

    const eventData={
      title,emoji:saveEmoji,
      participantIds,
      childId,adultUid,
      freq:ef.freq,
      date:ef.freq==='once'?$('edate')?.value:'',
      startDate:ef.freq!=='once'?$('estartdate')?.value||fd(today):'',
      endDate:ef.freq!=='once'?$('eenddate')?.value||'':'',
      days:ef.freq!=='once'?{...ef.days}:{},
      time:timeStr,
      allDay,
      category:ef.category||'',
      sport:sportValue,
      location:$('eloc')?.value?.trim()||'',
      dropoff,pickup,
      packItems:[...ef.packItems],
      notes:$('enotes')?.value?.trim()||''
    };
    const isEdit=!!ef._editId;
    if(isEdit){
      // Update existing event
      await fupd(['events',ef._editId],eventData);
    }else{
      // Create new event
      await fadd(['events'],eventData);
      // Add packing items to all child participants (only on create — edits don't duplicate pack items)
      const childParticipants=participantIds.filter(pid=>S.children.find(c=>c.id===pid));
      for(const cid of childParticipants){
        if(ef.packItems.length){
          for(const item of ef.packItems){try{await fadd(['children',cid,'packing'],{label:item,checked:false,pinned:false,section:'afterschool'});}catch(e){}}
        }
      }
    }
    S.ef={freq:'once',days:{Mon:false,Tue:false,Wed:false,Thu:false,Fri:false,Sat:false,Sun:false},packItems:[],emoji:'📅',category:'',sport:'',participantIds:[]};
    back();notify(isEdit?'Event updated! ✏️':'Event saved! 📅');
  }catch(ex){if(err)err.textContent=ex.message;}
};
window.quickAddEvent=async function(){
  const title=prompt('Quick event — what is it?\n(e.g. "Sam soccer Saturday 10am")');
  if(!title||!title.trim())return;
  // Try to parse date/time from the title
  const text=title.trim();
  let date=todayStr,time='',cleanTitle=text;
  // Day of week
  const dayMatch=text.match(/\b(monday|tuesday|wednesday|thursday|friday|saturday|sunday|mon|tue|wed|thu|fri|sat|sun|tomorrow|today)\b/i);
  if(dayMatch){
    const d=new Date(today);
    const dn=dayMatch[1].toLowerCase().slice(0,3);
    if(dn==='tom'){d.setDate(today.getDate()+1);date=fd(d);}
    else if(dn==='tod'){date=todayStr;}
    else{
      const days=['sun','mon','tue','wed','thu','fri','sat'];
      const target=days.indexOf(dn);
      if(target>=0){
        const cur=today.getDay();
        const diff=(target-cur+7)%7||7;
        d.setDate(today.getDate()+diff);
        date=fd(d);
      }
    }
    cleanTitle=cleanTitle.replace(dayMatch[0],'').trim();
  }
  // Time (e.g. 10am, 3:45pm, 14:30)
  const timeMatch=text.match(/\b(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/i);
  if(timeMatch){
    time=timeMatch[0];
    cleanTitle=cleanTitle.replace(timeMatch[0],'').trim();
  }
  if(!cleanTitle)cleanTitle=title.trim();
  try{
    await fadd(['events'],{title:cleanTitle,emoji:'📅',freq:'once',date,time,days:{},packItems:[],notes:''});
    notify('✅ Event added: '+cleanTitle,'⚡');
  }catch(ex){alert('Error: '+ex.message);}
};
window.dEvent=async id=>{
  const ev=S.events.find(x=>x.id===id);
  if(!ev)return;
  try{
    // Soft-delete: flag the event with deleted:true + timestamp. The onSnapshot
    // splitter routes it to S.deletedEvents, so it disappears from every active
    // view but is kept on the server for restore via the Deleted tile.
    await fupd(['events',id],{deleted:true,deletedAt:Date.now()});
    if(window._pendingUndo&&window._pendingUndo.timer)clearTimeout(window._pendingUndo.timer);
    window._pendingUndo={data:{...ev,id},type:'event'};
    showUndoToast(ev.title+' deleted','event');
  }catch(ex){notify('Delete failed: '+(ex.message||ex),'⚠️');}
};
// Restore a soft-deleted event from the Deleted view
window.restoreEvent=async id=>{
  try{
    await fupd(['events',id],{deleted:false,deletedAt:null});
    notify('Event restored ✅');
  }catch(ex){notify('Restore failed: '+(ex.message||ex),'⚠️');}
};
// Permanently delete a soft-deleted event (hard delete from Firestore)
window.permaDeleteEvent=async id=>{

  if(!ev)return;
  if(!confirm('Permanently delete "'+(ev.title||'event')+'"?\n\nThis cannot be undone.'))return;

};

// Skip a single occurrence of an event on a known date (called from clash sheet).
// For recurring events: adds the date to skipDates. For one-off: soft-deletes.
// After the skip, prompts the user whether they want a reminder to inform someone
// (e.g. the coach, school, friend's parent) that the family member won't attend.
window.skipOccurrenceFromClash=async function(eventId,dateStr,evTitle,isRecurring){
  const ev=S.events.find(x=>x.id===eventId);
  if(!ev){notify('Event not found','⚠️');return;}
  try{
    if(isRecurring===true||isRecurring==='true'){
      const skipDates=Array.isArray(ev.skipDates)?[...ev.skipDates]:[];
      if(!skipDates.includes(dateStr))skipDates.push(dateStr);
      await fupd(['events',eventId],{skipDates});
    }else{
      // One-off: soft-delete the entire event
      await fupd(['events',eventId],{deleted:true,deletedAt:Date.now()});
    }
    document.getElementById('clash-action-overlay')?.remove();
    notify('Skipped on '+dateStr,'✅');
    // Determine the participants for the inform-reminder default text.
    // Inline peopleForEvent because the closure-scoped one in sEvents isn't reachable here.
    const ids=Array.isArray(ev.participantIds)&&ev.participantIds.length?ev.participantIds:[ev.childId,ev.adultUid].filter(Boolean);
    const ppl=ids.map(id=>{
      const c=S.children.find(x=>x.id===id);
      if(c)return {name:c.name};
      const m=members().find(x=>x.uid===id);
      if(m)return {name:m.name};
      return null;
    }).filter(Boolean);
    const personName=ppl.length>0?ppl.map(p=>p.name.split(' ')[0]).join(' & '):'';
    showInformReminderPrompt(evTitle,personName,dateStr);
  }catch(ex){notify('Skip failed: '+(ex.message||ex),'⚠️');}
};

window.runOCR=async function(input){
  if(!input||!input.files||!input.files[0])return;
  const file=input.files[0];
  const status=document.getElementById('ocr-status');
  if(status)status.innerHTML='⏳ Loading OCR engine...';
  try{
    const T=await loadTesseract();
    if(status)status.innerHTML='📖 Reading image (this may take 10-20 seconds)...';
    const r=await T.recognize(file,'eng',{
      logger:m=>{if(m.status==='recognizing text'&&status)status.innerHTML='📖 Reading text... '+Math.round(m.progress*100)+'%';}
    });
    const text=r.data.text;
    if(status)status.innerHTML='✅ Done! Auto-filled below. Review and edit.';
    // Try to extract details
    const lines=text.split(/\n+/).map(l=>l.trim()).filter(l=>l.length>2);
    // Find subject (look for common subjects)
    const subjects=['English','Maths','Mathematics','Science','HASS','PDHPE','Geography','History','Art','Music','Drama','Technology','Japanese','French','Italian'];
    let foundSubject='';
    for(const line of lines){
      for(const s of subjects){if(line.toLowerCase().includes(s.toLowerCase())){foundSubject=s;break;}}
      if(foundSubject)break;
    }
    // Title is usually the longest meaningful early line
    const title=lines.slice(0,5).filter(l=>l.length>10&&l.length<80&&!l.match(/^\d/))[0]||lines[0]||'';
    // Date - look for dd/mm/yyyy or dd Month yyyy patterns
    let foundDate='';
    const dateMatch=text.match(/(\d{1,2})[\/\-\s]+(\d{1,2}|Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec|January|February|March|April|May|June|July|August|September|October|November|December)[\/\-\s]+(\d{2,4})/i);
    if(dateMatch){
      const day=dateMatch[1].padStart(2,'0');
      let month=dateMatch[2];
      const year=dateMatch[3].length===2?'20'+dateMatch[3]:dateMatch[3];
      const monthMap={jan:'01',feb:'02',mar:'03',apr:'04',may:'05',jun:'06',jul:'07',aug:'08',sep:'09',oct:'10',nov:'11',dec:'12'};
      const mLower=month.toLowerCase().slice(0,3);
      if(monthMap[mLower])month=monthMap[mLower];
      else month=String(month).padStart(2,'0');
      foundDate=year+'-'+month+'-'+day;
    }
    // Auto-fill
    if(foundSubject)document.getElementById('asubj').value=foundSubject;
    if(title&&title.length<80)document.getElementById('atitle').value=title;
    if(foundDate)document.getElementById('adue').value=foundDate;
    document.getElementById('anotes').value=text.substring(0,500);
  }catch(ex){
    if(status)status.innerHTML='❌ OCR failed: '+ex.message+' — please enter manually';
  }
};

      const{id,...data}=u.data;
      await fadd(['groceries'],data);

      // Soft-delete: the event still exists in Firestore, just flagged.

      await fupd(['events',u.data.id],{deleted:false,deletedAt:null});
