          </div>
        </div>
        <div class="scroll-view" style="padding:14px 16px 100px">
          ${pastOneoffs.length===0?`<div style="text-align:center;padding:40px 20px;color:var(--text-secondary);font-size:14px">No past one-offs.</div>`:`<div class="card" style="opacity:0.85">${pastOneoffs.map((ev,i)=>eventRow(ev,i,pastOneoffs.length)).join('')}</div>`}
        </div>`;
    }

    // Deleted category: show soft-deleted events with Restore + Permanently delete actions.
    // Mirrors the Past view structure but uses S.deletedEvents (populated by the
    // onSnapshot splitter) and exposes per-row recovery controls. No FAB — this view
    // is for managing already-deleted items, not creating new ones.
    if(catId==='deleted'){
      const dEvs=(S.deletedEvents||[]).slice();
      const fmtDeletedDate=ts=>{
        if(!ts)return '';
        const d=new Date(ts);const today=new Date();today.setHours(0,0,0,0);
        const diffDays=Math.floor((today.getTime()-d.getTime())/86400000);
        if(diffDays<=0)return 'Today';
        if(diffDays===1)return 'Yesterday';
        if(diffDays<7)return diffDays+' days ago';
        return d.getDate()+' '+MONTHS[d.getMonth()];
      };
      const delRow=(ev,i,total)=>{
        const people=peopleForEvent(ev);
        const col=people[0]?.color||NAVY;
        const personLabel=people.length===0?'Family':people.map(p=>p.name.split(' ')[0]).join(', ');
        const isOnce=!ev.freq||ev.freq==='once';
        const whenLabel=isOnce?(ev.date?formatDateShort(ev.date):''):formatDays(ev);
        return `<div style="border-bottom:${i<total-1?'1px solid var(--row-border)':'none'};padding:12px 14px;display:flex;flex-direction:column;gap:8px">
          <div style="display:flex;align-items:center;gap:10px">
            <div style="width:32px;height:32px;border-radius:16px;background:${col}18;border:2px solid ${col};display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0">${ev.emoji||'📅'}</div>
            <div style="flex:1;min-width:0">
              <div style="font-size:14px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${ev.title||'Event'}</div>
              <div style="font-size:12px;color:var(--text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${whenLabel?whenLabel+' · ':''}${personLabel}</div>
              <div style="font-size:11px;color:#FF3B30;font-weight:500;margin-top:2px">Deleted ${fmtDeletedDate(ev.deletedAt)}</div>
            </div>
          </div>
          <div style="display:flex;gap:8px">
            <button onclick="restoreEvent('${ev.id}')" style="flex:1;padding:9px;border-radius:9px;background:#34C759;border:none;color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit">↶ Restore</button>
            <button onclick="permaDeleteEvent('${ev.id}')" style="flex:1;padding:9px;border-radius:9px;background:#FF3B30;border:none;color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit">🗑️ Delete forever</button>
          </div>
        </div>`;
      };
      return `
        <div style="background:var(--card);padding:14px 16px 12px;border-bottom:1px solid var(--row-border);position:sticky;top:0;z-index:10">
          <div style="display:flex;align-items:center;gap:10px">
            <button onclick="S.evView='tiles';render()" style="padding:6px 10px;border-radius:8px;border:none;background:var(--bg);color:var(--text);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit">‹ Events</button>
            <div style="flex:1"></div>
          </div>
          <div style="display:flex;align-items:center;gap:10px;margin-top:10px">
            <div style="width:42px;height:42px;border-radius:21px;background:${cat.color}18;border:2px solid ${cat.color};display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0">${cat.emoji}</div>
            <div style="flex:1;min-width:0">
              <div style="font-size:22px;font-weight:800;color:var(--text);line-height:1.2">Deleted</div>
              <div style="font-size:12px;color:var(--text-secondary)">${dEvs.length} item${dEvs.length===1?'':'s'} · restore or remove permanently</div>
            </div>
          </div>

        <div class="scroll-view" style="padding:14px 16px 100px">
          ${dEvs.length===0?`<div style="text-align:center;padding:40px 20px;color:var(--text-secondary);font-size:14px">Nothing deleted.<br><span style="font-size:12px;opacity:0.8">Deleted events appear here so you can restore them if you change your mind.</span></div>`:`<div class="card">${dEvs.map((ev,i)=>delRow(ev,i,dEvs.length)).join('')}</div>`}
        </div>`;
    }

    // Other categories: simple event list
    const filtered=activeEvents.filter(ev=>(ev.category||'other')===catId)
      .sort((a,b)=>parseTimeToMinutes(a.time)-parseTimeToMinutes(b.time));
    return `
      <div style="background:var(--card);padding:14px 16px 12px;border-bottom:1px solid var(--row-border);position:sticky;top:0;z-index:10">
        <div style="display:flex;align-items:center;gap:10px">
          <button onclick="S.evView='tiles';render()" style="padding:6px 10px;border-radius:8px;border:none;background:var(--bg);color:var(--text);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit">‹ Events</button>
          <div style="flex:1"></div>
        </div>
        <div style="display:flex;align-items:center;gap:10px;margin-top:10px">
          <div style="width:42px;height:42px;border-radius:21px;background:${cat.color}18;border:2px solid ${cat.color};display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0">${cat.emoji}</div>
          <div style="flex:1;min-width:0">
            <div style="font-size:22px;font-weight:800;color:var(--text);line-height:1.2">${cat.label}</div>
            <div style="font-size:12px;color:var(--text-secondary)">${filtered.length} event${filtered.length===1?'':'s'}</div>
          </div>
        </div>
      </div>
      <div class="scroll-view" style="padding:14px 16px 100px">
        ${filtered.length===0?`<div style="text-align:center;padding:40px 20px;color:var(--text-secondary);font-size:14px">No ${cat.label.toLowerCase()} events yet.</div>`:`<div class="card">${filtered.map((ev,i)=>eventRow(ev,i,filtered.length)).join('')}</div>`}
      </div>
      <div class="fab"><button class="fab-btn" style="background:#1C3A6B" onclick="go('addEvent')">+</button></div>`;
  }

  // ========== VIEW: TILES (default home) ==========
  // Compute counts
  const counts={};
  EV_CATEGORIES.forEach(c=>{counts[c.id]=0;});
  activeEvents.forEach(ev=>{
    const k=ev.category||'other';
    if(counts[k]!==undefined)counts[k]++;
    else counts.other++;
  });
  counts.past=pastOneoffs.length;
  counts.deleted=(S.deletedEvents||[]).length;

  return `
    <div style="background:var(--card);padding:14px 16px 12px;border-bottom:1px solid var(--row-border);position:sticky;top:0;z-index:10">
      <div style="font-size:26px;font-weight:800;color:var(--text);margin-bottom:10px">Events</div>
      <!-- Search bar: filters across event title, location, and participant first names.
           Two-way bound via S.evSearch so the value persists across re-renders. The
           debounced oninput re-renders on every keystroke so results update live.
           Clearing the box (× button) returns the user to the normal tiles view. -->
      <div style="position:relative">
        <input id="ev-search" type="search" value="${(S.evSearch||'').replace(/"/g,'&quot;')}" placeholder="🔍 Search events…" oninput="S.evSearch=this.value;S._evSearchCaret=this.selectionStart;clearTimeout(window._evSearchT);window._evSearchT=setTimeout(()=>{render();const i=document.getElementById('ev-search');if(i){i.focus();try{i.setSelectionRange(S._evSearchCaret||i.value.length,S._evSearchCaret||i.value.length)}catch(e){}}},150)" style="width:100%;padding:9px 36px 9px 12px;border-radius:9px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-family:inherit;font-size:13px;box-sizing:border-box"/>
        ${S.evSearch?`<button onclick="S.evSearch='';render();setTimeout(()=>document.getElementById('ev-search')?.focus(),0)" style="position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-secondary);font-size:18px;cursor:pointer;padding:4px 8px;line-height:1">×</button>`:''}
      </div>
    </div>
    ${(()=>{
      // Search-results view: when the user has typed something, show a flat list of
      // matching events instead of the tiles+import sections. Searches title,
      // location, and participant first names; case-insensitive.
      const q=(S.evSearch||'').trim().toLowerCase();
      if(!q)return '';
      // Search across BOTH active + past, so users can find old events too.
      const matches=[...activeEvents,...pastOneoffs].filter(ev=>{
        if(String(ev.title||'').toLowerCase().includes(q))return true;
        if(String(ev.location||'').toLowerCase().includes(q))return true;
        const ppl=peopleForEvent(ev);
        if(ppl.some(p=>p.name.toLowerCase().includes(q)))return true;
        return false;
      });
      return `<div class="scroll-view" style="padding:14px 16px 100px">
        <div class="sh" style="padding:0;margin-bottom:8px">${matches.length} result${matches.length===1?'':'s'} for "${q.replace(/</g,'&lt;')}"</div>
        ${matches.length===0
          ?`<div style="text-align:center;padding:40px 20px;color:var(--text-secondary);font-size:14px">No events match.<br><span style="font-size:12px;opacity:0.8">Try fewer letters, a child's first name, or a venue.</span></div>`
          :`<div class="card">${matches.map((ev,i)=>eventRow(ev,i,matches.length)).join('')}</div>`}
        <div class="fab"><button class="fab-btn" style="background:#1C3A6B" onclick="go('addEvent')">+</button></div>
      </div>`;
    })()}
    ${(S.evSearch||'').trim()?'':`<div class="scroll-view" style="padding:14px 16px 100px">

      <!-- Quick add one-off -->
      <button onclick="go('addEvent')" style="width:100%;padding:14px;border-radius:14px;background:var(--navy);border:none;color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;margin-bottom:18px;display:flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 2px 8px rgba(28,58,107,0.15)">+ Add Event</button>

      <!-- IMPORT TOOLS -->
      <div class="sh" style="padding:0;margin-bottom:8px">IMPORT EVENTS</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:22px">
        <!-- Spreadsheet tile removed — AI fixtures + voice + email forwarding cover the bulk-add cases -->
        <div onclick="go('fixturesImport')" style="background:var(--card);border:1px dashed var(--border);border-radius:14px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:96px">
          <div style="font-size:24px">🏊</div>
          <div style="font-size:14px;font-weight:700;color:var(--text);line-height:1.25">Sport Fixtures</div>
          <div style="font-size:11px;color:var(--text-secondary);line-height:1.4">Import from URL or PDF.</div>
        </div>
        <div onclick="go('timetableImport')" style="background:var(--card);border:1px dashed var(--border);border-radius:14px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:96px">
          <div style="font-size:24px">📚</div>
          <div style="font-size:14px;font-weight:700;color:var(--text);line-height:1.25">School Timetable</div>
          <div style="font-size:11px;color:var(--text-secondary);line-height:1.4">Pick subjects to track. Weekly or fortnightly.</div>
        </div>
        <div onclick="go('emailImport')" style="background:var(--card);border:1px dashed var(--border);border-radius:14px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:96px">
          <div style="font-size:24px">📧</div>
          <div style="font-size:14px;font-weight:700;color:var(--text);line-height:1.25">From Email</div>
          <div style="font-size:11px;color:var(--text-secondary);line-height:1.4">Paste a school email — auto-extract dates.</div>
        </div>
      </div>

      <!-- CATEGORY TILES -->
      <div class="sh" style="padding:0;margin-bottom:10px">CATEGORIES</div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px 4px;margin-bottom:18px">
        ${EV_CATEGORIES.map(c=>{
          const count=counts[c.id]||0;
          return `<div onclick="S.evView='category';S.evCategory='${c.id}';render()" style="display:flex;flex-direction:column;align-items:center;cursor:pointer;padding:4px 2px">
            <div style="width:74px;height:74px;border-radius:37px;background:${c.color}18;border:3px solid ${c.color};display:flex;align-items:center;justify-content:center;font-size:30px;margin-bottom:6px;box-shadow:0 2px 8px ${c.color}22">${c.emoji}</div>

// Lazy-load SheetJS only when actually needed (saves bandwidth on initial load)
let _xlsxLoadPromise=null;
function loadSheetJS(){
  if(typeof XLSX!=='undefined')return Promise.resolve();
  if(_xlsxLoadPromise)return _xlsxLoadPromise;
  _xlsxLoadPromise=new Promise((resolve,reject)=>{
    const s=document.createElement('script');
    s.src='https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js';
    s.onload=()=>resolve();
    s.onerror=()=>reject(new Error('Failed to load spreadsheet library'));
    document.head.appendChild(s);
  });
  return _xlsxLoadPromise;
}

// Map a "Type" cell value to the canonical category id
function typeToCategory(typeStr){
  const t=String(typeStr||'').trim().toLowerCase();
  const map={
    'game':'sport-games','games':'sport-games','match':'sport-games','fixture':'sport-games',
    'training':'sport-training','practice':'sport-training','drill':'sport-training','drills':'sport-training','squad':'sport-training','lesson':'sport-training','class':'sport-training',
    'school':'school','schoolevent':'school','school event':'school','assembly':'school','excursion':'school','incursion':'school',
    'music':'music','work':'work','social':'social','medical':'medical','other':'other'
  };
  return map[t]||'';
}

// Parse a date string (YYYY-MM-DD or Excel serial number) into YYYY-MM-DD
function normalizeDateCell(v){
  if(!v&&v!==0)return '';
  if(v instanceof Date){
    if(isNaN(v.getTime()))return '';
    return fd(v);
  }
  if(typeof v==='number'){
    // Excel serial date: days since 1899-12-30
    const d=new Date(Math.round((v-25569)*86400*1000));
    if(isNaN(d.getTime()))return '';
    return fd(d);
  }
  const s=String(v).trim();
  // Already YYYY-MM-DD?
  if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;
  // Try parsing as Date
  const d=new Date(s);
  if(!isNaN(d.getTime()))return fd(d);
  return '';
}

// Parse "Mon,Wed,Fri" into {Mon:true,Wed:true,Fri:true}
function parseDaysCell(v){
  const days={Mon:false,Tue:false,Wed:false,Thu:false,Fri:false,Sat:false,Sun:false};
  if(!v)return days;
  String(v).split(/[,;\/\s]+/).forEach(t=>{
    const k=t.trim().slice(0,3);
    const cap=k.charAt(0).toUpperCase()+k.slice(1).toLowerCase();
    if(days.hasOwnProperty(cap))days[cap]=true;
  });
  return days;
}

// Parse a "Participants" cell ("Alby, Hattie") into participantIds
function resolveParticipants(v){
  if(!v)return {ids:[],unresolved:[]};
  const names=String(v).split(/[,;]+/).map(s=>s.trim()).filter(Boolean);
  const ids=[];
  const unresolved=[];
  names.forEach(n=>{
    const lower=n.toLowerCase();
    const c=S.children.find(x=>(x.name||'').toLowerCase()===lower||(x.name||'').toLowerCase().split(' ')[0]===lower);
    if(c){ids.push(c.id);return;}
    const m=members().find(x=>(x.name||'').toLowerCase()===lower||(x.name||'').toLowerCase().split(' ')[0]===lower);
    if(m){ids.push(m.uid);return;}
    unresolved.push(n);
  });
  return {ids,unresolved};
}

// Parse the uploaded file. Returns {rows: [{event, errors[], warnings[]}], totalRows, fileName}
async function parseSpreadsheetFile(file){
  await loadSheetJS();
  const buf=await file.arrayBuffer();
  const wb=XLSX.read(buf,{type:'array',cellDates:true});
  // Use first sheet, or "Events" if it exists
  const sheetName=wb.SheetNames.find(n=>n.toLowerCase()==='events')||wb.SheetNames[0];
  const ws=wb.Sheets[sheetName];
  if(!ws)throw new Error('Spreadsheet has no readable sheet');
  const json=XLSX.utils.sheet_to_json(ws,{defval:'',raw:false});

  const parsed=[];
  json.forEach((row,idx)=>{
    // Try multiple header variants
    const get=keys=>{
      for(const k of keys){
        for(const rk of Object.keys(row)){
          if(rk.trim().toLowerCase()===k.toLowerCase())return row[rk];
        }
      }
      return '';
    };

    const title=String(get(['Title','Event','Name'])||'').trim();
    // Skip totally blank rows silently
    if(!title&&!get(['Type'])&&!get(['Date']))return;

    const errors=[];
    const warnings=[];
    if(!title)errors.push('Title is required');

    const typeRaw=String(get(['Type','Category'])||'').trim();
    const category=typeToCategory(typeRaw);
    if(!typeRaw)errors.push('Type is required');
    else if(!category)errors.push('Type "'+typeRaw+'" not recognised — use Game, Training, School, Music, Work, Social, Medical, or Other');

    const sport=String(get(['Sport'])||'').trim();
    if((category==='sport-games'||category==='sport-training')&&!sport){
      errors.push('Sport is required when Type is '+typeRaw);
    }

    const freqRaw=String(get(['Frequency','Freq','Repeat'])||'').trim().toLowerCase();
    let freq='once';
    if(freqRaw==='once'||freqRaw==='one-off'||freqRaw==='one off'||freqRaw==='single')freq='once';
    else if(freqRaw==='weekly'||freqRaw==='week')freq='weekly';
    else if(freqRaw==='fortnightly'||freqRaw==='fortnight'||freqRaw==='biweekly'||freqRaw==='bi-weekly')freq='fortnightly';
    else if(freqRaw==='daily'||freqRaw==='day')freq='daily';
    else if(!freqRaw){errors.push('Frequency is required');}
    else{errors.push('Frequency "'+freqRaw+'" not recognised — use Once, Weekly, or Fortnightly');}

    let date='';
    const days={Mon:false,Tue:false,Wed:false,Thu:false,Fri:false,Sat:false,Sun:false};
    let startDate='';
    let endDate='';
    if(freq==='once'){
      date=normalizeDateCell(get(['Date']));
      if(!date)errors.push('Date required for Once events (format YYYY-MM-DD)');
    }else if(freq!=='once'&&!errors.length){
      const parsedDays=parseDaysCell(get(['Days','Day']));
      Object.assign(days,parsedDays);
      if(!Object.values(days).some(Boolean)){
        errors.push('Days required for recurring events (e.g. "Mon,Wed,Fri")');
      }
      startDate=normalizeDateCell(get(['Start Date','StartDate','From']))||fd(new Date());
      endDate=normalizeDateCell(get(['End Date','EndDate','Until','To']))||'';
    }

    const time=String(get(['Time','When'])||'').trim();
    const location=String(get(['Location','Where','Venue'])||'').trim();
    const dropoff=String(get(['Drop-off','Dropoff','Drop off','DropOff'])||'').trim();
    const pickup=String(get(['Pick-up','Pickup','Pick up','PickUp'])||'').trim();
    const notes=String(get(['Notes','Note','Comments'])||'').trim();

    const partRaw=String(get(['Participants','Participant','People','Who','For'])||'').trim();
    const part=resolveParticipants(partRaw);
    if(part.unresolved.length){
      warnings.push('Couldn\'t match: '+part.unresolved.join(', ')+' — these will be saved without people linked');
    }

    parsed.push({
      idx:idx+2, // account for header row + 1-indexed
      event:{
        title,category,sport,freq,date,days,startDate,endDate,time,
        location,dropoff,pickup,
        participantIds:part.ids,
        notes,
        emoji:category==='sport-games'||category==='sport-training'?(SPORT_EMOJI[sport.toLowerCase().trim()]||'⚽'):'📅'
      },
      errors,warnings,
      rawType:typeRaw
    });
  });

  return {rows:parsed,fileName:file.name};
}

// Wire up the upload input handler
window.handleSpreadsheetUpload=async function(input){
  if(!input?.files?.[0])return;
  const file=input.files[0];
  if(!/\.(xlsx|xls|csv)$/i.test(file.name)){
    notify('Please upload an .xlsx, .xls, or .csv file','⚠️');
    return;
  }
  try{
    notify('Reading file…','📂');
    const result=await parseSpreadsheetFile(file);
    if(!result.rows.length){
      notify('No event rows found in this file. Make sure data starts at row 2 with the right headers.','⚠️');
      return;
    }
    S.spreadsheetPreview=result;
    go('spreadsheetPreview');
  }catch(ex){
    notify('Couldn\'t read file: '+(ex.message||ex),'❌');
  }finally{
    if(input)input.value=''; // allow re-upload of same file
  }
};

// Bulk-import valid rows. Skips rows with errors. Auto-grows family.sports.
window.commitSpreadsheetImport=async function(){
  const data=S.spreadsheetPreview;
  if(!data||!Array.isArray(data.rows)){notify('Nothing to import','⚠️');return;}
  const valid=data.rows.filter(r=>r.errors.length===0);
  if(valid.length===0){notify('No valid rows to import — fix errors and re-upload','⚠️');return;}
  if(!S.familyId){notify('No family loaded','⚠️');return;}

  const btn=document.getElementById('commit-import-btn');
  if(btn){btn.disabled=true;btn.textContent='Importing…';}
  let success=0;
  let failed=0;
  // Collect new sports to add to family.sports
  const newSports=new Set();
  const existingSports=new Set((Array.isArray(S.family?.sports)?S.family.sports:[]).map(s=>s.toLowerCase()));

  for(const row of valid){
    const ev=row.event;
    if(ev.sport&&!existingSports.has(ev.sport.toLowerCase()))newSports.add(ev.sport);
    // Derive legacy childId/adultUid for backwards compat with older code paths
    let childId='',adultUid='';
    if(ev.participantIds.length===1){
      const c=S.children.find(x=>x.id===ev.participantIds[0]);
      const m=members().find(x=>x.uid===ev.participantIds[0]);
      if(c)childId=ev.participantIds[0];
      else if(m)adultUid=ev.participantIds[0];
    }
    try{
      await fadd(['events'],{
        title:ev.title,emoji:ev.emoji,
        participantIds:ev.participantIds,childId,adultUid,
        freq:ev.freq,
        date:ev.date,startDate:ev.startDate,endDate:ev.endDate,
        days:ev.days,
        time:ev.time,
        category:ev.category,sport:ev.sport,
        location:ev.location,dropoff:ev.dropoff,pickup:ev.pickup,
        packItems:[],notes:ev.notes
      });
      success++;
    }catch(e){failed++;console.warn('Import row failed',row,e);}
  }

  // Persist any new sports
  if(newSports.size>0){
    const merged=[...new Set([...(S.family?.sports||[]),...newSports])].sort();
    try{
      await updateDoc(doc(db,'families',S.familyId),{sports:merged});
      if(S.family)S.family.sports=merged;
    }catch(e){}
  }

  S.spreadsheetPreview=null;
  if(failed===0){
    notify('Imported '+success+' event'+(success===1?'':'s')+' ✅','📅');
  }else{
    notify('Imported '+success+' / failed '+failed,'⚠️');
  }
  // Go back to events tab
  S.screen=null;S.tab='events';S.evView='tiles';render();
};

// Lazy-load PDF.js (Mozilla's PDF library, runs entirely client-side)
let _pdfjsLoadPromise=null;
function loadPDFJS(){
  if(typeof window.pdfjsLib!=='undefined')return Promise.resolve();
  if(_pdfjsLoadPromise)return _pdfjsLoadPromise;
  _pdfjsLoadPromise=new Promise((resolve,reject)=>{
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload=()=>{
      // Worker file path — required for PDF.js to actually parse
      window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      resolve();
    };
    s.onerror=()=>reject(new Error('Failed to load PDF library'));
    document.head.appendChild(s);
  });
  return _pdfjsLoadPromise;
}

// Parse loose date strings into YYYY-MM-DD. Returns '' if not parseable.
// Handles: 2026-05-10, 10/05/2026, 10/5/26, "Sat 10 May", "10 May 2026", "10th May", etc.
function parseLooseDate(s){
  if(!s)return '';
  s=String(s).trim();
  // ISO already
  if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);
  // DD/MM/YYYY or DD-MM-YYYY (Australian format default)
  let m=s.match(/^(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{2,4})$/);
  if(m){
    let dy=parseInt(m[1]);let mo=parseInt(m[2]);let yr=parseInt(m[3]);
    if(yr<100)yr+=2000;
    if(dy>=1&&dy<=31&&mo>=1&&mo<=12){
      return yr+'-'+String(mo).padStart(2,'0')+'-'+String(dy).padStart(2,'0');
    }
  }
  // "10 May 2026", "Sat 10 May", "10th May", "Saturday 10 May 2026"
  const monthRe=/(?:\b(?:mon|tue|wed|thu|fri|sat|sun)[a-z]*\.?\s+)?(\d{1,2})(?:st|nd|rd|th)?\s+(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?(?:\s+(\d{2,4}))?/i;
  m=s.match(monthRe);
  if(m){
    const dy=parseInt(m[1]);
    const monthNames=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
    const moIdx=monthNames.indexOf(m[2].toLowerCase().slice(0,3));
    if(dy>=1&&dy<=31&&moIdx>=0){
      let yr=m[3]?parseInt(m[3]):new Date().getFullYear();
      if(yr<100)yr+=2000;
      // If date is well in the past, assume next year (fixture lists are usually future-facing)
      if(!m[3]){
        const tryDate=new Date(yr,moIdx,dy);
        if(tryDate.getTime()<Date.now()-30*86400*1000){yr+=1;}
      }
      return yr+'-'+String(moIdx+1).padStart(2,'0')+'-'+String(dy).padStart(2,'0');
    }
  }
  return '';
}

// Extract a time-of-day string from a cell. Returns normalized like "9:00am" or ''.
function parseLooseTime(s){
  if(!s)return '';
  // 9:00am / 9:00 am / 9 AM / 09:00 / 9.00am
  const m=String(s).match(/\b(\d{1,2})[:\.]?(\d{2})?\s*(am|pm|AM|PM)\b/);
  if(m){
    const h=parseInt(m[1]);
    const min=m[2]?':'+m[2]:'';
    const ap=m[3].toLowerCase();
    return h+min+ap;
  }
  // 24-hour: 09:00, 14:30
  const m2=String(s).match(/\b([01]?\d|2[0-3]):([0-5]\d)\b/);
  if(m2){
    let h=parseInt(m2[1]);const min=m2[2];
    const ap=h>=12?'pm':'am';
    if(h===0)h=12;else if(h>12)h-=12;
    return h+':'+min+ap;
  }
  return '';
}

// Page-footer / pagination noise to skip
const FIXTURE_NOISE_PATTERNS=[
  /^page\s+\d+\s+of\s+\d+$/i,
  /^\d+\s*\/\s*\d+$/, // "1 / 13"
  /^last\s+updated/i,
  /^season\s+\d+/i,
  /^round\s+\d+\s*$/i, // standalone round headers
  /^sponsored\s+by/i,
  /^©|copyright|all rights reserved/i,
  /^view\s+all|^show\s+more|^load\s+more/i
];
function isFixtureNoise(s){
  if(!s)return true;
  const trimmed=String(s).trim();
  if(trimmed.length<2)return true;
  return FIXTURE_NOISE_PATTERNS.some(p=>p.test(trimmed));
}

// Parse an array of "cells" (strings) into a fixture object, or null if not a fixture.
// myTeamName (optional): user's team name. When set, only rows containing this team
// are returned, and the OTHER team in the row is treated as the opponent.
function parseRowAsFixture(cells,myTeamName){
  if(!cells||cells.length<2)return null;
  // Skip totally empty
  const nonEmpty=cells.filter(c=>c&&c.trim());
  if(nonEmpty.length<2)return null;
  // Filter noise rows (page numbers, copyright lines, etc.)
  if(nonEmpty.every(isFixtureNoise))return null;
  if(nonEmpty.some(c=>FIXTURE_NOISE_PATTERNS.some(p=>p.test(String(c).trim()))) && nonEmpty.length<=2)return null;

  // Find date-like cell
  let dateStr='';let dateIdx=-1;
  for(let i=0;i<cells.length;i++){
    const d=parseLooseDate(cells[i]);
    if(d){dateStr=d;dateIdx=i;break;}
  }
  // Try concatenating short adjacent cells (PDFs sometimes split "Sat" / "10" / "May" / "2026")
  if(!dateStr){
    for(let i=0;i<cells.length-1;i++){
      const combined=cells[i]+' '+cells[i+1]+(cells[i+2]?' '+cells[i+2]:'')+(cells[i+3]?' '+cells[i+3]:'');
      const d=parseLooseDate(combined);
      if(d){dateStr=d;dateIdx=i;break;}
    }
  }
  if(!dateStr)return null;

  // Find time-like cell
  let timeStr='',timeIdx=-1;
  for(let i=0;i<cells.length;i++){
    const t=parseLooseTime(cells[i]);
    if(t){timeStr=t;timeIdx=i;break;}
  }

  // ── TEAM-AWARE PARSING (when user gave us their team name) ──
  if(myTeamName&&myTeamName.trim()){
    const fullTeamLower=myTeamName.toLowerCase().trim();
    // Build a list of "tokens" to match — full string + any non-trivial words.
    // E.g. "Hockey - Norths U14" → ['hockey - norths u14', 'hockey', 'norths', 'u14']
    // This way the user can paste a verbose label but match the simple cell text.
    const stopWords=new Set(['the','a','an','and','or','of','for','to','in','on','at','-','–','—','&','/','\\']);
    const tokens=[fullTeamLower];
    fullTeamLower.split(/[\s\-–—\/&]+/).forEach(t=>{
      if(t&&t.length>=2&&!stopWords.has(t))tokens.push(t);
    });
    // Find any cell whose text contains any of our tokens
    let myCellIdx=-1;
    let matchedToken='';
    for(let i=0;i<cells.length;i++){
      const cellLow=(cells[i]||'').toLowerCase();
      for(const tok of tokens){
        if(cellLow.includes(tok)){myCellIdx=i;matchedToken=tok;break;}
      }
      if(myCellIdx>=0)break;
    }
    if(myCellIdx<0)return null; // doesn't involve this team — skip

    // Find the OTHER team-like cell (not date, not time, not our team, not too short, not pure court name)
    let opponent='';
    let venue='';
    for(let i=0;i<cells.length;i++){
      if(i===dateIdx||i===timeIdx||i===myCellIdx)continue;
      const c=(cells[i]||'').trim();
      if(!c||c.length<2)continue;
      if(isFixtureNoise(c))continue;
      // Court/venue names are short with digits or "field/court/pitch"
      const isVenueLike=/(?:court|field|pitch|oval|pool|gym|rink|diamond|park|centre|arena|complex|stadium|grounds?)/i.test(c)||/^[a-z]+\s*\d+$/i.test(c);
      if(isVenueLike&&!venue){venue=c;continue;}
      // Otherwise treat as opponent (first non-our-team team cell)
      if(!opponent)opponent=c.replace(/^[\W_]+|[\W_]+$/g,'');
    }
    if(!opponent)return null; // need an opponent
    return {date:dateStr,time:timeStr,opponent,venue,raw:cells.join(' | ')};
  }

  // ── GENERIC PARSING (no team name provided) ──
  // Find opponent
  let opponent='';
  // Pattern A: "vs Lions", "v. Lions", "v Lions"
  for(const cell of cells){
    const m=cell.match(/(?:^|\s)v\.?\s*s?\.?\s+(.+?)(?:\s+at\s+|\s+@\s+|$)/i);
    if(m&&m[1].trim().length>1){opponent=m[1].trim();break;}
  }
  // Pattern B: longest-looking name cell that isn't date/time/venue keyword
  if(!opponent){
    const candidates=cells.filter((c,i)=>{
      if(i===dateIdx||i===timeIdx)return false;
      if(!c||c.trim().length<3)return false;
      if(isFixtureNoise(c))return false;
      if(/^(home|away|bye|round|game|match|fixture|tba|tbd)$/i.test(c.trim()))return false;
      return true;
    });
    const teamLikely=candidates.find(c=>!/(?:pool|court|field|oval|park|centre|center|stadium|gym|complex|arena|grounds|club\s+house|sports\s+ground)/i.test(c));
    opponent=teamLikely||candidates[0]||'';
    opponent=opponent.replace(/^[\W_]+|[\W_]+$/g,'');
  }

  // Find venue
  let venue='';
  for(const cell of cells){
    if(cell===opponent)continue;
    if(/(?:pool|court|field|oval|park|centre|center|stadium|gym|complex|arena|grounds|club|sports\s+ground)/i.test(cell)){
      venue=cell.replace(/^[\W_]+|[\W_]+$/g,'');
      break;
    }
  }

  return {date:dateStr,time:timeStr,opponent,venue,raw:cells.join(' | ')};
}

// Parse fixtures from raw HTML. Walks tables + lists.
function parseFixturesFromHTML(html,myTeamName){
  const parser=new DOMParser();
  const doc=parser.parseFromString(html,'text/html');
  const fixtures=[];
  const seen=new Set();

  // Try tables
  const tables=doc.querySelectorAll('table');
  for(const table of tables){
    const rows=table.querySelectorAll('tr');
    for(const tr of rows){
      const cells=[...tr.querySelectorAll('td,th')].map(td=>(td.textContent||'').replace(/\s+/g,' ').trim());
      const f=parseRowAsFixture(cells,myTeamName);
      if(f){
        const key=f.date+'|'+f.time+'|'+f.opponent;
        if(!seen.has(key)){seen.add(key);fixtures.push(f);}
      }
    }
  }

  // Fallback: walk through divs/lists that look like fixture cards
  if(fixtures.length===0){
    const blocks=doc.querySelectorAll('article,li,.fixture,[class*="fixture"],[class*="match"],[class*="game"]');
    for(const b of blocks){
      // Split by line-break-ish boundaries
      const text=(b.textContent||'').replace(/\s*\n\s*/g,'\n').trim();
      const lines=text.split('\n').map(l=>l.trim()).filter(Boolean);
      // Treat lines as cells
      const f=parseRowAsFixture(lines,myTeamName);
      if(f){
        const key=f.date+'|'+f.time+'|'+f.opponent;
        if(!seen.has(key)){seen.add(key);fixtures.push(f);}
      }
    }
  }

  return fixtures;
}

// Parse fixtures from a PDF file. Uses positional Y-coordinate grouping into lines.
async function parseFixturesFromPDF(file,myTeamName){
  await loadPDFJS();
  const buf=await file.arrayBuffer();
  const pdf=await window.pdfjsLib.getDocument({data:buf}).promise;
  const fixtures=[];
  const seen=new Set();

  for(let pageNum=1;pageNum<=pdf.numPages;pageNum++){
    const page=await pdf.getPage(pageNum);
    const content=await page.getTextContent();

    // Group text items by Y coordinate (rounded to nearest 4 pts to allow tolerance)
    const lineMap=new Map();
    for(const item of content.items){
      if(!item.str||!item.str.trim())continue;
      const y=Math.round(item.transform[5]/4)*4;
      if(!lineMap.has(y))lineMap.set(y,[]);
      lineMap.get(y).push({x:item.transform[4],text:item.str.trim()});
    }
    // Iterate top→bottom (Y descending in PDF coords)
    const ys=[...lineMap.keys()].sort((a,b)=>b-a);
    for(const y of ys){
      const items=lineMap.get(y).sort((a,b)=>a.x-b.x);
      // Group items into "cells" by gap-detection (gaps > 10 = cell boundary)
      const cells=[];
      let current=items[0]?items[0].text:'';
      for(let i=1;i<items.length;i++){
        const gap=items[i].x-(items[i-1].x+items[i-1].text.length*4);
        if(gap>10){
          if(current.trim())cells.push(current.trim());
          current=items[i].text;
        }else{
          current+=' '+items[i].text;
        }
      }
      if(current.trim())cells.push(current.trim());
      // Now also try whole-line as one string + split on multi-space
      const wholeLine=cells.join('  ');
      const altCells=wholeLine.split(/\s{2,}|\t+/).map(s=>s.trim()).filter(Boolean);
      const f=parseRowAsFixture(altCells.length>cells.length?altCells:cells,myTeamName)||parseRowAsFixture([wholeLine],myTeamName);
      if(f){
        const key=f.date+'|'+f.time+'|'+f.opponent;
        if(!seen.has(key)){seen.add(key);fixtures.push(f);}
      }
    }
  }
  return fixtures;
}

// Fetch a URL via cloud function (bypasses CORS) and parse fixtures from the HTML
async function fetchAndParseFixturesFromURL(url,myTeamName){
  let resp;
  try{
    const callable=httpsCallable(functions,'fetchSportFixtures');
    resp=await callable({url});
  }catch(ex){
    const msg=ex?.message||'';
    if(/not-found|not\s+exist/i.test(msg)){
      throw new Error('The "fetchSportFixtures" cloud function is not deployed yet. See deployment notes.');
    }
    throw new Error('Couldn\'t fetch URL: '+(msg||'unknown error'));
  }
  const html=resp?.data?.html;
  if(!html)throw new Error('No HTML returned from URL');
  const fixtures=parseFixturesFromHTML(html,myTeamName);
  if(fixtures.length===0){
    if(myTeamName){
      throw new Error('No fixtures found containing team "'+myTeamName+'". Check the spelling, or clear the team field to see all fixtures.');
    }
    throw new Error('Didn\'t spot any fixtures on that page. The page might use an unusual format — try copying the fixtures into the spreadsheet template instead.');
  }
  return fixtures;
}

// Validate the "what's this for?" section before fetching
function validateFixtureSetup(){
  const fi=S.fixtureImport;
  if(!fi)return 'Setup not initialised';
  // Pull live values from inputs (in case user typed since last render)
  const sportInput=document.getElementById('fi-sport-input');
  if(sportInput)fi.sport=sportInput.value.trim();
  const teamInput=document.getElementById('fi-team-input');
  if(teamInput)fi.myTeam=teamInput.value.trim();
  const urlInput=document.getElementById('fi-url-input');

  }
  if(typeof httpsCallable==='undefined'||!functions){
    notify('⚠️ Cloud functions not loaded — refresh the app','❌');
    return;
  }
  fi.busy=true;render();
  const useAI=fi.useAI!==false;
  notify(useAI?('🤖 AI fetching '+(fi.myTeam||'fixtures')+'…'):(fi.myTeam?('Fetching fixtures for '+fi.myTeam+'…'):'Fetching fixtures…'),useAI?'🤖':'🌐');

      console.log('[fixtures] AI returned',aiFixtures.length,'fixtures. Summary:',aiData.summary);

// Helper: extract raw text from a PDF file using PDF.js (for AI parser input)
async function extractRawTextFromPDF(file){
  await loadPDFJS();
  const buf=await file.arrayBuffer();
  const pdf=await window.pdfjsLib.getDocument({data:buf}).promise;
  const lines=[];
  for(let pageNum=1;pageNum<=pdf.numPages;pageNum++){
    const page=await pdf.getPage(pageNum);
    const content=await page.getTextContent();
    // Group items by Y coord to preserve table-row structure
    const lineMap=new Map();
    for(const item of content.items){
      if(!item.str||!item.str.trim())continue;
      const y=Math.round(item.transform[5]/4)*4;
      if(!lineMap.has(y))lineMap.set(y,[]);
      lineMap.get(y).push({x:item.transform[4],text:item.str.trim()});
    }
    const ys=[...lineMap.keys()].sort((a,b)=>b-a);
    for(const y of ys){
      const items=lineMap.get(y).sort((a,b)=>a.x-b.x);
      const joined=items.map(i=>i.text).join('  ');
      if(joined.trim())lines.push(joined);
    }
    lines.push(''); // page break
  }
  return lines.join('\n');
}

// Compress + convert image file to base64 (data URL → strip prefix)
// Resizes to max 1600px width to keep AI cost down + stay under 5MB Anthropic limit
async function imageFileToBase64(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onerror=()=>reject(new Error('Failed to read image'));
    reader.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(new Error('Failed to decode image'));
      img.onload=()=>{
        // Resize if larger than 1600px on longest side — keeps aspect ratio
        const MAX=1600;
        let w=img.naturalWidth,h=img.naturalHeight;
        if(w>MAX||h>MAX){
          if(w>=h){h=Math.round(h*(MAX/w));w=MAX;}
          else{w=Math.round(w*(MAX/h));h=MAX;}
        }
        const canvas=document.createElement('canvas');
        canvas.width=w;canvas.height=h;
        const ctx=canvas.getContext('2d');
        ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h); // white background for transparency
        ctx.drawImage(img,0,0,w,h);
        // Always output as JPEG @ 85% quality — much smaller than PNG, AI handles it fine
        const dataUrl=canvas.toDataURL('image/jpeg',0.85);
        const base64=dataUrl.split(',')[1];
        resolve({base64,mediaType:'image/jpeg',width:w,height:h,sizeKB:Math.round(base64.length*0.75/1024)});
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}

window.updateFixture=function(id,field,value){
  const data=S.fixturePreview;
  if(!data)return;
  const f=data.fixtures.find(x=>x.id===id);
  if(!f)return;
  f[field]=value;
  // Re-render so the auto-built title and date validity update live
  if(field==='date'||field==='opponent'||field==='venue')render();
};
window.removeFixture=function(id){
  const data=S.fixturePreview;
  if(!data)return;
  const f=data.fixtures.find(x=>x.id===id);
  if(f){f._removed=true;render();}
};
window.restoreFixture=function(id){
  const data=S.fixturePreview;
  if(!data)return;
  const f=data.fixtures.find(x=>x.id===id);
  if(f){f._removed=false;render();}
};

window.commitFixturesImport=async function(){
  const data=S.fixturePreview;
  const fi=S.fixtureImport;
  if(!data||!fi){notify('Nothing to import','⚠️');return;}
  if(!S.familyId){notify('No family loaded','⚠️');return;}
  const valid=data.fixtures.filter(f=>f.date&&!f._removed);
  if(valid.length===0){notify('No valid fixtures to import','⚠️');return;}

  const btn=document.getElementById('commit-fixtures-btn');
  if(btn){btn.disabled=true;btn.textContent='Importing…';}

  // Auto-grow family.sports
  const existingSports=Array.isArray(S.family?.sports)?S.family.sports:[];
  if(fi.sport&&!existingSports.some(s=>s.toLowerCase()===fi.sport.toLowerCase())){
    try{
      const merged=[...existingSports,fi.sport].sort();
      await updateDoc(doc(db,'families',S.familyId),{sports:merged});
      if(S.family)S.family.sports=merged;
    }catch(e){}
  }

  // Build legacy fields
  let childId='',adultUid='';
  if(fi.participantIds.length===1){
    const c=S.children.find(x=>x.id===fi.participantIds[0]);
    const m=members().find(x=>x.uid===fi.participantIds[0]);
    if(c)childId=fi.participantIds[0];
    else if(m)adultUid=fi.participantIds[0];
  }

  const emoji=SPORT_EMOJI[fi.sport.toLowerCase().trim()]||(fi.type==='sport-games'?'🏆':'🏃');
  const oppositionLabel=fi.type==='sport-games'?'vs':'·';

  let success=0;let failed=0;
  for(const f of valid){
    const opponentText=(f.opponent||'').replace(/^[\W_]+|[\W_]+$/g,'');
    const titleParts=[fi.sport];
    if(opponentText)titleParts.push(oppositionLabel,opponentText);
    const title=titleParts.join(' ');
    try{
      await fadd(['events'],{
        title,emoji,
        participantIds:[...fi.participantIds],childId,adultUid,
        freq:'once',
        date:f.date,
        startDate:'',endDate:'',
        days:{Mon:false,Tue:false,Wed:false,Thu:false,Fri:false,Sat:false,Sun:false},
        time:f.time||'',
        category:fi.type,
        sport:fi.sport,
        location:f.venue||'',
        dropoff:'',pickup:'',
        packItems:[],
        notes:''
      });
      success++;
    }catch(e){failed++;console.warn('Fixture import failed',f,e);}
  }

  S.fixturePreview=null;
  S.fixtureImport=null;
  if(failed===0){notify('Imported '+success+' fixture'+(success===1?'':'s')+' ✅','📅');}
  else{notify('Imported '+success+' / failed '+failed,'⚠️');}
  S.screen=null;S.tab='events';S.evView='tiles';render();
};

// SCHOOL TIMETABLE IMPORT — upload PDF/image of a school timetable,
// pick which subjects to track, bulk-create recurring events

// Mirrors the fixture import flow: same upload UX, same AI cloud function
// pattern, same preview-then-import structure. Differences:

//   - Weekly OR fortnightly cycle (school timetables often run "Week A / B")
//   - Subject picker — parents tick which subjects HomeBase should track.
//     A typical school week has 25-30 lessons; most parents only care about
//     PE (uniform), Library (book return), Music (instrument), etc.
//   - Output: one recurring event per ticked subject (FREQ=weekly or fortnightly)

function sTimetableImport(){
  if(!S.timetableImport){
    // Pre-select the first child if there's only one in the family
    const onlyChild=(S.children||[]).length===1?S.children[0].id:'';

      childId:onlyChild,
      cycle:'weekly', // 'weekly' or 'fortnightly'
      uploadWeek:'A', // 'A' or 'B' — which week is the uploaded timetable showing?
      weekAStart:'', // ISO date — Monday matching uploadWeek
      busy:false
    };
  }
  const ti=S.timetableImport;
  const child=ti.childId?(S.children||[]).find(c=>c.id===ti.childId):null;

  return `
    <div style="min-height:100%;display:flex;flex-direction:column;background:var(--bg)">
      <div style="background:var(--card);padding:14px 16px;display:flex;align-items:center;border-bottom:1px solid var(--row-border);position:sticky;top:0;z-index:10">

        <div style="width:60px"></div>
      </div>
      <div class="scroll-view" style="padding:18px 16px 80px;max-width:560px;margin:auto;width:100%">

        <div style="text-align:center;margin-bottom:24px">
          <div style="font-size:54px;margin-bottom:6px">📚</div>
          <div style="font-size:20px;font-weight:800;color:var(--text);margin-bottom:6px">Import a school timetable</div>
          <div style="font-size:13px;color:var(--text-secondary);line-height:1.55">Upload your child's timetable. HomeBase reads<br>the subjects — you pick which ones to track.</div>
        </div>

        <!-- Step 1: WHICH CHILD? -->
        <div style="background:var(--card);border-radius:14px;padding:18px;margin-bottom:14px;border:1px solid var(--row-border)">
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
            <div style="width:28px;height:28px;border-radius:14px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;flex-shrink:0">1</div>
            <div style="font-size:15px;font-weight:700;color:var(--text)">Whose timetable?</div>
          </div>
          ${(S.children||[]).length===0?'<div style="font-size:13px;color:var(--text-secondary);background:var(--bg);border-radius:9px;padding:12px;line-height:1.5">No children yet — add one from the Family tab first.</div>':`
          <div style="display:flex;flex-wrap:wrap;gap:8px">
            ${S.children.map(c=>{
              const col=c.color||NAVY;
              const on=ti.childId===c.id;
              return `<button onclick="S.timetableImport.childId='${c.id}';render()" class="freq-btn ${on?'on':''}" style="padding:8px 14px;font-size:13px;border-color:${col};${on?`background:${col};color:#fff`:''}">${c.name.split(' ')[0]}</button>`;
            }).join('')}
          </div>`}
        </div>

        <!-- Step 2: WEEKLY OR FORTNIGHTLY? -->
        <div style="background:var(--card);border-radius:14px;padding:18px;margin-bottom:14px;border:1px solid var(--row-border)">
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
            <div style="width:28px;height:28px;border-radius:14px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;flex-shrink:0">2</div>
            <div style="font-size:15px;font-weight:700;color:var(--text)">Timetable cycle</div>
          </div>
          <div style="display:flex;gap:8px;margin-bottom:14px">
            <button onclick="S.timetableImport.cycle='weekly';render()" class="freq-btn ${ti.cycle==='weekly'?'on':''}" style="flex:1;padding:10px">📅 Weekly</button>
            <button onclick="S.timetableImport.cycle='fortnightly';render()" class="freq-btn ${ti.cycle==='fortnightly'?'on':''}" style="flex:1;padding:10px">🔁 Fortnightly</button>
          </div>
          ${ti.cycle==='fortnightly'?(()=>{
            // Try to suggest an anchor from saved term dates. If any term has
            // a start date and a week marker (A or B), use it as the reference
            // point and project forward to the next Monday matching the
            // user's chosen current week. This is the auto-pick the user can
            // override if they want.
            const today=new Date();today.setHours(0,0,0,0);
            const td=S.termDates||{};
            let suggestion='';
            let suggestionReason='';
            for(const tk of ['t1','t2','t3','t4']){
              const ts=td[tk+'s'];const tw=td[tk+'w']||'A';
              if(!ts)continue;
              const termStart=new Date(ts+'T12:00');
              if(!Number.isFinite(termStart.getTime()))continue;
              // Find the Monday of the term-start week
              const dow=termStart.getDay();
              const mondayOfTermStart=new Date(termStart);
              mondayOfTermStart.setDate(termStart.getDate()-((dow+6)%7));
              // The picked week for THIS upload defaults to A. The anchor we
              // suggest is the next Monday of the user's picked week.
              const wantWeek=ti.uploadWeek||'A';
              // Walk forward week-by-week from term start until we hit a
              // Monday that is the right A/B parity AND in the future.
              let candidate=new Date(mondayOfTermStart);
              let candidateWeek=tw;
              for(let i=0;i<60&&candidate<today;i++){
                candidate.setDate(candidate.getDate()+7);
                candidateWeek=candidateWeek==='A'?'B':'A';
              }
              // If we landed on the wrong week, step one more week forward
              if(candidateWeek!==wantWeek){
                candidate.setDate(candidate.getDate()+7);
                candidateWeek=candidateWeek==='A'?'B':'A';
              }
              if(candidate>=today&&candidateWeek===wantWeek){
                suggestion=fd(candidate);
                const termIdx=parseInt(tk.slice(1),10);
                suggestionReason='from Term '+termIdx+' settings (starts Wk '+tw+')';
                break;
              }
            }
            if(suggestion&&!ti.weekAStart)ti.weekAStart=suggestion;

            return `
            <div style="margin-bottom:14px">
              <div style="font-size:12px;color:var(--text-secondary);margin-bottom:6px;font-weight:600">This timetable shows…</div>
              <div style="display:flex;gap:8px">
                <button onclick="S.timetableImport.uploadWeek='A';S.timetableImport.weekAStart='';render()" class="freq-btn ${upWeek==='A'?'on':''}" style="flex:1;padding:9px">Week A</button>
                <button onclick="S.timetableImport.uploadWeek='B';S.timetableImport.weekAStart='';render()" class="freq-btn ${upWeek==='B'?'on':''}" style="flex:1;padding:9px">Week B</button>
              </div>
            </div>
            <div style="font-size:12px;color:var(--text-secondary);margin-bottom:6px;font-weight:600">Monday of an upcoming Week ${upWeek}</div>
            <input class="input" type="date" value="${ti.weekAStart||''}" onchange="S.timetableImport.weekAStart=this.value;render()" style="margin-bottom:6px"/>
            ${suggestion?`<div style="font-size:11px;color:#34C759;font-weight:600;margin-bottom:6px">✓ Auto-suggested ${suggestionReason}. Change above if you want a different anchor.</div>`:`<div style="font-size:11px;color:var(--text-secondary);line-height:1.45">Tip: if you set School Term Dates (with Week A/B markers) in Settings, HomeBase will auto-suggest this for you next time.</div>`}
          `;})():'<div style="font-size:11px;color:var(--text-secondary);line-height:1.45">Same subjects every week.</div>'}
        </div>

        <!-- Step 3: UPLOAD -->
        <div style="background:var(--card);border-radius:14px;padding:18px;margin-bottom:14px;border:1px solid var(--row-border)">
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
            <div style="width:28px;height:28px;border-radius:14px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;flex-shrink:0">3</div>
            <div style="font-size:15px;font-weight:700;color:var(--text)">Upload the timetable</div>
          </div>

          <div style="font-size:11px;color:#5856D6;background:#5856D614;border:1px solid #5856D633;border-radius:8px;padding:8px 10px;margin-bottom:12px;line-height:1.45">✨ AI reads PDFs, photos, screenshots. Costs ~$0.003 per import.</div>

          <div style="font-size:12px;color:var(--text-secondary);margin-bottom:6px;font-weight:600">📄 From a PDF</div>
          <input type="file" id="tt-pdf" accept=".pdf,application/pdf" style="display:none" onchange="handleTimetablePdfUpload(this)"/>
          <button onclick="document.getElementById('tt-pdf').click()" ${ti.busy?'disabled':''} style="width:100%;padding:13px;border-radius:12px;background:${ti.busy?'#8E8E93':'#AF52DE'};border:none;color:#fff;font-size:14px;font-weight:700;cursor:${ti.busy?'wait':'pointer'};font-family:inherit;margin-bottom:12px">${ti.busy?'⏳ Working…':'Upload PDF'}</button>

          <div style="text-align:center;font-size:11px;color:var(--text-secondary);margin:6px 0">— or —</div>

          <div style="font-size:12px;color:var(--text-secondary);margin-bottom:6px;font-weight:600">📷 From a screenshot or photo</div>
          <input type="file" id="tt-image" accept="image/png,image/jpeg,image/jpg,image/webp" style="display:none" onchange="handleTimetableImageUpload(this)"/>
          <button onclick="document.getElementById('tt-image').click()" ${ti.busy?'disabled':''} style="width:100%;padding:13px;border-radius:12px;background:${ti.busy?'#8E8E93':'linear-gradient(135deg,#AF52DE,#5856D6)'};border:none;color:#fff;font-size:14px;font-weight:700;cursor:${ti.busy?'wait':'pointer'};font-family:inherit">${ti.busy?'⏳ Working…':'Upload Image'}</button>
          <div style="font-size:11px;color:var(--text-secondary);margin-top:6px;line-height:1.4">Take a photo of the printed timetable, or a screenshot of the school portal.</div>

          ${ti.busy?`<div style="background:#AF52DE14;border:1px solid #AF52DE33;border-radius:10px;padding:12px;margin-top:14px;display:flex;align-items:center;gap:10px">

            <div style="font-size:13px;color:#AF52DE;font-weight:600;line-height:1.4">AI is reading the timetable… this usually takes 5–15 seconds</div>

          </div>
        </details>

      </div>
    </div>`;
}

// Validate timetable setup before uploading
function validateTimetableSetup(){
  const ti=S.timetableImport||{};
  if(!ti.childId)return 'Pick a child first';
  if(ti.cycle==='fortnightly'&&!ti.weekAStart)return 'Pick the Monday for Week '+(ti.uploadWeek||'A');
  return null;
}

// === UPLOAD HANDLERS ===
// Both PDF and image upload paths go through parseTimetableWithAI cloud function.
// The function returns a structured timetable: array of subjects, each with
// day(s) and time(s) they occur. For fortnightly, each slot is tagged with
// 'A' or 'B'. We then show the subject picker for parents to opt in.

window.handleTimetablePdfUpload=async function(input){
  if(!input?.files?.[0])return;
  const file=input.files[0];
  const ti=S.timetableImport;
  const errMsg=validateTimetableSetup();
  if(errMsg){notify(errMsg,'⚠️');input.value='';return;}
  if(typeof httpsCallable==='undefined'||!functions){
    notify('⚠️ Cloud functions not loaded — refresh the app','❌');
    return;
  }
  ti.busy=true;render();
  try{
    notify('🤖 AI reading PDF…','📄');
    const pdfText=await extractRawTextFromPDF(file);
    if(!pdfText||pdfText.length<50){
      throw new Error('PDF appears empty or unreadable. Try a different export of the file.');
    }
    const aiCall=httpsCallable(functions,'parseTimetableWithAI');
    const aiResp=await aiCall({
      rawText:pdfText,
      sourceKind:'pdf',
      cycle:ti.cycle,
      familyId:S.familyId||''
    });
    const aiData=aiResp?.data||{};
    const subjects=Array.isArray(aiData.subjects)?aiData.subjects:[];
    ti.busy=false;
    if(subjects.length===0){
      notify('No subjects found in PDF','⚠️');
      render();
      return;
    }

// Per-slot opt-in: a subject like "PE" can occur as Practical (need uniform)
// and Theory (don't). Parents tick individual slots, not the whole subject.
// Subject-level master tick selects/deselects all slots in that subject.
function sTimetablePreview(){
  const data=S.timetablePreview;
  const ti=S.timetableImport;
  if(!data||!ti){
    return `
      <div style="min-height:100%;display:flex;flex-direction:column;background:var(--bg)">
        <div style="background:var(--card);padding:14px 16px;display:flex;align-items:center;border-bottom:1px solid var(--row-border)">
          <button class="back-btn" onclick="back()">${bk()} Back</button>
          <div style="flex:1;text-align:center;font-size:17px;font-weight:600">Preview</div>
          <div style="width:60px"></div>
        </div>
        <div style="padding:60px 20px;text-align:center;color:var(--text-secondary)"><div style="font-size:14px">No timetable loaded.</div></div>
      </div>`;
  }

  const child=(S.children||[]).find(c=>c.id===ti.childId);
  const childName=child?child.name.split(' ')[0]:'Child';
  const childColor=child?.color||NAVY;
  // Count selected slots across all subjects (the real unit of import).
  const allSlots=data.subjects.flatMap(s=>Array.isArray(s.slots)?s.slots:[]);
  const selectedSlotCount=allSlots.filter(sl=>sl._selected).length;

  // Common subjects that parents typically WANT to track (presented as suggestions)
  const TRACK_SUGGESTIONS=['pe','phys ed','physical education','sport','library','music','choir','band','swimming','assembly','chapel','art','drama','french','language','german','japanese','spanish'];
  const looksTrackable=name=>{
    const lower=(name||'').toLowerCase();
    return TRACK_SUGGESTIONS.some(t=>lower.includes(t));
  };

  // Build the visual card for one subject. Always shows each slot as its own
  // tickable row — single-slot subjects naturally render with one row.
  const subjectCard=s=>{
    const slots=Array.isArray(s.slots)?s.slots:[];
    const selectedCount=slots.filter(sl=>sl._selected).length;
    const allSelected=slots.length>0&&selectedCount===slots.length;
    const someSelected=selectedCount>0&&!allSelected;
    const tip=looksTrackable(s.name)?'<span style="font-size:10px;color:'+childColor+';font-weight:700;letter-spacing:0.3px">⭐ OFTEN WORTH TRACKING</span>':'';
    // Master checkbox state: empty, partial (dash), or full (tick)
    const masterIcon=allSelected
      ?'<span style="color:#fff;font-size:14px">✓</span>'
      :someSelected
        ?'<span style="color:#fff;font-size:16px;font-weight:800;line-height:0">−</span>'
        :'';
    const masterBg=allSelected?childColor:someSelected?childColor+'AA':'transparent';
    const masterBorder=allSelected||someSelected?'transparent':childColor+'55';

    // Header row: subject name + master tick. Tap → toggle all slots in this subject.
    const header=`<div onclick="toggleTimetableSubjectMaster('${s.id}')" style="display:flex;align-items:center;gap:12px;padding:13px 14px;cursor:pointer;background:${someSelected||allSelected?childColor+'08':'var(--bg)'};border-bottom:1px solid var(--row-border)">
      <div class="cb" style="background:${masterBg};border-color:${masterBorder};flex-shrink:0">${masterIcon}</div>
      <div style="flex:1;min-width:0">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <div style="font-size:15px;font-weight:800;color:var(--text);line-height:1.2">${s.name||'Subject'}</div>
          <div style="font-size:11px;color:var(--text-secondary);font-weight:600">${slots.length} period${slots.length===1?'':'s'}</div>
        </div>
        ${tip?'<div style="margin-top:3px">'+tip+'</div>':''}
      </div>
    </div>`;

    // Slot rows — one per period. Always indented to show grouping.
    const slotRows=slots.map((sl,idx)=>{
      const on=!!sl._selected;
      const dayStr=sl.day||'?';
      const timeStr=sl.time||'';
      const wkStr=ti.cycle==='fortnightly'&&sl.week?'Wk '+sl.week:'';
      const labelStr=(sl.label||'').trim();
      // Parts shown on the slot row: day · time · week · label
      const parts=[dayStr];
      if(timeStr)parts.push(timeStr);
      if(wkStr)parts.push(wkStr);
      const meta=parts.join(' · ');
      return `<div onclick="toggleTimetableSlot('${s.id}',${idx})" style="display:flex;align-items:center;gap:12px;padding:11px 14px 11px 30px;cursor:pointer;background:${on?childColor+'12':'transparent'};${idx<slots.length-1?'border-bottom:1px solid var(--row-border)':''}">
        <div class="cb" style="${on?'background:'+childColor+';border:none':'border-color:'+childColor+'55'};flex-shrink:0;width:22px;height:22px;border-radius:6px">${on?'<span style="color:#fff;font-size:12px">✓</span>':''}</div>
        <div style="flex:1;min-width:0">
          <div style="font-size:14px;font-weight:600;color:var(--text);line-height:1.2">${meta}</div>
          ${labelStr?`<div style="font-size:11px;color:${childColor};font-weight:700;margin-top:2px">${labelStr}</div>`:''}
        </div>
      </div>`;
    }).join('');

    return `<div style="background:var(--card);border-radius:12px;overflow:hidden;border:1px solid var(--row-border);margin-bottom:10px">
      ${header}
      ${slotRows}
    </div>`;
  };

  // Sort: trackable-suggested first, then alphabetical
  const sortedSubjects=[...data.subjects].sort((a,b)=>{
    const aT=looksTrackable(a.name)?0:1;
    const bT=looksTrackable(b.name)?0:1;
    if(aT!==bT)return aT-bT;
    return (a.name||'').localeCompare(b.name||'');
  });

  return `
    <div style="min-height:100%;display:flex;flex-direction:column;background:var(--bg)">
      <div style="background:var(--card);padding:14px 16px;display:flex;align-items:center;border-bottom:1px solid var(--row-border);position:sticky;top:0;z-index:10">
        <button class="back-btn" onclick="back()">${bk()} Back</button>
        <div style="flex:1;text-align:center;font-size:17px;font-weight:600">Pick periods</div>
        <div style="width:60px"></div>
      </div>
      <div style="background:var(--card);padding:14px 16px;border-bottom:1px solid var(--row-border)">
        <div style="font-size:13px;color:var(--text-secondary);line-height:1.5">Found <strong>${data.subjects.length}</strong> subject${data.subjects.length===1?'':'s'} (${allSlots.length} period${allSlots.length===1?'':'s'}) for <strong>${childName}</strong>'s ${ti.cycle} timetable. Tap individual periods — e.g. select PE Practical but skip PE Theory if there's no uniform needed.</div>
        <div style="margin-top:10px;display:flex;gap:8px">
          <button onclick="selectAllTimetableSuggested()" style="flex:1;padding:9px;border-radius:8px;background:var(--bg);border:1px solid var(--border);color:var(--text);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit">⭐ Pick suggested</button>
          <button onclick="clearAllTimetable()" style="flex:1;padding:9px;border-radius:8px;background:var(--bg);border:1px solid var(--border);color:var(--text);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit">Clear all</button>
        </div>
      </div>
      <div class="scroll-view" style="padding:14px 16px 110px">
        ${sortedSubjects.map(subjectCard).join('')}
      </div>
      <div style="position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--row-border);padding:12px 16px;padding-bottom:max(12px,env(safe-area-inset-bottom));z-index:20">
        <button id="commit-timetable-btn" onclick="confirmTimetableImport()" ${selectedSlotCount===0?'disabled':''} style="width:100%;padding:14px;border-radius:12px;background:${selectedSlotCount===0?'#8E8E93':'var(--navy)'};border:none;color:#fff;font-size:15px;font-weight:700;cursor:${selectedSlotCount===0?'not-allowed':'pointer'};font-family:inherit">${selectedSlotCount===0?'Pick at least one period':'✅ Add '+selectedSlotCount+' period'+(selectedSlotCount===1?'':'s')+' to HomeBase'}</button>
      </div>
    </div>`;
}

// Toggle a single slot (e.g. "PE Mon 9am Practical") on/off.
window.toggleTimetableSlot=function(subjectId,slotIdx){
  const s=S.timetablePreview?.subjects?.find(x=>x.id===subjectId);
  if(!s||!Array.isArray(s.slots)||!s.slots[slotIdx])return;
  s.slots[slotIdx]._selected=!s.slots[slotIdx]._selected;
  render();
};

// Toggle ALL slots in a subject. Master logic: if any slots are off, this
// flips them all on. If all are already on, this clears them.
window.toggleTimetableSubjectMaster=function(subjectId){
  const s=S.timetablePreview?.subjects?.find(x=>x.id===subjectId);
  if(!s||!Array.isArray(s.slots))return;
  const allOn=s.slots.length>0&&s.slots.every(sl=>sl._selected);
  s.slots.forEach(sl=>{sl._selected=!allOn;});
  render();
};

window.selectAllTimetableSuggested=function(){
  const TRACK_SUGGESTIONS=['pe','phys ed','physical education','sport','library','music','choir','band','swimming','assembly','chapel','art','drama','french','language','german','japanese','spanish'];
  (S.timetablePreview?.subjects||[]).forEach(s=>{
    const lower=(s.name||'').toLowerCase();
    if(TRACK_SUGGESTIONS.some(t=>lower.includes(t))){
      (s.slots||[]).forEach(sl=>{sl._selected=true;});
    }
  });
  render();
};

window.clearAllTimetable=function(){
  (S.timetablePreview?.subjects||[]).forEach(s=>{
    (s.slots||[]).forEach(sl=>{sl._selected=false;});
  });
  render();
};

// === FINAL IMPORT ===
// Creates one recurring event per selected slot group. Slots are filtered
// by their individual _selected flag (parents may pick PE Practical but
// skip PE Theory). After filtering, slots are grouped by (subject, time)
// — multiple weekdays at the same time become ONE recurring event with
// multiple day flags. Different times become separate events.
// Slot labels (Practical/Theory/etc) are appended to the event title so
// parents can tell them apart in the calendar.
window.confirmTimetableImport=async function(){
  const data=S.timetablePreview;
  const ti=S.timetableImport;
  if(!data||!ti)return;
  if(!S.familyId){notify('No family loaded','⚠️');return;}
  const child=(S.children||[]).find(c=>c.id===ti.childId);
  if(!child){notify('Child not found','⚠️');return;}

  // Build a flat list of selected slots tagged with their parent subject name
  const selectedSlots=[];
  data.subjects.forEach(subj=>{
    (subj.slots||[]).forEach(sl=>{
      if(sl._selected)selectedSlots.push({...sl,_subjectName:subj.name||'Subject'});
    });
  });
  if(selectedSlots.length===0){notify('Pick at least one period','⚠️');return;}

  const btn=document.getElementById('commit-timetable-btn');
  if(btn){btn.disabled=true;btn.textContent='Importing…';}

  const dayKeyMap={mon:'Mon',tue:'Tue',wed:'Wed',thu:'Thu',fri:'Fri',sat:'Sat',sun:'Sun',
    monday:'Mon',tuesday:'Tue',wednesday:'Wed',thursday:'Thu',friday:'Fri',saturday:'Sat',sunday:'Sun'};
  const normaliseDay=d=>dayKeyMap[String(d||'').toLowerCase().trim()]||null;

  const todayStr=fd(new Date());

  // Build the event title — base subject name plus the label (Practical/Theory/etc)
  // when present, so PE Practical and PE Theory show distinctly on the calendar.
  const buildTitle=(subjectName,label,wkSuffix)=>{
    const labelPart=(label||'').trim();
    const base=labelPart?subjectName+' ('+labelPart+')':subjectName;
    return wkSuffix?base+' '+wkSuffix:base;
  };

  let success=0;let failed=0;

  if(ti.cycle==='weekly'){
    // Group by (subjectName + label + time) — slots with same labelling at
    // same time on different days become ONE event with multiple day flags.
    // Different labels → different events (PE Practical Mon 9am stays
    // separate from PE Theory Wed 9am even if times match).
    const groups=new Map();
    for(const sl of selectedSlots){
      const dayKey=normaliseDay(sl.day);
      if(!dayKey)continue;
      const key=sl._subjectName+'|'+(sl.label||'')+'|'+(sl.time||'');
      if(!groups.has(key))groups.set(key,{subjectName:sl._subjectName,label:sl.label||'',time:sl.time||'',days:new Set()});
      groups.get(key).days.add(dayKey);
    }
    for(const g of groups.values()){
      const days={Mon:false,Tue:false,Wed:false,Thu:false,Fri:false,Sat:false,Sun:false};
      g.days.forEach(d=>{days[d]=true;});
      try{
        await fadd(['events'],{
          title:buildTitle(g.subjectName,g.label,''),
          emoji:'📚',
          participantIds:[child.id],childId:child.id,adultUid:'',
          freq:'weekly',
          date:todayStr,startDate:todayStr,endDate:'',
          days,time:g.time,
          category:'school-subject',
          location:'',dropoff:'',pickup:'',
          packItems:[],notes:'Imported from timetable'
        });
        success++;
      }catch(e){failed++;console.warn('Timetable period failed:',g,e);}
    }
  }else{
    // Fortnightly: Week A and Week B are separate events because the recurrence
    // engine uses INTERVAL=2 from startDate. Group by (subjectName + label +
    // week + time). The user picks which week the uploaded timetable shows
    // (uploadWeek) and an anchor Monday for that week. If uploadWeek is B,
    // back-step 7 days to derive the matching Week A Monday.
    const anchor=ti.weekAStart||todayStr;
    const uploadWeek=ti.uploadWeek==='B'?'B':'A';
    let weekAStart;
    if(uploadWeek==='A'){
      weekAStart=anchor;
    }else{
      const a=new Date(anchor+'T12:00');a.setDate(a.getDate()-7);
      weekAStart=fd(a);
    }
    const wbDate=new Date(weekAStart+'T12:00');wbDate.setDate(wbDate.getDate()+7);
    const weekBStart=fd(wbDate);
    const groups=new Map();
    for(const sl of selectedSlots){
      const dayKey=normaliseDay(sl.day);
      if(!dayKey)continue;
      const wk=String(sl.week||'A').toUpperCase().startsWith('B')?'B':'A';
      const key=sl._subjectName+'|'+(sl.label||'')+'|'+wk+'|'+(sl.time||'');
      if(!groups.has(key))groups.set(key,{subjectName:sl._subjectName,label:sl.label||'',week:wk,time:sl.time||'',days:new Set()});
      groups.get(key).days.add(dayKey);
    }
    for(const g of groups.values()){
      const days={Mon:false,Tue:false,Wed:false,Thu:false,Fri:false,Sat:false,Sun:false};
      g.days.forEach(d=>{days[d]=true;});
      const startDate=g.week==='A'?weekAStart:weekBStart;
      try{
        await fadd(['events'],{
          title:buildTitle(g.subjectName,g.label,'Wk '+g.week),
          emoji:'📚',
          participantIds:[child.id],childId:child.id,adultUid:'',
          freq:'fortnightly',
          date:startDate,startDate,endDate:'',
          days,time:g.time,
          category:'school-subject',
          location:'',dropoff:'',pickup:'',
          packItems:[],notes:'Imported from timetable · Week '+g.week
        });
        success++;
      }catch(e){failed++;console.warn('Timetable period failed:',g,e);}
    }
  }

  S.timetablePreview=null;
  S.timetableImport=null;
  if(failed===0){notify('Imported '+success+' event'+(success===1?'':'s')+' ✅','📚');}
  else{notify('Imported '+success+' / failed '+failed,'⚠️');}
  S.screen=null;S.tab='events';S.evView='tiles';render();
};
