<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;background:#F2F2F7;display:flex;flex-direction:column}
#app{display:flex;flex-direction:column;width:100%;height:100%;overflow:hidden;position:relative}
.screen{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;background:#F2F2F7}
.scroll{overflow-y:auto;-ms-overflow-style:none;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{display:none}
.tabbar{background:rgba(249,249,249,0.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:0.5px solid rgba(0,0,0,0.15);display:flex;flex-shrink:0;padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 0 6px;border:none;background:transparent;cursor:pointer;gap:2px;font-family:inherit;font-size:10px;font-weight:500;color:#8E8E93;transition:color 0.15s;min-width:0}
.tab.active{color:#1C3A6B}
.card{background:#fff;border-radius:16px;margin:0 16px;box-shadow:0 1px 6px rgba(0,0,0,0.08);overflow:hidden}
.sh{padding:8px 16px 4px;font-size:12px;font-weight:700;color:#8E8E93;text-transform:uppercase;letter-spacing:0.6px}
.btn{border:none;cursor:pointer;font-family:inherit;background:none;-webkit-appearance:none}
.back-btn{border:none;cursor:pointer;color:#1C3A6B;font-size:17px;font-family:inherit;display:flex;align-items:center;gap:4px;padding:0;background:none;font-weight:500}
.primary-btn{width:100%;padding:16px;border:none;border-radius:14px;background:#1C3A6B;color:#fff;font-size:17px;font-weight:600;cursor:pointer;font-family:inherit;transition:opacity 0.15s}
.primary-btn:active{opacity:0.85}
.secondary-btn{width:100%;padding:16px;border:none;border-radius:14px;background:#F2F2F7;color:#1C1C1E;font-size:17px;font-weight:600;cursor:pointer;font-family:inherit}
.green-btn{width:100%;padding:16px;border:none;border-radius:14px;background:#34C759;color:#fff;font-size:17px;font-weight:600;cursor:pointer;font-family:inherit}
.danger-btn{width:100%;padding:15px;border:none;border-radius:14px;background:#FFF0EE;color:#FF3B30;font-size:17px;font-weight:600;cursor:pointer;font-family:inherit}
.input{width:100%;padding:14px 16px;border:1.5px solid #E5E5EA;border-radius:12px;font-size:16px;font-family:inherit;outline:none;background:#fff;-webkit-appearance:none;color:#1C1C1E}
.input:focus{border-color:#1C3A6B}
.err{color:#FF3B30;font-size:13px;text-align:center;min-height:16px;margin-top:2px}
.toggle{width:51px;height:31px;border-radius:16px;position:relative;cursor:pointer;transition:background 0.2s;flex-shrink:0;border:none;padding:0}
.tthumb{position:absolute;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,0.22);transition:left 0.2s}
.cb{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:all 0.15s;border:2px solid #C7C7CC}
.cb.on{border:none}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.fab{position:absolute;bottom:16px;right:16px;z-index:10}
.fab-btn{width:56px;height:56px;border-radius:28px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:28px;color:#fff;transition:all 0.2s;font-family:inherit;box-shadow:0 4px 20px rgba(28,58,107,0.45)}
.fab-menu{position:absolute;bottom:66px;right:0;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.fab-item{display:flex;align-items:center;gap:10px;padding:11px 18px;background:#1C1C1E;border-radius:24px;border:none;cursor:pointer;box-shadow:0 4px 20px rgba(0,0,0,0.3);font-family:inherit;color:#fff;font-size:15px;font-weight:600;white-space:nowrap}
.notif{position:absolute;top:12px;left:12px;right:12px;z-index:999;background:rgba(28,28,30,0.94);border-radius:16px;padding:12px 14px;box-shadow:0 8px 32px rgba(0,0,0,0.4);cursor:pointer;animation:sdown 0.35s cubic-bezier(.2,.8,.4,1)}
.pill{display:flex;align-items:center;gap:7px;padding:7px 14px 7px 7px;border-radius:24px;border:2px solid #E5E5EA;cursor:pointer;background:none;font-family:inherit;white-space:nowrap;transition:all 0.15s}
.pill.active{border-color:#1C3A6B;background:#EBF0FF}
.chev{display:inline-block;width:7px;height:7px;border-right:2px solid #C7C7CC;border-top:2px solid #C7C7CC;transform:rotate(45deg)}
.weather-card{background:linear-gradient(135deg,#1C3A6B,#2E5FBF);border-radius:16px;margin:0 16px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;color:#fff}
.badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px}
.row-item{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid #F2F2F7}
.row-item:last-child{border-bottom:none}
.spinner{width:32px;height:32px;border:3px solid #E5E5EA;border-top-color:#1C3A6B;border-radius:50%;animation:spin 0.75s linear infinite}
/* Top nav bar - replaces iOS status bar */
.topbar{background:#1C3A6B;padding:12px 20px 10px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;padding-top:max(12px, env(safe-area-inset-top))}
.topbar-logo{display:flex;align-items:center;gap:10px}
.topbar-title{font-size:20px;font-weight:800;color:#fff;letter-spacing:-0.3px}
@keyframes sdown{from{transform:translateY(-110%);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes packed{0%{transform:scale(0.95);opacity:0}60%{transform:scale(1.02)}100%{transform:scale(1);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.fadein{animation:fadein 0.2s ease}
</style>
</head>

const today=new Date();
function fd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
const todayStr=fd(today);

const S={

const $=id=>document.getElementById(id);
function av(name,color,size=36){
  const bg=color+'22',fs=Math.round(size*0.38),ini=(name||'?').split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
  return '<div class="av" style="width:'+size+'px;height:'+size+'px;background:'+bg+';border:2px solid '+color+';color:'+color+';font-size:'+fs+'px;flex-shrink:0">'+ini+'</div>';
}
function back(){return '<svg width="10" height="17" viewBox="0 0 10 17"><polyline points="9,1 1,8.5 9,16" stroke="'+NAVY+'" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';}
function chk(){return '<svg width="14" height="10" viewBox="0 0 14 10"><polyline points="1,5 5,9 13,1" stroke="white" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';}
function tog(val,fn){return '<button class="toggle" style="background:'+(val?'#34C759':'#E5E5EA')+'" onclick="'+fn+'"><div class="tthumb" style="left:'+(val?22:2)+'px"></div></button>';}

function showNotif(msg,icon='🏠'){
  if(S.notifTimer)clearTimeout(S.notifTimer);
  S.notif={msg,icon};_notif();
  S.notifTimer=setTimeout(()=>{S.notif=null;_notif();},4000);
}
function _notif(){
  document.querySelectorAll('.notif').forEach(e=>e.remove());
  if(!S.notif)return;

async function fetchWeather(){
  if(!navigator.geolocation||S.weather)return;
  navigator.geolocation.getCurrentPosition(async pos=>{
    try{
      const{latitude:lat,longitude:lon}=pos.coords;
      const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+'&current_weather=true&timezone=auto');
      const d=await r.json();
      const wc=d.current_weather?.weathercode||0;
      const temp=Math.round(d.current_weather?.temperature||20);
      const icons={0:'☀️',1:'🌤',2:'⛅',3:'☁️',45:'🌫',51:'🌦',61:'🌧',71:'❄️',80:'🌧',95:'⛈'};
      const descs={0:'Sunny',1:'Mostly sunny',2:'Partly cloudy',3:'Cloudy',45:'Foggy',51:'Drizzle',61:'Rainy',71:'Snowy',80:'Showers',95:'Thunderstorm'};
      const icon=icons[wc]||icons[Math.floor(wc/10)*10]||'🌤';
      const desc=descs[wc]||descs[Math.floor(wc/10)*10]||'Clear';
      S.weather={temp,icon,desc};render();
    }catch(e){}
  },()=>{});
}

async function createFamily(name){
  const code='HB-'+Math.random().toString(36).substr(2,6).toUpperCase();
  const ref=await addDoc(collection(db,'families'),{name,inviteCode:code,createdBy:S.user.uid,createdAt:new Date(),members:{[S.user.uid]:{name:S.user.displayName,role:'Admin',color:NAVY}}});
  await setDoc(doc(db,'users',S.user.uid),{familyId:ref.id,name:S.user.displayName,role:'Admin'});
  return ref.id;
}
async function joinFamily(code){
  const q=query(collection(db,'families'),where('inviteCode','==',code.trim().toUpperCase()));
  const snap=await getDocs(q);
  if(snap.empty)throw new Error('Family not found');
  const fid=snap.docs[0].id;
  const color=COLORS[Math.floor(Math.random()*COLORS.length)];
  await updateDoc(doc(db,'families',fid),{['members.'+S.user.uid]:{name:S.user.displayName,role:'Member',color}});
  await setDoc(doc(db,'users',S.user.uid),{familyId:fid,name:S.user.displayName,role:'Member'});
  return fid;
}

function subscribe(){
  S.unsubs.forEach(u=>u());S.unsubs=[];
  S.unsubs.push(onSnapshot(doc(db,'families',S.familyId),snap=>{S.family=snap.data();render();}));
  S.unsubs.push(onSnapshot(collection(db,'families',S.familyId,'children'),snap=>{
    S.children=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(!S.activeChild&&S.children.length)S.activeChild=S.children[0].id;
    S.children.forEach(c=>{
      const u=onSnapshot(collection(db,'families',S.familyId,'children',c.id,'packing'),ps=>{
        S.packing[c.id]=ps.docs.map(d=>({id:d.id,...d.data()}));render();
      });S.unsubs.push(u);
    });render();
  }));
  S.unsubs.push(onSnapshot(collection(db,'families',S.familyId,'events'),snap=>{S.events=snap.docs.map(d=>({id:d.id,...d.data()}));render();}));
  S.unsubs.push(onSnapshot(collection(db,'families',S.familyId,'notes'),snap=>{S.notes=snap.docs.map(d=>({id:d.id,...d.data()}));render();}));
  S.unsubs.push(onSnapshot(collection(db,'families',S.familyId,'assessments'),snap=>{S.assessments=snap.docs.map(d=>({id:d.id,...d.data()}));render();}));
  S.unsubs.push(onSnapshot(collection(db,'families',S.familyId,'groceries'),snap=>{S.groceries=snap.docs.map(d=>({id:d.id,...d.data()}));render();}));
  S.unsubs.push(onSnapshot(collection(db,'families',S.familyId,'gifts'),snap=>{S.gifts=snap.docs.map(d=>({id:d.id,...d.data()}));render();}));
}

  const pct=pk.length?packed/pk.length:0;
  const nxt=S.events.filter(e=>e.date===todayStr&&(!e.childId||e.childId===child.id)).sort((a,b)=>(a.time||'').localeCompare(b.time||''))[0];

    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px">

      </div>
      <button class="btn" onclick="S.morningMode=false;render()" style="background:rgba(255,255,255,0.22);border-radius:20px;padding:8px 18px;color:#fff;font-size:14px;font-weight:600">Done</button>
    </div>
    <div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:2px">

    <div style="display:flex;align-items:center;justify-content:space-between;padding:0 16px 10px">
      <div style="font-size:12px;font-weight:700;color:#8E8E93;text-transform:uppercase;letter-spacing:0.6px">Packing · ${packed}/${pk.length}</div>
      ${pct===1&&pk.length>0?'<span style="font-size:13px;font-weight:700;color:#34C759">All packed! ✅</span>':`<div style="height:4px;background:#E5E5EA;border-radius:2px;width:100px;overflow:hidden"><div style="height:100%;width:${pct*100}%;background:${color};border-radius:2px;transition:width 0.3s"></div></div>`}

    <div class="scroll" style="flex:1;overflow-y:auto">

        ${pk.length===0?`<div style="padding:24px;text-align:center;color:#8E8E93;font-size:15px">No packing items<br><button class="btn" onclick="nav('addPackItem',{childId:'${child.id}'})" style="color:#1C3A6B;margin-top:10px;font-size:15px;font-weight:600">+ Add items</button></div>`:''} 
        ${pk.map((item,i)=>`<div style="display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:${i<pk.length-1?'1px solid #F2F2F7':'none'}">

function renderCalendar(){
  const wStart=new Date(today);
  wStart.setDate(today.getDate()-today.getDay()+1+S.calWeekOffset*7);
  const wDates=Array.from({length:7},(_,i)=>{const d=new Date(wStart);d.setDate(wStart.getDate()+i);return d;});
  const sel=S.selectedDate||todayStr;
  const dayEvs=S.events.filter(e=>e.date===sel).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  return `<div style="background:#fff;padding:14px 20px 0;border-bottom:1px solid #F2F2F7;flex-shrink:0">
    <div style="font-size:26px;font-weight:800;letter-spacing:-0.5px;color:#1C1C1E;margin-bottom:12px">Calendar</div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <button class="btn" onclick="S.calWeekOffset--;render()" style="color:#1C3A6B;font-size:26px;font-weight:300;padding:0 12px">‹</button>
      <div style="font-size:15px;font-weight:700;color:#1C1C1E">${MONTHS[wStart.getMonth()]} ${wStart.getFullYear()}</div>
      <button class="btn" onclick="S.calWeekOffset++;render()" style="color:#1C3A6B;font-size:26px;font-weight:300;padding:0 12px">›</button>
    </div>
    <div style="display:flex;margin:0 -20px">
      ${wDates.map(d=>{
        const ds=fd(d),isSel=ds===sel,isTod=ds===todayStr,evs=S.events.filter(e=>e.date===ds);
        return `<button class="btn" onclick="S.selectedDate='${ds}';render()" style="flex:1;display:flex;flex-direction:column;align-items:center;padding:6px 2px 12px;border-bottom:${isSel?'3px solid #1C3A6B':'3px solid transparent'}">
          <div style="font-size:10px;color:${isSel?'#1C3A6B':isTod?'#FF3B30':'#8E8E93'};font-weight:500;margin-bottom:4px">${DAYSH[d.getDay()]}</div>
          <div style="width:32px;height:32px;border-radius:16px;background:${isSel?'#1C3A6B':'transparent'};display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;color:${isSel?'#fff':isTod?'#FF3B30':'#1C1C1E'}">${d.getDate()}</div>
          <div style="display:flex;gap:2px;margin-top:4px">${evs.slice(0,3).map(e=>{const ec=S.children.find(c=>c.id===e.childId);return `<div style="width:5px;height:5px;border-radius:3px;background:${ec?.color||NAVY}"></div>`;}).join('')}</div>
        </button>`;
      }).join('')}
    </div>
  </div>
  <div class="scroll" style="flex:1;overflow-y:auto;padding:14px 0 80px">
    ${dayEvs.length===0?`<div style="text-align:center;padding:60px 20px"><div style="font-size:56px;margin-bottom:14px">🎉</div><div style="font-size:18px;font-weight:700;color:#1C1C1E;margin-bottom:6px">Nothing on!</div><div style="font-size:15px;color:#8E8E93">Tap + to add an event</div></div>`:
    `<div class="sh" style="margin-bottom:10px">${new Date(sel+'T12:00').toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'long'})}</div>
    ${dayEvs.map(ev=>{
      const ec=S.children.find(c=>c.id===ev.childId),col=ec?.color||NAVY;
      return `<div style="width:calc(100% - 32px);margin:0 16px 10px;background:#fff;border-radius:16px;padding:14px 16px;box-shadow:0 1px 6px rgba(0,0,0,0.08)">
        <div style="display:flex;align-items:flex-start;gap:12px">
          <div style="font-size:30px;flex-shrink:0">${ev.emoji||'📅'}</div>
          <div style="flex:1">
            <div style="font-size:16px;font-weight:700;color:#1C1C1E">${ev.title}</div>
            ${ev.time?`<div style="font-size:13px;color:#8E8E93;margin-top:2px">⏰ ${ev.time}</div>`:''}
            ${ev.location?`<div style="font-size:13px;color:#8E8E93">📍 ${ev.location}</div>`:''}
            ${ev.dropoff?`<div style="font-size:13px;color:#8E8E93">Drop-off: ${ev.dropoff}</div>`:''}
            ${ev.pickup?`<div style="font-size:13px;color:#1C3A6B;font-weight:600">🚗 Pickup: ${ev.pickup}</div>`:''}
            ${ev.notes?`<div style="font-size:13px;color:#8E8E93;font-style:italic;margin-top:4px">${ev.notes}</div>`:''}
            ${ec?`<div style="margin-top:6px;display:flex;align-items:center;gap:6px">${av(ec.name,col,20)}<span style="font-size:12px;color:${col};font-weight:600">${ec.name}</span></div>`:''}

// Main render
function render(){
  const sc=$("screen"),tb=$("tabbar");
  if(!sc)return;
  const cur=S.stack[S.stack.length-1];
  let html="",showTabs=false;

  if(!S.user){
    tb.style.display="none";
    html=cur?.screen==="signup"?renderSignup():renderLogin();
  } else if(!S.familyId){
    tb.style.display="none";
    html=renderFamilySetup();
  } else if(cur){
    tb.style.display="none";
    const map={addChild:renderAddChild,addPackItem:()=>renderAddPackItem(cur.params),addEvent:renderAddEvent,addNote:renderAddNote,addAssessment:renderAddAssessment,addGrocery:renderAddGrocery,addGift:()=>renderAddGift(cur.params),signup:renderSignup,childProfile:renderFamily};
    html=(map[cur.screen]||renderToday)();
  } else {
    showTabs=true;tb.style.display="flex";
    const map={today:renderToday,calendar:renderCalendar,events:renderEvents,lists:renderLists,family:renderFamily,settings:renderSettings};
    html=(map[S.tab]||renderToday)();
  }

  sc.innerHTML=html;
  _notif();
  updateTopBar();

  if(showTabs){
    const TABS=[{id:"today",icon:"🏠",label:"Today"},{id:"calendar",icon:"📅",label:"Calendar"},{id:"events",icon:"📋",label:"Events"},{id:"lists",icon:"🛒",label:"Lists"},{id:"family",icon:"👨‍👩‍👧",label:"Family"},{id:"settings",icon:"⚙️",label:"Settings"}];
    tb.innerHTML=TABS.map(t=>`<button class="tab ${S.tab===t.id?"active":""}" onclick="setTab('${t.id}')"><span style="font-size:20px">${t.icon}</span>${t.label}</button>`).join("");
  }

  if(S.tab==="today"&&S.toggles.loc&&!S.weather)fetchWeather();
}

// Handlers
window.hLogin=async()=>{
  const e=$("le")?.value?.trim(),p=$("lp")?.value,err=$("lerr");
  if(!e||!p){if(err)err.textContent="Please fill in all fields";return;}
  try{await signInWithEmailAndPassword(auth,e,p);}
  catch(ex){if(err)err.textContent=ex.code==="auth/invalid-credential"?"Incorrect email or password":ex.message.replace("Firebase:","").replace(/\(.*\)/,"").trim();}
};
window.hGoogleLogin=async()=>{try{await signInWithPopup(auth,gProv);}catch(ex){console.log(ex);}};
window.hSignup=async()=>{
  const n=$("sn")?.value?.trim(),e=$("se")?.value?.trim(),p=$("sp")?.value,err=$("serr");
  if(!n||!e||!p){if(err)err.textContent="Please fill in all fields";return;}
  try{const c=await createUserWithEmailAndPassword(auth,e,p);await updateProfile(c.user,{displayName:n});S.user={...c.user,displayName:n};goBack();}
  catch(ex){if(err)err.textContent=ex.message.replace("Firebase:","").replace(/\(.*\)/,"").trim();}
};
window.hCreateFamily=async()=>{
  const n=$("fn")?.value?.trim(),err=$("ferr");
  if(!n){if(err)err.textContent="Please enter a family name";return;}
  try{S.familyId=await createFamily(n);subscribe();render();}catch(ex){if(err)err.textContent=ex.message;}
};
window.hJoinFamily=async()=>{
  const c=$("fc")?.value?.trim(),err=$("jerr");
  if(!c){if(err)err.textContent="Please enter a family code";return;}
  try{S.familyId=await joinFamily(c);subscribe();render();}catch(ex){if(err)err.textContent="Family not found. Check the code and try again.";}
};
window.hAddChild=async()=>{
  const name=$("cname")?.value?.trim(),dob=$("cdob")?.value,year=$("cyear")?.value?.trim(),school=$("cschool")?.value?.trim(),color=$("ccolor")?.value||NAVY,err=$("cerr");

  try{await addChild({name,dob,year,school,color});S.activeChild=null;goBack();showNotif(name+" added! 🎉");}catch(ex){if(err)err.textContent=ex.message;}
};
window.pickColor=c=>{$("ccolor").value=c;COLORS.forEach((col,i)=>{const el=$("col"+i);if(el)el.style.border=(col===c?"4px solid #1C1C1E":"4px solid transparent");});};
window.pickEmoji=e=>{$("eemoji").value=e;const EMJS=["📅","⚽","🏊","🎹","🎸","🎭","📚","🏃","🎨","🏋️","🚴","🎯","🏀","🎾","⚾","🧘","🎠","🎪","🏈","🎬","🎓","🏫","🎡","🎢"];document.querySelectorAll("[id^=\"ep\"]").forEach(el=>el.style.border="3px solid transparent");const i=EMJS.indexOf(e);if(i>=0){const el=$("ep"+i);if(el)el.style.border="3px solid #1C3A6B";}};
window.switchChild=id=>{S.activeChild=id;render();};
window.tPack=async(c,i,v)=>{try{await togglePack(c,i,v);}catch(ex){}};
window.dPack=async(c,i)=>{try{await deletePack(c,i);}catch(ex){}};
window.hAddPackItem=async cid=>{
  const label=$("pil")?.value?.trim(),section=$("pis")?.value||"school",err=$("pierr");
  if(!label){if(err)err.textContent="Please enter an item name";return;}
  try{await addPackItem(cid,label,section);goBack();showNotif("Item added ✅");}catch(ex){if(err)err.textContent=ex.message;}
};
window.hAddEvent=async()=>{
  const t=$("et")?.value?.trim(),d=$("edate")?.value,err=$("everr");
  if(!t||!d){if(err)err.textContent="Please enter a title and date";return;}
  try{await saveEvent({title:t,emoji:$("eemoji")?.value||"📅",type:$("etype")?.value,childId:$("echild")?.value||"",date:d,time:$("etime")?.value?.trim()||"",location:$("eloc")?.value?.trim()||"",dropoff:$("edrop")?.value?.trim()||"",pickup:$("epick")?.value?.trim()||"",notes:$("enotes")?.value?.trim()||""});goBack();showNotif("Event added 📅");}catch(ex){if(err)err.textContent=ex.message;}
};
window.dEvent=async id=>{try{await deleteEvent(id);showNotif("Event deleted","🗑️");}catch(ex){}};
window.hAddNote=async()=>{
  const text=$("ntext")?.value?.trim(),childId=$("nchild")?.value,err=$("nerr");
  if(!text){if(err)err.textContent="Please write a note";return;}
  try{await addNote({text,childId});goBack();showNotif("Note saved 📝");}catch(ex){if(err)err.textContent=ex.message;}
};
window.hAddAssessment=async()=>{
  const childId=$("achild")?.value,subj=$("asubj")?.value?.trim(),title=$("atitle")?.value?.trim(),due=$("adue")?.value,err=$("aerr");
  if(!title||!due){if(err)err.textContent="Please fill in title and due date";return;}
  const daysLeft=Math.ceil((new Date(due+"T12:00")-today)/86400000);
  const dueDisplay=new Date(due+"T12:00").toLocaleDateString("en-AU",{day:"numeric",month:"short"});
  try{await addAssessment({childId,subject:subj,title,due:dueDisplay,daysLeft});goBack();showNotif("Assessment added 📚");}catch(ex){if(err)err.textContent=ex.message;}
};
window.dAssessment=async id=>{try{await deleteAssessment(id);showNotif("Deleted","🗑️");}catch(ex){}};
window.tGroc=async(id,val)=>{try{await toggleGrocery(id,val);}catch(ex){}};
window.dGroc=async id=>{try{await deleteGrocery(id);}catch(ex){}};
window.clearDone=async()=>{const done=S.groceries.filter(g=>g.addedToList&&g.checked);for(const g of done)try{await deleteGrocery(g.id);}catch(ex){}showNotif("List cleared ✅");};
window.addFreq=async id=>{try{await updateDoc(doc(db,"families",S.familyId,"groceries",id),{addedToList:true});showNotif("Added to list ✅");}catch(ex){}};
let gIsFreq=false,gIsPriv=false;
window.toggleFreq=()=>{gIsFreq=!gIsFreq;const el=$("gfcb");if(el){el.style.background=gIsFreq?"#1C3A6B":"transparent";el.innerHTML=gIsFreq?chk():"";el.style.borderColor=gIsFreq?"#1C3A6B":"#C7C7CC";}};
window.togglePriv=()=>{gIsPriv=!gIsPriv;const el=$("gfpriv");if(el){el.style.background=gIsPriv?"#1C3A6B":"transparent";el.innerHTML=gIsPriv?chk():"";el.style.borderColor=gIsPriv?"#1C3A6B":"#C7C7CC";}};
window.hAddGrocery=async()=>{
  const label=$("gl")?.value?.trim(),qty=parseInt($("gq")?.value)||1,err=$("gerr");
  if(!label){if(err)err.textContent="Please enter an item";return;}
  try{await addGrocery({label,quantity:qty,isFrequent:gIsFreq,addedToList:true});gIsFreq=false;goBack();showNotif("Added to list 🛒");}catch(ex){if(err)err.textContent=ex.message;}
};
window.hAddGift=async rid=>{
  const label=$("gfl")?.value?.trim(),price=$("gfp")?.value,occasion=$("gfocc")?.value,err=$("gferr");
  if(!label){if(err)err.textContent="Please enter a gift idea";return;}
  try{await addGift({recipientId:rid,label,price:price?parseFloat(price):null,occasion,isPrivate:gIsPriv,createdBy:S.user.uid});gIsPriv=false;goBack();showNotif("Gift idea saved 🎁");}catch(ex){if(err)err.textContent=ex.message;}
};
window.dGift=async id=>{try{await deleteGift(id);}catch(ex){}};
window.hSignOut=async()=>{
  S.unsubs.forEach(u=>u());S.unsubs=[];
  Object.assign(S,{family:null,familyId:null,children:[],packing:{},events:[],notes:[],assessments:[],groceries:[],gifts:[],stack:[],tab:"today",morningMode:false,activeChild:null,fabOpen:false,notif:null,weather:null,eventsSubTab:"events",listSection:null});
  await signOut(auth);
};
window.copyCode=()=>{const c=S.family?.inviteCode;if(c&&navigator.clipboard)navigator.clipboard.writeText(c).then(()=>showNotif("Family code copied! 🔗"));else alert("Family code: "+(c||""));};
window.nav=nav;window.goBack=goBack;window.setTab=setTab;

onAuthStateChanged(auth,async user=>{
  S.user=user;
  if(user){
    try{const ud=await getDoc(doc(db,"users",user.uid));if(ud.exists()&&ud.data().familyId){S.familyId=ud.data().familyId;subscribe();}}catch(ex){}
  }
  render();
});
</script>
</body>
</html>
